  <!-- Title -->
  <text x="24" y="34" class="font-sans title">✦ Language Distribution</text>

  <!-- Central Star -->
  <circle cx="135" cy="145" r="15" fill="#F59E0B" filter="url(#glow-0)"/>
  <circle cx="135" cy="145" r="22" fill="none" stroke="#F59E0B" stroke-opacity="0.2" stroke-width="1">
    <animate attributeName="r" values="15;28;15" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Galaxy orbits and planets -->
  
    <!-- Python Orbit -->
    <circle cx="135" cy="145" r="36" class="gauge-bg" stroke-width="0.8" />
    <g style="transform-origin: 135px 145px; animation: spin-cw 14s linear infinite;">
      <circle cx="171" cy="145" r="16.9" fill="#3572A5" filter="url(#glow-0)" />
    </g>
    
    <!-- TypeScript Orbit -->
    <circle cx="135" cy="145" r="56" class="gauge-bg" stroke-width="0.8" />
    <g style="transform-origin: 135px 145px; animation: spin-cw 20s linear infinite;">
      <circle cx="191" cy="145" r="11.9" fill="#3178c6" filter="url(#glow-1)" />
    </g>
    
    <!-- JavaScript Orbit -->
    <circle cx="135" cy="145" r="74" class="gauge-bg" stroke-width="0.8" />
    <g style="transform-origin: 135px 145px; animation: spin-cw 28s linear infinite;">
      <circle cx="209" cy="145" r="4.7" fill="#f1e05a" filter="url(#glow-2)" />
    </g>
    
    <!-- Go Orbit -->
