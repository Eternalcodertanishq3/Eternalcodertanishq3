<circle cx="140" cy="183" r="0.5" fill="#38BDF8" opacity="0.22" style="animation: pulse 4.1s ease-in-out infinite 4.2s" />
<circle cx="387" cy="150" r="0.9" fill="#A5B4FC" opacity="0.74" style="animation: pulse 2.8s ease-in-out infinite 0.9s" />
<circle cx="53" cy="35" r="0.5" fill="#F8FAFC" opacity="0.70" style="animation: pulse 3.2s ease-in-out infinite 2.5s" />
<circle cx="370" cy="75" r="0.6" fill="#A5B4FC" opacity="0.57" style="animation: pulse 2.6s ease-in-out infinite 1.3s" />
<circle cx="167" cy="198" r="0.5" fill="#A5B4FC" opacity="0.29" style="animation: pulse 2.2s ease-in-out infinite 2.0s" />
<circle cx="399" cy="85" r="0.8" fill="#A5B4FC" opacity="0.54" style="animation: pulse 4.4s ease-in-out infinite 2.4s" />
<circle cx="202" cy="201" r="0.6" fill="#818CF8" opacity="0.83" style="animation: pulse 3.9s ease-in-out infinite 0.1s" />
<circle cx="39" cy="234" r="0.6" fill="#A5B4FC" opacity="0.25" style="animation: pulse 3.9s ease-in-out infinite 3.1s" />
<circle cx="276" cy="84" r="1.0" fill="#818CF8" opacity="0.74" style="animation: pulse 3.0s ease-in-out infinite 4.4s" />
<circle cx="272" cy="152" r="1.1" fill="#38BDF8" opacity="0.57" style="animation: pulse 4.1s ease-in-out infinite 0.3s" />
<circle cx="52" cy="38" r="0.6" fill="#818CF8" opacity="0.76" style="animation: pulse 2.4s ease-in-out infinite 3.3s" />
<circle cx="26" cy="203" r="1.1" fill="#A5B4FC" opacity="0.30" style="animation: pulse 2.9s ease-in-out infinite 2.1s" />
<circle cx="395" cy="200" r="1.0" fill="#818CF8" opacity="0.47" style="animation: pulse 3.2s ease-in-out infinite 2.6s" />
<circle cx="361" cy="4" r="0.6" fill="#A5B4FC" opacity="0.64" style="animation: pulse 3.5s ease-in-out infinite 1.8s" />
<circle cx="142" cy="266" r="0.5" fill="#38BDF8" opacity="0.65" style="animation: pulse 3.3s ease-in-out infinite 4.7s" />
<circle cx="81" cy="169" r="0.4" fill="#38BDF8" opacity="0.30" style="animation: pulse 3.0s ease-in-out infinite 0.2s" />
<circle cx="318" cy="247" r="1.0" fill="#F8FAFC" opacity="0.45" style="animation: pulse 2.3s ease-in-out infinite 3.8s" />
<circle cx="252" cy="46" r="0.8" fill="#F8FAFC" opacity="0.73" style="animation: pulse 5.0s ease-in-out infinite 0.0s" />
<circle cx="395" cy="212" r="1.2" fill="#A5B4FC" opacity="0.32" style="animation: pulse 5.0s ease-in-out infinite 3.9s" />
<circle cx="62" cy="113" r="0.9" fill="#A5B4FC" opacity="0.36" style="animation: pulse 4.1s ease-in-out infinite 0.1s" />
