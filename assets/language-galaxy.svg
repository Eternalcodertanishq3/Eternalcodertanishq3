  <circle cx="111" cy="268" r="1.1" fill="#38BDF8" opacity="0.28" style="animation: pulse 4.5s ease-in-out infinite 3.7s" />
<circle cx="344" cy="64" r="0.6" fill="#38BDF8" opacity="0.22" style="animation: pulse 4.2s ease-in-out infinite 0.1s" />
