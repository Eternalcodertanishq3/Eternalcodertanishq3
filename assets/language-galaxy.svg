  <circle cx="23" cy="203" r="0.8" fill="#818CF8" opacity="0.19" style="animation: pulse 4.4s ease-in-out infinite 0.9s" />
<circle cx="112" cy="242" r="0.6" fill="#818CF8" opacity="0.77" style="animation: pulse 3.4s ease-in-out infinite 0.2s" />
