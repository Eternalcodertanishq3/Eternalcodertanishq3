    <g style="transform-origin: 135px 145px; animation: spin-cw 50s linear infinite;">
      <circle cx="243" cy="145" r="4.1" fill="#00B4AB" filter="url(#glow-4)" />
    </g>
    

  <!-- Legend -->
  <g transform="translate(250, 10)" class="font-sans">
    
    <g transform="translate(0, 62)">
