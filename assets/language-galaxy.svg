  <!-- Central Star -->
  <circle cx="135" cy="145" r="15" fill="#F59E0B" filter="url(#glow-0)"/>
  <circle cx="135" cy="145" r="22" fill="none" stroke="#F59E0B" stroke-opacity="0.2" stroke-width="1">
    <animate attributeName="r" values="15;28;15" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Galaxy orbits and planets -->
  
    <!-- TypeScript Orbit -->
    <circle cx="135" cy="145" r="36" class="gauge-bg" stroke-width="0.8" />
    <g style="transform-origin: 135px 145px; animation: spin-cw 14s linear infinite;">
      <circle cx="171" cy="145" r="14.0" fill="#3178c6" filter="url(#glow-0)" />
    </g>
    
    <!-- Python Orbit -->
