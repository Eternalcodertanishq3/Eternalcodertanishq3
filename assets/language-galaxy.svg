<circle cx="204" cy="90" r="0.9" fill="#38BDF8" opacity="0.45" style="animation: pulse 3.8s ease-in-out infinite 0.8s" />
<circle cx="319" cy="183" r="0.6" fill="#F8FAFC" opacity="0.49" style="animation: pulse 3.9s ease-in-out infinite 1.1s" />
<circle cx="295" cy="98" r="0.8" fill="#F8FAFC" opacity="0.59" style="animation: pulse 2.8s ease-in-out infinite 2.3s" />
