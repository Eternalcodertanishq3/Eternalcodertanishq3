      <text x="16" y="9" class="font-mono stat-val" font-size="13">Rust</text>
      <text x="130" y="9" class="font-mono stat-lbl" font-size="12" text-anchor="end">17.3%</text>
      <rect x="16" y="16" width="114" height="3" rx="1.5" fill="#1E293B" />
      <rect x="16" y="16" width="20" height="3" rx="1.5" fill="#dea584" />
