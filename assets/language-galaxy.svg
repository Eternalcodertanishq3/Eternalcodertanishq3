<circle cx="149" cy="184" r="0.6" fill="#A5B4FC" opacity="0.46" style="animation: pulse 3.9s ease-in-out infinite 3.0s" />
<circle cx="29" cy="271" r="1.2" fill="#818CF8" opacity="0.47" style="animation: pulse 4.2s ease-in-out infinite 2.0s" />
<circle cx="70" cy="128" r="0.9" fill="#A5B4FC" opacity="0.57" style="animation: pulse 4.8s ease-in-out infinite 4.4s" />
<circle cx="256" cy="58" r="0.5" fill="#38BDF8" opacity="0.21" style="animation: pulse 2.0s ease-in-out infinite 3.9s" />
