<circle cx="376" cy="212" r="0.8" fill="#818CF8" opacity="0.64" style="animation: pulse 3.8s ease-in-out infinite 0.5s" />
<circle cx="97" cy="247" r="0.9" fill="#A5B4FC" opacity="0.66" style="animation: pulse 4.5s ease-in-out infinite 1.3s" />
