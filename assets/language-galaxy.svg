      <text x="130" y="9" class="font-mono stat-lbl" font-size="12" text-anchor="end">58.8%</text>
      <rect x="16" y="16" width="114" height="3" rx="1.5" fill="#1E293B" />
      <rect x="16" y="16" width="67" height="3" rx="1.5" fill="#3572A5" />
