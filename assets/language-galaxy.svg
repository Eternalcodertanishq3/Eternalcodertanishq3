      <text x="130" y="9" class="font-mono stat-lbl" font-size="12" text-anchor="end">40.4%</text>
      <rect x="16" y="16" width="114" height="3" rx="1.5" fill="#1E293B" />
      <rect x="16" y="16" width="46" height="3" rx="1.5" fill="#3178c6" />
