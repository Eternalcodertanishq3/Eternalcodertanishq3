<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.06"/>
    </pattern>
    <style>
      text{font-family:'Courier New',ui-monospace,monospace}
      .prompt{fill:#38BDF8}
      .out{fill:#E2E8F0}
      .dim{fill:#64748B}
      @keyframes reveal{0%{opacity:0;transform:translateY(4px)}100%{opacity:1;transform:translateY(0)}}
      .l1{animation:reveal .5s ease-out both .2s}
      .l2{animation:reveal .5s ease-out both 1.1s}
      .l3{animation:reveal .5s ease-out both 2.0s}
      .l4{animation:reveal .5s ease-out both 2.9s}
      .l5{animation:reveal .5s ease-out both 3.8s}
      .l6{animation:reveal .5s ease-out both 4.7s}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      .cursor{animation:blink 1s steps(1) infinite;animation-delay:5s}
    </style>
  </defs>

  <rect width="620" height="300" rx="14" fill="url(#tbg)" stroke="#1E293B" stroke-width="1.5"/>
  <rect width="620" height="300" rx="14" fill="url(#scan)"/>

  <rect width="620" height="34" rx="14" fill="#111C33"/>
  <rect y="20" width="620" height="14" fill="#111C33"/>
  <circle cx="24" cy="17" r="5.5" fill="#FF5F56"/>
  <circle cx="44" cy="17" r="5.5" fill="#FFBD2E"/>
  <circle cx="64" cy="17" r="5.5" fill="#27C93F"/>
  <text x="310" y="21" text-anchor="middle" font-size="12" class="dim">tanishq@github — zsh</text>

  <g font-size="15">
    <g class="l1"><text x="24" y="68" class="prompt">$</text><text x="42" y="68" class="out">whoami</text></g>
    <g class="l2"><text x="24" y="94" class="out">tanishq_mangal — full-stack + ai/ml engineer</text></g>

    <g class="l3"><text x="24" y="138" class="prompt">$</text><text x="42" y="138" class="out">cat status.txt</text></g>
    <g class="l4"><text x="24" y="164" class="out">building in public. shipping weekly.</text></g>

    <g class="l5"><text x="24" y="208" class="prompt">$</text><text x="42" y="208" class="out">./stack --core</text></g>
    <g class="l6"><text x="24" y="234" class="out">next.js · python · pytorch · rust · go</text></g>

    <g class="l6"><text x="24" y="278" class="prompt">$</text><text x="42" y="278" class="out">echo $STATUS</text><text x="200" y="278" class="prompt">open_to_full_time_roles</text><rect x="398" y="266" width="9" height="16" fill="#38BDF8" class="cursor"/></g>
  </g>
</svg>
