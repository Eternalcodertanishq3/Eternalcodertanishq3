<svg viewBox="0 0 680 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fill1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <style>
      text{font-family:ui-monospace,'Courier New',monospace}
      .label{fill:#E2E8F0;font-size:14px}
      .track{fill:#1E293B}
      @keyframes grow{from{width:0}to{width:var(--w)}}
      .bar{animation:grow 1.1s cubic-bezier(.16,1,.3,1) both}
      .b1{--w:392px;animation-delay:.1s}
      .b2{--w:360px;animation-delay:.3s}
      .b3{--w:300px;animation-delay:.5s}
      .b4{--w:328px;animation-delay:.7s}
    </style>
  </defs>
  <rect width="680" height="250" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
  <text x="24" y="38" class="label" font-size="15" font-weight="bold" fill="#F8FAFC">Where the hours go</text>

  <text x="24" y="76" class="label">Full-Stack Engineering</text>
  <rect x="24" y="86" width="400" height="10" rx="5" class="track"/>
  <rect x="24" y="86" height="10" rx="5" fill="url(#fill1)" class="bar b1"/>

  <text x="24" y="124" class="label">AI / Machine Learning</text>
  <rect x="24" y="134" width="400" height="10" rx="5" class="track"/>
  <rect x="24" y="134" height="10" rx="5" fill="url(#fill1)" class="bar b2"/>

  <text x="24" y="172" class="label">Systems Programming (Rust / Go)</text>
  <rect x="24" y="182" width="400" height="10" rx="5" class="track"/>
  <rect x="24" y="182" height="10" rx="5" fill="url(#fill1)" class="bar b3"/>

  <text x="24" y="220" class="label">Product &amp; UI Engineering</text>
  <rect x="24" y="230" width="400" height="10" rx="5" class="track"/>
  <rect x="24" y="230" height="10" rx="5" fill="url(#fill1)" class="bar b4"/>
</svg>
