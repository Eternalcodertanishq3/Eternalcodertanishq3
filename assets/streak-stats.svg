<svg viewBox="0 0 410 280" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <filter id="neonCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      .title { fill: #E2E8F0; font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
      .gauge-bg { stroke: #1E293B; stroke-opacity: 0.4; fill: none; }
      .stat-val { fill: #F8FAFC; font-weight: 700; }
      .stat-lbl { fill: #64748B; font-size: 11px; }
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .planet-rot { transform-origin: 135px 145px; }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="410" height="280" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="224" cy="155" r="0.8" fill="#38BDF8" opacity="0.79" style="animation: pulse 2.6s ease-in-out infinite 3.0s" />
<circle cx="43" cy="13" r="1.2" fill="#38BDF8" opacity="0.76" style="animation: pulse 4.5s ease-in-out infinite 4.6s" />
<circle cx="360" cy="131" r="0.6" fill="#F8FAFC" opacity="0.67" style="animation: pulse 3.1s ease-in-out infinite 2.3s" />
<circle cx="135" cy="127" r="0.6" fill="#F8FAFC" opacity="0.70" style="animation: pulse 2.9s ease-in-out infinite 1.8s" />
<circle cx="81" cy="38" r="0.8" fill="#818CF8" opacity="0.44" style="animation: pulse 4.9s ease-in-out infinite 3.9s" />
<circle cx="136" cy="24" r="0.7" fill="#818CF8" opacity="0.23" style="animation: pulse 2.1s ease-in-out infinite 4.4s" />
<circle cx="236" cy="112" r="0.5" fill="#A5B4FC" opacity="0.71" style="animation: pulse 3.4s ease-in-out infinite 0.9s" />
<circle cx="58" cy="201" r="1.0" fill="#818CF8" opacity="0.79" style="animation: pulse 4.5s ease-in-out infinite 2.8s" />
<circle cx="281" cy="129" r="0.6" fill="#38BDF8" opacity="0.39" style="animation: pulse 4.1s ease-in-out infinite 1.0s" />
<circle cx="254" cy="16" r="0.5" fill="#38BDF8" opacity="0.72" style="animation: pulse 2.0s ease-in-out infinite 3.5s" />
<circle cx="290" cy="209" r="0.6" fill="#F8FAFC" opacity="0.47" style="animation: pulse 2.2s ease-in-out infinite 3.6s" />
<circle cx="335" cy="247" r="1.1" fill="#A5B4FC" opacity="0.47" style="animation: pulse 3.2s ease-in-out infinite 1.8s" />
<circle cx="84" cy="26" r="0.4" fill="#38BDF8" opacity="0.60" style="animation: pulse 2.2s ease-in-out infinite 1.8s" />
<circle cx="112" cy="4" r="1.0" fill="#38BDF8" opacity="0.18" style="animation: pulse 4.8s ease-in-out infinite 2.1s" />
<circle cx="114" cy="165" r="0.9" fill="#F8FAFC" opacity="0.70" style="animation: pulse 3.1s ease-in-out infinite 2.8s" />
<circle cx="261" cy="272" r="0.7" fill="#818CF8" opacity="0.29" style="animation: pulse 4.8s ease-in-out infinite 3.0s" />
<circle cx="205" cy="186" r="0.6" fill="#F8FAFC" opacity="0.31" style="animation: pulse 4.1s ease-in-out infinite 1.3s" />
<circle cx="101" cy="278" r="1.2" fill="#A5B4FC" opacity="0.84" style="animation: pulse 3.4s ease-in-out infinite 0.3s" />
<circle cx="302" cy="96" r="1.0" fill="#818CF8" opacity="0.80" style="animation: pulse 3.5s ease-in-out infinite 0.5s" />
<circle cx="12" cy="72" r="0.5" fill="#A5B4FC" opacity="0.60" style="animation: pulse 3.3s ease-in-out infinite 2.4s" />
<circle cx="39" cy="123" r="0.8" fill="#A5B4FC" opacity="0.40" style="animation: pulse 3.2s ease-in-out infinite 0.5s" />
<circle cx="28" cy="149" r="1.2" fill="#38BDF8" opacity="0.15" style="animation: pulse 3.2s ease-in-out infinite 4.6s" />
<circle cx="98" cy="129" r="1.1" fill="#38BDF8" opacity="0.68" style="animation: pulse 4.8s ease-in-out infinite 4.3s" />
<circle cx="305" cy="55" r="0.6" fill="#F8FAFC" opacity="0.80" style="animation: pulse 4.5s ease-in-out infinite 4.8s" />
<circle cx="243" cy="126" r="0.9" fill="#F8FAFC" opacity="0.58" style="animation: pulse 2.5s ease-in-out infinite 2.7s" />
<circle cx="210" cy="8" r="1.1" fill="#38BDF8" opacity="0.50" style="animation: pulse 2.2s ease-in-out infinite 1.8s" />
<circle cx="165" cy="170" r="0.6" fill="#38BDF8" opacity="0.34" style="animation: pulse 3.3s ease-in-out infinite 3.2s" />
<circle cx="144" cy="169" r="1.1" fill="#F8FAFC" opacity="0.18" style="animation: pulse 4.0s ease-in-out infinite 2.4s" />
<circle cx="220" cy="7" r="0.4" fill="#A5B4FC" opacity="0.65" style="animation: pulse 3.5s ease-in-out infinite 1.5s" />
<circle cx="162" cy="90" r="1.0" fill="#F8FAFC" opacity="0.76" style="animation: pulse 5.0s ease-in-out infinite 3.3s" />


  <!-- Title -->
  <text x="24" y="34" class="font-sans title">✦ Contribution Streaks</text>

  <!-- Radial Gauge Dials -->
  <circle cx="135" cy="145" r="75" class="gauge-bg" stroke-width="5" />
  <circle cx="135" cy="145" r="75" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" fill="none"
          stroke-dasharray="471.23889803846896" stroke-dashoffset="70.68583470577035" transform="rotate(-90 135 145)" filter="url(#neonCyan)" />

  <circle cx="135" cy="145" r="55" class="gauge-bg" stroke-width="5" />
  <circle cx="135" cy="145" r="55" stroke="#818CF8" stroke-width="5" stroke-linecap="round" fill="none"
          stroke-dasharray="345.57519189487726" stroke-dashoffset="0" transform="rotate(-90 135 145)" filter="url(#neonPurple)" />

  <circle cx="135" cy="145" r="35" class="gauge-bg" stroke-width="5" />
  <circle cx="135" cy="145" r="35" stroke="#C084FC" stroke-width="5" stroke-linecap="round" fill="none"
          stroke-dasharray="219.9114857512855" stroke-dashoffset="0" transform="rotate(-90 135 145)" filter="url(#neonPink)" />

  <!-- Center planet in the gauge -->
  <circle cx="135" cy="145" r="18" fill="#1E1B4B" stroke="#818CF8" stroke-width="1"/>
  <text x="135" y="150" text-anchor="middle" fill="#38BDF8" font-size="12" font-weight="900" class="font-mono">76d</text>

  <!-- Small rotating planet on the outer orbit -->
  <g class="planet-rot" style="animation: spin-cw 20s linear infinite;">
    <circle cx="210" cy="145" r="4" fill="#38BDF8" filter="url(#neonCyan)" />
  </g>

  <!-- Stats Legend List -->
  <g transform="translate(250, 75)" class="font-sans">
    <!-- Stat 1: Total -->
    <circle cx="0" cy="5" r="5" fill="#38BDF8" filter="url(#neonCyan)" />
    <text x="16" y="8" class="font-mono stat-val" font-size="17">983</text>
    <text x="16" y="24" class="stat-lbl">TOTAL COMMITS</text>

    <!-- Stat 2: Longest -->
    <g transform="translate(0, 52)">
      <circle cx="0" cy="5" r="5" fill="#818CF8" filter="url(#neonPurple)" />
      <text x="16" y="8" class="font-mono stat-val" font-size="17">76 DAYS</text>
      <text x="16" y="24" class="stat-lbl">LONGEST STREAK</text>
    </g>

    <!-- Stat 3: Current -->
    <g transform="translate(0, 104)">
      <circle cx="0" cy="5" r="5" fill="#C084FC" filter="url(#neonPink)" />
      <text x="16" y="8" class="font-mono stat-val" font-size="17">76 DAYS</text>
      <text x="16" y="24" class="stat-lbl">CURRENT STREAK</text>
    </g>
  </g>
</svg>