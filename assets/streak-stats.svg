<svg viewBox="0 0 410 280" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <filter id="neonCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      .title { fill: #E2E8F0; font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
      .gauge-bg { stroke: #1E293B; stroke-opacity: 0.4; fill: none; }
      .stat-val { fill: #F8FAFC; font-weight: 700; }
      .stat-lbl { fill: #64748B; font-size: 11px; }
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .planet-rot { transform-origin: 135px 145px; }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="410" height="280" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="332" cy="9" r="1.1" fill="#F8FAFC" opacity="0.42" style="animation: pulse 3.1s ease-in-out infinite 2.4s" />
<circle cx="345" cy="109" r="0.8" fill="#818CF8" opacity="0.71" style="animation: pulse 3.3s ease-in-out infinite 3.7s" />
<circle cx="304" cy="103" r="0.7" fill="#A5B4FC" opacity="0.33" style="animation: pulse 3.1s ease-in-out infinite 1.8s" />
<circle cx="44" cy="25" r="0.5" fill="#A5B4FC" opacity="0.77" style="animation: pulse 2.8s ease-in-out infinite 1.0s" />
<circle cx="190" cy="162" r="0.5" fill="#F8FAFC" opacity="0.84" style="animation: pulse 4.7s ease-in-out infinite 4.6s" />
<circle cx="159" cy="33" r="0.9" fill="#A5B4FC" opacity="0.74" style="animation: pulse 4.7s ease-in-out infinite 0.6s" />
<circle cx="79" cy="189" r="0.8" fill="#818CF8" opacity="0.32" style="animation: pulse 2.1s ease-in-out infinite 1.7s" />
<circle cx="269" cy="130" r="1.0" fill="#38BDF8" opacity="0.64" style="animation: pulse 3.7s ease-in-out infinite 0.2s" />
<circle cx="346" cy="130" r="0.8" fill="#818CF8" opacity="0.41" style="animation: pulse 4.8s ease-in-out infinite 1.2s" />
<circle cx="151" cy="159" r="1.1" fill="#38BDF8" opacity="0.81" style="animation: pulse 2.4s ease-in-out infinite 3.5s" />
<circle cx="387" cy="63" r="0.6" fill="#38BDF8" opacity="0.19" style="animation: pulse 2.5s ease-in-out infinite 1.1s" />
<circle cx="85" cy="114" r="1.2" fill="#F8FAFC" opacity="0.60" style="animation: pulse 4.7s ease-in-out infinite 0.3s" />
<circle cx="13" cy="243" r="1.0" fill="#A5B4FC" opacity="0.55" style="animation: pulse 3.3s ease-in-out infinite 4.0s" />
<circle cx="157" cy="224" r="0.7" fill="#38BDF8" opacity="0.64" style="animation: pulse 2.8s ease-in-out infinite 1.8s" />
<circle cx="50" cy="187" r="0.9" fill="#818CF8" opacity="0.64" style="animation: pulse 3.9s ease-in-out infinite 2.1s" />
<circle cx="364" cy="195" r="1.0" fill="#A5B4FC" opacity="0.26" style="animation: pulse 4.5s ease-in-out infinite 4.1s" />
<circle cx="198" cy="115" r="0.4" fill="#818CF8" opacity="0.33" style="animation: pulse 4.1s ease-in-out infinite 4.4s" />
<circle cx="96" cy="119" r="0.9" fill="#A5B4FC" opacity="0.26" style="animation: pulse 3.3s ease-in-out infinite 0.5s" />
<circle cx="143" cy="12" r="1.1" fill="#818CF8" opacity="0.41" style="animation: pulse 4.0s ease-in-out infinite 3.0s" />
<circle cx="153" cy="135" r="1.2" fill="#F8FAFC" opacity="0.54" style="animation: pulse 3.5s ease-in-out infinite 4.3s" />
<circle cx="97" cy="182" r="0.7" fill="#38BDF8" opacity="0.52" style="animation: pulse 4.0s ease-in-out infinite 1.0s" />
<circle cx="309" cy="169" r="0.8" fill="#A5B4FC" opacity="0.41" style="animation: pulse 2.6s ease-in-out infinite 4.3s" />
<circle cx="3" cy="58" r="1.0" fill="#38BDF8" opacity="0.18" style="animation: pulse 2.2s ease-in-out infinite 1.8s" />
<circle cx="322" cy="197" r="1.1" fill="#F8FAFC" opacity="0.36" style="animation: pulse 2.9s ease-in-out infinite 0.7s" />
<circle cx="62" cy="143" r="1.1" fill="#F8FAFC" opacity="0.47" style="animation: pulse 4.5s ease-in-out infinite 1.3s" />
<circle cx="128" cy="26" r="0.9" fill="#F8FAFC" opacity="0.52" style="animation: pulse 4.0s ease-in-out infinite 0.2s" />
<circle cx="84" cy="109" r="1.0" fill="#38BDF8" opacity="0.19" style="animation: pulse 3.5s ease-in-out infinite 0.9s" />
<circle cx="296" cy="17" r="1.0" fill="#F8FAFC" opacity="0.41" style="animation: pulse 2.4s ease-in-out infinite 0.5s" />
<circle cx="246" cy="155" r="0.9" fill="#F8FAFC" opacity="0.24" style="animation: pulse 3.1s ease-in-out infinite 2.8s" />
<circle cx="365" cy="207" r="1.1" fill="#818CF8" opacity="0.42" style="animation: pulse 3.7s ease-in-out infinite 4.5s" />


  <!-- Title -->
  <text x="24" y="34" class="font-sans title">✦ Contribution Streaks</text>

  <!-- Radial Gauge Dials -->
  <circle cx="135" cy="145" r="75" class="gauge-bg" stroke-width="5" />
  <circle cx="135" cy="145" r="75" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" fill="none"
          stroke-dasharray="471.23889803846896" stroke-dashoffset="70.68583470577035" transform="rotate(-90 135 145)" filter="url(#neonCyan)" />

  <circle cx="135" cy="145" r="55" class="gauge-bg" stroke-width="5" />
  <circle cx="135" cy="145" r="55" stroke="#818CF8" stroke-width="5" stroke-linecap="round" fill="none"
          stroke-dasharray="345.57519189487726" stroke-dashoffset="0" transform="rotate(-90 135 145)" filter="url(#neonPurple)" />

  <circle cx="135" cy="145" r="35" class="gauge-bg" stroke-width="5" />
  <circle cx="135" cy="145" r="35" stroke="#C084FC" stroke-width="5" stroke-linecap="round" fill="none"
          stroke-dasharray="219.9114857512855" stroke-dashoffset="0" transform="rotate(-90 135 145)" filter="url(#neonPink)" />

  <!-- Center planet in the gauge -->
  <circle cx="135" cy="145" r="18" fill="#1E1B4B" stroke="#818CF8" stroke-width="1"/>
  <text x="135" y="150" text-anchor="middle" fill="#38BDF8" font-size="12" font-weight="900" class="font-mono">59d</text>

  <!-- Small rotating planet on the outer orbit -->
  <g class="planet-rot" style="animation: spin-cw 20s linear infinite;">
    <circle cx="210" cy="145" r="4" fill="#38BDF8" filter="url(#neonCyan)" />
  </g>

  <!-- Stats Legend List -->
  <g transform="translate(250, 75)" class="font-sans">
    <!-- Stat 1: Total -->
    <circle cx="0" cy="5" r="5" fill="#38BDF8" filter="url(#neonCyan)" />
    <text x="16" y="8" class="font-mono stat-val" font-size="17">978</text>
    <text x="16" y="24" class="stat-lbl">TOTAL COMMITS</text>

    <!-- Stat 2: Longest -->
    <g transform="translate(0, 52)">
      <circle cx="0" cy="5" r="5" fill="#818CF8" filter="url(#neonPurple)" />
      <text x="16" y="8" class="font-mono stat-val" font-size="17">59 DAYS</text>
      <text x="16" y="24" class="stat-lbl">LONGEST STREAK</text>
    </g>

    <!-- Stat 3: Current -->
    <g transform="translate(0, 104)">
      <circle cx="0" cy="5" r="5" fill="#C084FC" filter="url(#neonPink)" />
      <text x="16" y="8" class="font-mono stat-val" font-size="17">59 DAYS</text>
      <text x="16" y="24" class="stat-lbl">CURRENT STREAK</text>
    </g>
  </g>
</svg>