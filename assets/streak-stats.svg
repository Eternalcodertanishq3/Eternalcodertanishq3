<svg viewBox="0 0 410 280" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <filter id="neonCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      .title { fill: #E2E8F0; font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
      .gauge-bg { stroke: #1E293B; stroke-opacity: 0.4; fill: none; }
      .stat-val { fill: #F8FAFC; font-weight: 700; }
      .stat-lbl { fill: #64748B; font-size: 11px; }
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .planet-rot { transform-origin: 135px 145px; }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="410" height="280" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="318" cy="188" r="0.4" fill="#A5B4FC" opacity="0.20" style="animation: pulse 3.3s ease-in-out infinite 1.2s" />
<circle cx="186" cy="28" r="1.2" fill="#A5B4FC" opacity="0.75" style="animation: pulse 3.7s ease-in-out infinite 4.3s" />
<circle cx="60" cy="266" r="1.2" fill="#818CF8" opacity="0.70" style="animation: pulse 3.6s ease-in-out infinite 1.0s" />
<circle cx="135" cy="134" r="0.5" fill="#A5B4FC" opacity="0.43" style="animation: pulse 3.1s ease-in-out infinite 1.1s" />
<circle cx="397" cy="29" r="0.6" fill="#F8FAFC" opacity="0.42" style="animation: pulse 3.6s ease-in-out infinite 4.1s" />
<circle cx="55" cy="238" r="1.1" fill="#818CF8" opacity="0.35" style="animation: pulse 3.0s ease-in-out infinite 2.9s" />
<circle cx="367" cy="77" r="0.4" fill="#818CF8" opacity="0.78" style="animation: pulse 3.7s ease-in-out infinite 2.7s" />
<circle cx="152" cy="252" r="0.6" fill="#818CF8" opacity="0.82" style="animation: pulse 4.0s ease-in-out infinite 3.7s" />
<circle cx="156" cy="148" r="1.0" fill="#F8FAFC" opacity="0.70" style="animation: pulse 2.0s ease-in-out infinite 2.7s" />
<circle cx="283" cy="139" r="0.8" fill="#38BDF8" opacity="0.57" style="animation: pulse 3.5s ease-in-out infinite 2.1s" />
<circle cx="232" cy="13" r="0.6" fill="#38BDF8" opacity="0.44" style="animation: pulse 3.9s ease-in-out infinite 2.5s" />
<circle cx="92" cy="224" r="1.0" fill="#F8FAFC" opacity="0.72" style="animation: pulse 3.4s ease-in-out infinite 2.3s" />
<circle cx="296" cy="43" r="0.7" fill="#A5B4FC" opacity="0.23" style="animation: pulse 4.5s ease-in-out infinite 1.1s" />
<circle cx="263" cy="48" r="0.4" fill="#38BDF8" opacity="0.30" style="animation: pulse 2.1s ease-in-out infinite 3.2s" />
<circle cx="10" cy="75" r="0.4" fill="#818CF8" opacity="0.50" style="animation: pulse 4.2s ease-in-out infinite 2.2s" />
<circle cx="347" cy="52" r="0.5" fill="#A5B4FC" opacity="0.24" style="animation: pulse 3.7s ease-in-out infinite 0.7s" />
<circle cx="372" cy="236" r="0.8" fill="#F8FAFC" opacity="0.69" style="animation: pulse 3.7s ease-in-out infinite 1.9s" />
<circle cx="184" cy="64" r="1.0" fill="#F8FAFC" opacity="0.42" style="animation: pulse 3.6s ease-in-out infinite 3.6s" />
<circle cx="14" cy="75" r="0.5" fill="#F8FAFC" opacity="0.66" style="animation: pulse 2.4s ease-in-out infinite 0.5s" />
<circle cx="372" cy="23" r="1.0" fill="#818CF8" opacity="0.64" style="animation: pulse 3.2s ease-in-out infinite 1.8s" />
<circle cx="187" cy="115" r="0.8" fill="#A5B4FC" opacity="0.23" style="animation: pulse 3.4s ease-in-out infinite 3.9s" />
<circle cx="223" cy="241" r="0.4" fill="#818CF8" opacity="0.23" style="animation: pulse 4.6s ease-in-out infinite 0.5s" />
<circle cx="354" cy="16" r="0.5" fill="#A5B4FC" opacity="0.37" style="animation: pulse 4.5s ease-in-out infinite 2.9s" />
<circle cx="300" cy="110" r="0.4" fill="#38BDF8" opacity="0.52" style="animation: pulse 2.4s ease-in-out infinite 4.1s" />
<circle cx="363" cy="114" r="0.5" fill="#F8FAFC" opacity="0.22" style="animation: pulse 3.6s ease-in-out infinite 5.0s" />
<circle cx="14" cy="147" r="1.1" fill="#38BDF8" opacity="0.24" style="animation: pulse 3.6s ease-in-out infinite 1.8s" />
<circle cx="167" cy="74" r="0.7" fill="#F8FAFC" opacity="0.53" style="animation: pulse 3.3s ease-in-out infinite 2.5s" />
<circle cx="217" cy="134" r="1.0" fill="#818CF8" opacity="0.68" style="animation: pulse 2.6s ease-in-out infinite 0.7s" />
<circle cx="398" cy="51" r="1.1" fill="#38BDF8" opacity="0.29" style="animation: pulse 4.5s ease-in-out infinite 2.5s" />
<circle cx="295" cy="230" r="0.5" fill="#38BDF8" opacity="0.53" style="animation: pulse 4.1s ease-in-out infinite 4.4s" />


  <!-- Title -->
  <text x="24" y="34" class="font-sans title">✦ Contribution Streaks</text>

  <!-- Radial Gauge Dials -->
  <circle cx="135" cy="145" r="75" class="gauge-bg" stroke-width="5" />
  <circle cx="135" cy="145" r="75" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" fill="none"
          stroke-dasharray="471.23889803846896" stroke-dashoffset="70.68583470577035" transform="rotate(-90 135 145)" filter="url(#neonCyan)" />

  <circle cx="135" cy="145" r="55" class="gauge-bg" stroke-width="5" />
  <circle cx="135" cy="145" r="55" stroke="#818CF8" stroke-width="5" stroke-linecap="round" fill="none"
          stroke-dasharray="345.57519189487726" stroke-dashoffset="80.63421144213801" transform="rotate(-90 135 145)" filter="url(#neonPurple)" />

  <circle cx="135" cy="145" r="35" class="gauge-bg" stroke-width="5" />
  <circle cx="135" cy="145" r="35" stroke="#C084FC" stroke-width="5" stroke-linecap="round" fill="none"
          stroke-dasharray="219.9114857512855" stroke-dashoffset="51.31268000863327" transform="rotate(-90 135 145)" filter="url(#neonPink)" />

  <!-- Center planet in the gauge -->
  <circle cx="135" cy="145" r="18" fill="#1E1B4B" stroke="#818CF8" stroke-width="1"/>
  <text x="135" y="150" text-anchor="middle" fill="#38BDF8" font-size="12" font-weight="900" class="font-mono">23d</text>

  <!-- Small rotating planet on the outer orbit -->
  <g class="planet-rot" style="animation: spin-cw 20s linear infinite;">
    <circle cx="210" cy="145" r="4" fill="#38BDF8" filter="url(#neonCyan)" />
  </g>

  <!-- Stats Legend List -->
  <g transform="translate(250, 75)" class="font-sans">
    <!-- Stat 1: Total -->
    <circle cx="0" cy="5" r="5" fill="#38BDF8" filter="url(#neonCyan)" />
    <text x="16" y="8" class="font-mono stat-val" font-size="17">674</text>
    <text x="16" y="24" class="stat-lbl">TOTAL COMMITS</text>

    <!-- Stat 2: Longest -->
    <g transform="translate(0, 52)">
      <circle cx="0" cy="5" r="5" fill="#818CF8" filter="url(#neonPurple)" />
      <text x="16" y="8" class="font-mono stat-val" font-size="17">23 DAYS</text>
      <text x="16" y="24" class="stat-lbl">LONGEST STREAK</text>
    </g>

    <!-- Stat 3: Current -->
    <g transform="translate(0, 104)">
      <circle cx="0" cy="5" r="5" fill="#C084FC" filter="url(#neonPink)" />
      <text x="16" y="8" class="font-mono stat-val" font-size="17">23 DAYS</text>
      <text x="16" y="24" class="stat-lbl">CURRENT STREAK</text>
    </g>
  </g>
</svg>