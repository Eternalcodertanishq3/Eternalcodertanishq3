<svg viewBox="0 0 410 280" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <filter id="neonCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      .title { fill: #E2E8F0; font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
      .gauge-bg { stroke: #1E293B; stroke-opacity: 0.4; fill: none; }
      .stat-val { fill: #F8FAFC; font-weight: 700; }
      .stat-lbl { fill: #64748B; font-size: 11px; }
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .planet-rot { transform-origin: 135px 145px; }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="410" height="280" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="86" cy="215" r="1.1" fill="#F8FAFC" opacity="0.24" style="animation: pulse 4.9s ease-in-out infinite 2.8s" />
<circle cx="0" cy="257" r="0.4" fill="#F8FAFC" opacity="0.60" style="animation: pulse 2.7s ease-in-out infinite 1.8s" />
<circle cx="41" cy="218" r="1.2" fill="#A5B4FC" opacity="0.28" style="animation: pulse 3.2s ease-in-out infinite 2.8s" />
<circle cx="82" cy="27" r="0.5" fill="#F8FAFC" opacity="0.50" style="animation: pulse 2.5s ease-in-out infinite 2.3s" />
<circle cx="295" cy="244" r="1.0" fill="#F8FAFC" opacity="0.39" style="animation: pulse 4.9s ease-in-out infinite 2.2s" />
<circle cx="278" cy="39" r="1.1" fill="#38BDF8" opacity="0.43" style="animation: pulse 4.8s ease-in-out infinite 4.7s" />
<circle cx="395" cy="69" r="1.0" fill="#F8FAFC" opacity="0.24" style="animation: pulse 4.6s ease-in-out infinite 3.1s" />
<circle cx="221" cy="73" r="0.8" fill="#38BDF8" opacity="0.20" style="animation: pulse 4.2s ease-in-out infinite 0.8s" />
<circle cx="306" cy="110" r="0.5" fill="#818CF8" opacity="0.45" style="animation: pulse 3.2s ease-in-out infinite 5.0s" />
<circle cx="374" cy="171" r="1.1" fill="#818CF8" opacity="0.43" style="animation: pulse 2.3s ease-in-out infinite 4.4s" />
<circle cx="37" cy="4" r="1.0" fill="#A5B4FC" opacity="0.83" style="animation: pulse 3.6s ease-in-out infinite 2.1s" />
<circle cx="256" cy="214" r="1.0" fill="#38BDF8" opacity="0.84" style="animation: pulse 5.0s ease-in-out infinite 2.9s" />
<circle cx="14" cy="216" r="0.9" fill="#38BDF8" opacity="0.63" style="animation: pulse 4.4s ease-in-out infinite 4.7s" />
<circle cx="78" cy="169" r="0.6" fill="#818CF8" opacity="0.48" style="animation: pulse 2.1s ease-in-out infinite 4.3s" />
<circle cx="323" cy="241" r="0.8" fill="#818CF8" opacity="0.72" style="animation: pulse 4.2s ease-in-out infinite 4.4s" />
<circle cx="104" cy="53" r="1.0" fill="#F8FAFC" opacity="0.84" style="animation: pulse 3.9s ease-in-out infinite 3.6s" />
<circle cx="127" cy="254" r="0.5" fill="#38BDF8" opacity="0.48" style="animation: pulse 4.3s ease-in-out infinite 3.6s" />
<circle cx="240" cy="227" r="0.5" fill="#38BDF8" opacity="0.45" style="animation: pulse 2.9s ease-in-out infinite 4.2s" />
<circle cx="282" cy="181" r="0.6" fill="#818CF8" opacity="0.40" style="animation: pulse 3.6s ease-in-out infinite 4.7s" />
<circle cx="336" cy="220" r="0.9" fill="#818CF8" opacity="0.68" style="animation: pulse 4.9s ease-in-out infinite 0.1s" />
<circle cx="317" cy="15" r="0.8" fill="#818CF8" opacity="0.63" style="animation: pulse 3.0s ease-in-out infinite 0.8s" />
<circle cx="276" cy="65" r="0.8" fill="#F8FAFC" opacity="0.57" style="animation: pulse 4.5s ease-in-out infinite 2.9s" />
<circle cx="41" cy="142" r="0.4" fill="#A5B4FC" opacity="0.52" style="animation: pulse 2.6s ease-in-out infinite 0.5s" />
<circle cx="311" cy="144" r="0.4" fill="#38BDF8" opacity="0.79" style="animation: pulse 3.5s ease-in-out infinite 4.3s" />
<circle cx="278" cy="60" r="1.1" fill="#38BDF8" opacity="0.60" style="animation: pulse 3.3s ease-in-out infinite 2.6s" />
<circle cx="247" cy="93" r="0.9" fill="#F8FAFC" opacity="0.60" style="animation: pulse 4.1s ease-in-out infinite 4.8s" />
<circle cx="320" cy="257" r="0.4" fill="#818CF8" opacity="0.82" style="animation: pulse 2.9s ease-in-out infinite 1.3s" />
<circle cx="112" cy="164" r="0.4" fill="#A5B4FC" opacity="0.22" style="animation: pulse 4.5s ease-in-out infinite 4.1s" />
<circle cx="53" cy="263" r="0.7" fill="#818CF8" opacity="0.54" style="animation: pulse 4.2s ease-in-out infinite 4.7s" />
<circle cx="189" cy="233" r="0.7" fill="#818CF8" opacity="0.20" style="animation: pulse 4.3s ease-in-out infinite 2.3s" />


  <!-- Title -->
  <text x="24" y="34" class="font-sans title">✦ Contribution Streaks</text>

  <!-- Radial Gauge Dials -->
  <circle cx="135" cy="145" r="75" class="gauge-bg" stroke-width="5" />
  <circle cx="135" cy="145" r="75" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" fill="none"
          stroke-dasharray="471.23889803846896" stroke-dashoffset="70.68583470577035" transform="rotate(-90 135 145)" filter="url(#neonCyan)" />

  <circle cx="135" cy="145" r="55" class="gauge-bg" stroke-width="5" />
  <circle cx="135" cy="145" r="55" stroke="#818CF8" stroke-width="5" stroke-linecap="round" fill="none"
          stroke-dasharray="345.57519189487726" stroke-dashoffset="103.67255756846319" transform="rotate(-90 135 145)" filter="url(#neonPurple)" />

  <circle cx="135" cy="145" r="35" class="gauge-bg" stroke-width="5" />
  <circle cx="135" cy="145" r="35" stroke="#C084FC" stroke-width="5" stroke-linecap="round" fill="none"
          stroke-dasharray="219.9114857512855" stroke-dashoffset="65.97344572538566" transform="rotate(-90 135 145)" filter="url(#neonPink)" />

  <!-- Center planet in the gauge -->
  <circle cx="135" cy="145" r="18" fill="#1E1B4B" stroke="#818CF8" stroke-width="1"/>
  <text x="135" y="150" text-anchor="middle" fill="#38BDF8" font-size="12" font-weight="900" class="font-mono">21d</text>

  <!-- Small rotating planet on the outer orbit -->
  <g class="planet-rot" style="animation: spin-cw 20s linear infinite;">
    <circle cx="210" cy="145" r="4" fill="#38BDF8" filter="url(#neonCyan)" />
  </g>

  <!-- Stats Legend List -->
  <g transform="translate(250, 75)" class="font-sans">
    <!-- Stat 1: Total -->
    <circle cx="0" cy="5" r="5" fill="#38BDF8" filter="url(#neonCyan)" />
    <text x="16" y="8" class="font-mono stat-val" font-size="17">656</text>
    <text x="16" y="24" class="stat-lbl">TOTAL COMMITS</text>

    <!-- Stat 2: Longest -->
    <g transform="translate(0, 52)">
      <circle cx="0" cy="5" r="5" fill="#818CF8" filter="url(#neonPurple)" />
      <text x="16" y="8" class="font-mono stat-val" font-size="17">21 DAYS</text>
      <text x="16" y="24" class="stat-lbl">LONGEST STREAK</text>
    </g>

    <!-- Stat 3: Current -->
    <g transform="translate(0, 104)">
      <circle cx="0" cy="5" r="5" fill="#C084FC" filter="url(#neonPink)" />
      <text x="16" y="8" class="font-mono stat-val" font-size="17">21 DAYS</text>
      <text x="16" y="24" class="stat-lbl">CURRENT STREAK</text>
    </g>
  </g>
</svg>