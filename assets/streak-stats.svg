<svg viewBox="0 0 410 280" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <filter id="neonCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      .title { fill: #E2E8F0; font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
      .gauge-bg { stroke: #1E293B; stroke-opacity: 0.4; fill: none; }
      .stat-val { fill: #F8FAFC; font-weight: 700; }
      .stat-lbl { fill: #64748B; font-size: 11px; }
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .planet-rot { transform-origin: 135px 145px; }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="410" height="280" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="97" cy="158" r="0.9" fill="#818CF8" opacity="0.37" style="animation: pulse 2.4s ease-in-out infinite 2.5s" />
<circle cx="210" cy="5" r="0.5" fill="#818CF8" opacity="0.52" style="animation: pulse 2.5s ease-in-out infinite 1.3s" />
<circle cx="55" cy="20" r="1.0" fill="#818CF8" opacity="0.29" style="animation: pulse 3.0s ease-in-out infinite 2.4s" />
<circle cx="198" cy="131" r="0.9" fill="#A5B4FC" opacity="0.51" style="animation: pulse 4.3s ease-in-out infinite 1.2s" />
<circle cx="134" cy="31" r="1.0" fill="#A5B4FC" opacity="0.51" style="animation: pulse 2.8s ease-in-out infinite 0.4s" />
<circle cx="225" cy="153" r="0.4" fill="#818CF8" opacity="0.27" style="animation: pulse 3.6s ease-in-out infinite 1.0s" />
<circle cx="247" cy="260" r="0.9" fill="#38BDF8" opacity="0.36" style="animation: pulse 4.2s ease-in-out infinite 2.3s" />
<circle cx="108" cy="165" r="0.5" fill="#38BDF8" opacity="0.65" style="animation: pulse 2.6s ease-in-out infinite 4.9s" />
<circle cx="401" cy="74" r="0.4" fill="#F8FAFC" opacity="0.54" style="animation: pulse 4.3s ease-in-out infinite 4.9s" />
<circle cx="40" cy="10" r="1.0" fill="#38BDF8" opacity="0.16" style="animation: pulse 2.4s ease-in-out infinite 1.9s" />
<circle cx="176" cy="141" r="0.8" fill="#F8FAFC" opacity="0.54" style="animation: pulse 2.1s ease-in-out infinite 2.4s" />
<circle cx="165" cy="140" r="1.0" fill="#A5B4FC" opacity="0.63" style="animation: pulse 4.8s ease-in-out infinite 2.2s" />
<circle cx="10" cy="184" r="0.5" fill="#F8FAFC" opacity="0.28" style="animation: pulse 3.1s ease-in-out infinite 3.2s" />
<circle cx="31" cy="46" r="0.5" fill="#38BDF8" opacity="0.61" style="animation: pulse 4.4s ease-in-out infinite 3.0s" />
<circle cx="208" cy="113" r="0.8" fill="#818CF8" opacity="0.21" style="animation: pulse 3.2s ease-in-out infinite 0.4s" />
<circle cx="311" cy="19" r="0.5" fill="#818CF8" opacity="0.66" style="animation: pulse 3.4s ease-in-out infinite 2.3s" />
<circle cx="162" cy="2" r="0.5" fill="#F8FAFC" opacity="0.59" style="animation: pulse 4.9s ease-in-out infinite 1.3s" />
<circle cx="280" cy="36" r="0.8" fill="#38BDF8" opacity="0.51" style="animation: pulse 3.7s ease-in-out infinite 3.9s" />
<circle cx="28" cy="164" r="0.5" fill="#38BDF8" opacity="0.84" style="animation: pulse 2.9s ease-in-out infinite 3.1s" />
<circle cx="261" cy="175" r="0.7" fill="#F8FAFC" opacity="0.35" style="animation: pulse 4.0s ease-in-out infinite 4.5s" />
<circle cx="83" cy="236" r="1.1" fill="#F8FAFC" opacity="0.64" style="animation: pulse 4.1s ease-in-out infinite 2.9s" />
<circle cx="340" cy="6" r="1.1" fill="#38BDF8" opacity="0.29" style="animation: pulse 4.4s ease-in-out infinite 4.4s" />
<circle cx="333" cy="150" r="0.7" fill="#F8FAFC" opacity="0.83" style="animation: pulse 4.4s ease-in-out infinite 4.1s" />
<circle cx="381" cy="180" r="1.0" fill="#38BDF8" opacity="0.20" style="animation: pulse 3.1s ease-in-out infinite 1.4s" />
<circle cx="107" cy="242" r="0.9" fill="#818CF8" opacity="0.76" style="animation: pulse 2.6s ease-in-out infinite 1.9s" />
<circle cx="147" cy="130" r="0.5" fill="#38BDF8" opacity="0.79" style="animation: pulse 5.0s ease-in-out infinite 4.0s" />
<circle cx="361" cy="93" r="0.9" fill="#38BDF8" opacity="0.84" style="animation: pulse 4.0s ease-in-out infinite 3.8s" />
<circle cx="371" cy="93" r="0.5" fill="#38BDF8" opacity="0.38" style="animation: pulse 3.0s ease-in-out infinite 1.3s" />
<circle cx="399" cy="65" r="0.8" fill="#A5B4FC" opacity="0.53" style="animation: pulse 3.4s ease-in-out infinite 1.0s" />
<circle cx="185" cy="163" r="1.1" fill="#38BDF8" opacity="0.72" style="animation: pulse 2.4s ease-in-out infinite 2.4s" />


  <!-- Title -->
  <text x="24" y="34" class="font-sans title">✦ Contribution Streaks</text>

  <!-- Radial Gauge Dials -->
  <circle cx="135" cy="145" r="75" class="gauge-bg" stroke-width="5" />
  <circle cx="135" cy="145" r="75" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" fill="none"
          stroke-dasharray="471.23889803846896" stroke-dashoffset="70.68583470577035" transform="rotate(-90 135 145)" filter="url(#neonCyan)" />

  <circle cx="135" cy="145" r="55" class="gauge-bg" stroke-width="5" />
  <circle cx="135" cy="145" r="55" stroke="#818CF8" stroke-width="5" stroke-linecap="round" fill="none"
          stroke-dasharray="345.57519189487726" stroke-dashoffset="253.42180738957668" transform="rotate(-90 135 145)" filter="url(#neonPurple)" />

  <circle cx="135" cy="145" r="35" class="gauge-bg" stroke-width="5" />
  <circle cx="135" cy="145" r="35" stroke="#C084FC" stroke-width="5" stroke-linecap="round" fill="none"
          stroke-dasharray="219.9114857512855" stroke-dashoffset="161.26842288427605" transform="rotate(-90 135 145)" filter="url(#neonPink)" />

  <!-- Center planet in the gauge -->
  <circle cx="135" cy="145" r="18" fill="#1E1B4B" stroke="#818CF8" stroke-width="1"/>
  <text x="135" y="150" text-anchor="middle" fill="#38BDF8" font-size="12" font-weight="900" class="font-mono">8d</text>

  <!-- Small rotating planet on the outer orbit -->
  <g class="planet-rot" style="animation: spin-cw 20s linear infinite;">
    <circle cx="210" cy="145" r="4" fill="#38BDF8" filter="url(#neonCyan)" />
  </g>

  <!-- Stats Legend List -->
  <g transform="translate(250, 75)" class="font-sans">
    <!-- Stat 1: Total -->
    <circle cx="0" cy="5" r="5" fill="#38BDF8" filter="url(#neonCyan)" />
    <text x="16" y="8" class="font-mono stat-val" font-size="17">336</text>
    <text x="16" y="24" class="stat-lbl">TOTAL COMMITS</text>

    <!-- Stat 2: Longest -->
    <g transform="translate(0, 52)">
      <circle cx="0" cy="5" r="5" fill="#818CF8" filter="url(#neonPurple)" />
      <text x="16" y="8" class="font-mono stat-val" font-size="17">8 DAYS</text>
      <text x="16" y="24" class="stat-lbl">LONGEST STREAK</text>
    </g>

    <!-- Stat 3: Current -->
    <g transform="translate(0, 104)">
      <circle cx="0" cy="5" r="5" fill="#C084FC" filter="url(#neonPink)" />
      <text x="16" y="8" class="font-mono stat-val" font-size="17">8 DAYS</text>
      <text x="16" y="24" class="stat-lbl">CURRENT STREAK</text>
    </g>
  </g>
</svg>