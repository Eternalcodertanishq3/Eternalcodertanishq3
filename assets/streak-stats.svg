<svg viewBox="0 0 410 280" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <filter id="neonCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      .title { fill: #E2E8F0; font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
      .gauge-bg { stroke: #1E293B; stroke-opacity: 0.4; fill: none; }
      .stat-val { fill: #F8FAFC; font-weight: 700; }
      .stat-lbl { fill: #64748B; font-size: 11px; }
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .planet-rot { transform-origin: 135px 145px; }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="410" height="280" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="202" cy="205" r="1.2" fill="#F8FAFC" opacity="0.60" style="animation: pulse 2.3s ease-in-out infinite 3.9s" />
<circle cx="16" cy="234" r="0.7" fill="#38BDF8" opacity="0.15" style="animation: pulse 3.7s ease-in-out infinite 3.8s" />
<circle cx="118" cy="80" r="1.1" fill="#38BDF8" opacity="0.23" style="animation: pulse 4.3s ease-in-out infinite 0.2s" />
<circle cx="75" cy="214" r="0.7" fill="#38BDF8" opacity="0.74" style="animation: pulse 2.7s ease-in-out infinite 4.7s" />
<circle cx="211" cy="128" r="0.8" fill="#F8FAFC" opacity="0.46" style="animation: pulse 3.9s ease-in-out infinite 3.1s" />
<circle cx="301" cy="271" r="0.9" fill="#A5B4FC" opacity="0.67" style="animation: pulse 2.2s ease-in-out infinite 3.0s" />
<circle cx="47" cy="22" r="0.6" fill="#38BDF8" opacity="0.74" style="animation: pulse 3.1s ease-in-out infinite 3.7s" />
<circle cx="248" cy="142" r="1.0" fill="#A5B4FC" opacity="0.19" style="animation: pulse 2.3s ease-in-out infinite 3.2s" />
<circle cx="190" cy="103" r="1.0" fill="#38BDF8" opacity="0.44" style="animation: pulse 2.9s ease-in-out infinite 4.3s" />
<circle cx="85" cy="51" r="1.2" fill="#A5B4FC" opacity="0.43" style="animation: pulse 2.8s ease-in-out infinite 4.8s" />
<circle cx="147" cy="59" r="0.7" fill="#A5B4FC" opacity="0.62" style="animation: pulse 4.9s ease-in-out infinite 1.8s" />
<circle cx="46" cy="243" r="0.7" fill="#818CF8" opacity="0.42" style="animation: pulse 2.9s ease-in-out infinite 3.1s" />
<circle cx="328" cy="2" r="0.4" fill="#A5B4FC" opacity="0.65" style="animation: pulse 4.5s ease-in-out infinite 2.6s" />
<circle cx="239" cy="67" r="1.1" fill="#818CF8" opacity="0.46" style="animation: pulse 4.7s ease-in-out infinite 4.8s" />
<circle cx="14" cy="146" r="1.0" fill="#38BDF8" opacity="0.62" style="animation: pulse 4.7s ease-in-out infinite 0.2s" />
<circle cx="229" cy="213" r="0.7" fill="#38BDF8" opacity="0.16" style="animation: pulse 3.6s ease-in-out infinite 2.7s" />
<circle cx="37" cy="44" r="0.5" fill="#818CF8" opacity="0.20" style="animation: pulse 2.4s ease-in-out infinite 1.4s" />
<circle cx="273" cy="28" r="0.5" fill="#F8FAFC" opacity="0.62" style="animation: pulse 4.2s ease-in-out infinite 1.9s" />
<circle cx="33" cy="100" r="1.0" fill="#F8FAFC" opacity="0.32" style="animation: pulse 4.0s ease-in-out infinite 2.3s" />
<circle cx="8" cy="41" r="1.0" fill="#38BDF8" opacity="0.21" style="animation: pulse 4.4s ease-in-out infinite 1.9s" />
<circle cx="39" cy="77" r="0.5" fill="#38BDF8" opacity="0.20" style="animation: pulse 3.0s ease-in-out infinite 3.4s" />
<circle cx="47" cy="202" r="0.9" fill="#38BDF8" opacity="0.40" style="animation: pulse 3.4s ease-in-out infinite 1.6s" />
<circle cx="267" cy="161" r="1.0" fill="#38BDF8" opacity="0.70" style="animation: pulse 2.2s ease-in-out infinite 3.6s" />
<circle cx="386" cy="120" r="0.8" fill="#A5B4FC" opacity="0.61" style="animation: pulse 4.1s ease-in-out infinite 3.6s" />
<circle cx="18" cy="230" r="0.6" fill="#38BDF8" opacity="0.76" style="animation: pulse 3.0s ease-in-out infinite 2.4s" />
<circle cx="113" cy="264" r="0.9" fill="#A5B4FC" opacity="0.41" style="animation: pulse 3.5s ease-in-out infinite 3.4s" />
<circle cx="132" cy="191" r="0.7" fill="#A5B4FC" opacity="0.70" style="animation: pulse 2.8s ease-in-out infinite 1.7s" />
<circle cx="78" cy="237" r="1.1" fill="#818CF8" opacity="0.75" style="animation: pulse 2.2s ease-in-out infinite 1.9s" />
<circle cx="354" cy="186" r="0.5" fill="#38BDF8" opacity="0.79" style="animation: pulse 2.4s ease-in-out infinite 1.7s" />
<circle cx="325" cy="216" r="0.5" fill="#818CF8" opacity="0.17" style="animation: pulse 3.3s ease-in-out infinite 1.1s" />


  <!-- Title -->
  <text x="24" y="34" class="font-sans title">✦ Contribution Streaks</text>

  <!-- Radial Gauge Dials -->
  <circle cx="135" cy="145" r="75" class="gauge-bg" stroke-width="5" />
  <circle cx="135" cy="145" r="75" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" fill="none"
          stroke-dasharray="471.23889803846896" stroke-dashoffset="70.68583470577035" transform="rotate(-90 135 145)" filter="url(#neonCyan)" />

  <circle cx="135" cy="145" r="55" class="gauge-bg" stroke-width="5" />
  <circle cx="135" cy="145" r="55" stroke="#818CF8" stroke-width="5" stroke-linecap="round" fill="none"
          stroke-dasharray="345.57519189487726" stroke-dashoffset="0" transform="rotate(-90 135 145)" filter="url(#neonPurple)" />

  <circle cx="135" cy="145" r="35" class="gauge-bg" stroke-width="5" />
  <circle cx="135" cy="145" r="35" stroke="#C084FC" stroke-width="5" stroke-linecap="round" fill="none"
          stroke-dasharray="219.9114857512855" stroke-dashoffset="0" transform="rotate(-90 135 145)" filter="url(#neonPink)" />

  <!-- Center planet in the gauge -->
  <circle cx="135" cy="145" r="18" fill="#1E1B4B" stroke="#818CF8" stroke-width="1"/>
  <text x="135" y="150" text-anchor="middle" fill="#38BDF8" font-size="12" font-weight="900" class="font-mono">107d</text>

  <!-- Small rotating planet on the outer orbit -->
  <g class="planet-rot" style="animation: spin-cw 20s linear infinite;">
    <circle cx="210" cy="145" r="4" fill="#38BDF8" filter="url(#neonCyan)" />
  </g>

  <!-- Stats Legend List -->
  <g transform="translate(250, 75)" class="font-sans">
    <!-- Stat 1: Total -->
    <circle cx="0" cy="5" r="5" fill="#38BDF8" filter="url(#neonCyan)" />
    <text x="16" y="8" class="font-mono stat-val" font-size="17">1126</text>
    <text x="16" y="24" class="stat-lbl">TOTAL COMMITS</text>

    <!-- Stat 2: Longest -->
    <g transform="translate(0, 52)">
      <circle cx="0" cy="5" r="5" fill="#818CF8" filter="url(#neonPurple)" />
      <text x="16" y="8" class="font-mono stat-val" font-size="17">107 DAYS</text>
      <text x="16" y="24" class="stat-lbl">LONGEST STREAK</text>
    </g>

    <!-- Stat 3: Current -->
    <g transform="translate(0, 104)">
      <circle cx="0" cy="5" r="5" fill="#C084FC" filter="url(#neonPink)" />
      <text x="16" y="8" class="font-mono stat-val" font-size="17">107 DAYS</text>
      <text x="16" y="24" class="stat-lbl">CURRENT STREAK</text>
    </g>
  </g>
</svg>