<svg viewBox="0 0 410 280" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <filter id="neonCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      .title { fill: #E2E8F0; font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
      .gauge-bg { stroke: #1E293B; stroke-opacity: 0.4; fill: none; }
      .stat-val { fill: #F8FAFC; font-weight: 700; }
      .stat-lbl { fill: #64748B; font-size: 11px; }
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .planet-rot { transform-origin: 135px 145px; }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="410" height="280" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="318" cy="16" r="0.4" fill="#818CF8" opacity="0.60" style="animation: pulse 4.3s ease-in-out infinite 2.3s" />
<circle cx="248" cy="222" r="1.0" fill="#38BDF8" opacity="0.53" style="animation: pulse 3.0s ease-in-out infinite 3.7s" />
<circle cx="317" cy="270" r="0.8" fill="#38BDF8" opacity="0.51" style="animation: pulse 2.7s ease-in-out infinite 0.2s" />
<circle cx="19" cy="186" r="0.8" fill="#38BDF8" opacity="0.23" style="animation: pulse 2.9s ease-in-out infinite 3.1s" />
<circle cx="73" cy="96" r="1.0" fill="#A5B4FC" opacity="0.51" style="animation: pulse 4.0s ease-in-out infinite 4.6s" />
<circle cx="16" cy="90" r="1.0" fill="#818CF8" opacity="0.75" style="animation: pulse 2.5s ease-in-out infinite 1.7s" />
<circle cx="298" cy="79" r="0.5" fill="#A5B4FC" opacity="0.60" style="animation: pulse 4.7s ease-in-out infinite 0.2s" />
<circle cx="357" cy="203" r="0.6" fill="#F8FAFC" opacity="0.59" style="animation: pulse 4.8s ease-in-out infinite 2.7s" />
<circle cx="39" cy="18" r="0.5" fill="#A5B4FC" opacity="0.36" style="animation: pulse 2.9s ease-in-out infinite 1.5s" />
<circle cx="228" cy="19" r="0.8" fill="#F8FAFC" opacity="0.53" style="animation: pulse 3.8s ease-in-out infinite 5.0s" />
<circle cx="49" cy="180" r="0.7" fill="#38BDF8" opacity="0.49" style="animation: pulse 3.6s ease-in-out infinite 1.7s" />
<circle cx="89" cy="129" r="0.7" fill="#818CF8" opacity="0.29" style="animation: pulse 3.1s ease-in-out infinite 2.5s" />
<circle cx="221" cy="11" r="1.1" fill="#F8FAFC" opacity="0.56" style="animation: pulse 3.9s ease-in-out infinite 2.8s" />
<circle cx="335" cy="223" r="0.5" fill="#818CF8" opacity="0.37" style="animation: pulse 3.8s ease-in-out infinite 3.5s" />
<circle cx="14" cy="269" r="0.9" fill="#A5B4FC" opacity="0.22" style="animation: pulse 3.5s ease-in-out infinite 2.9s" />
<circle cx="93" cy="185" r="0.5" fill="#F8FAFC" opacity="0.41" style="animation: pulse 3.0s ease-in-out infinite 2.0s" />
<circle cx="67" cy="273" r="0.8" fill="#818CF8" opacity="0.36" style="animation: pulse 2.9s ease-in-out infinite 3.6s" />
<circle cx="255" cy="228" r="0.5" fill="#F8FAFC" opacity="0.24" style="animation: pulse 4.5s ease-in-out infinite 0.6s" />
<circle cx="122" cy="250" r="1.0" fill="#F8FAFC" opacity="0.50" style="animation: pulse 2.6s ease-in-out infinite 3.5s" />
<circle cx="374" cy="32" r="0.7" fill="#38BDF8" opacity="0.65" style="animation: pulse 4.5s ease-in-out infinite 1.6s" />
<circle cx="166" cy="99" r="1.0" fill="#38BDF8" opacity="0.46" style="animation: pulse 2.1s ease-in-out infinite 3.0s" />
<circle cx="137" cy="89" r="0.6" fill="#818CF8" opacity="0.71" style="animation: pulse 2.6s ease-in-out infinite 0.4s" />
<circle cx="158" cy="277" r="1.0" fill="#818CF8" opacity="0.64" style="animation: pulse 3.6s ease-in-out infinite 3.0s" />
<circle cx="233" cy="98" r="0.6" fill="#F8FAFC" opacity="0.73" style="animation: pulse 4.9s ease-in-out infinite 4.8s" />
<circle cx="306" cy="128" r="0.7" fill="#818CF8" opacity="0.82" style="animation: pulse 4.6s ease-in-out infinite 1.2s" />
<circle cx="268" cy="274" r="0.9" fill="#818CF8" opacity="0.66" style="animation: pulse 3.6s ease-in-out infinite 3.8s" />
<circle cx="38" cy="248" r="0.8" fill="#818CF8" opacity="0.50" style="animation: pulse 4.1s ease-in-out infinite 0.3s" />
<circle cx="233" cy="111" r="0.5" fill="#F8FAFC" opacity="0.28" style="animation: pulse 3.7s ease-in-out infinite 4.6s" />
<circle cx="405" cy="186" r="1.2" fill="#F8FAFC" opacity="0.77" style="animation: pulse 4.2s ease-in-out infinite 4.2s" />
<circle cx="171" cy="94" r="0.4" fill="#F8FAFC" opacity="0.82" style="animation: pulse 4.1s ease-in-out infinite 4.4s" />


  <!-- Title -->
  <text x="24" y="34" class="font-sans title">✦ Contribution Streaks</text>

  <!-- Radial Gauge Dials -->
  <circle cx="135" cy="145" r="75" class="gauge-bg" stroke-width="5" />
  <circle cx="135" cy="145" r="75" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" fill="none"
          stroke-dasharray="471.23889803846896" stroke-dashoffset="70.68583470577035" transform="rotate(-90 135 145)" filter="url(#neonCyan)" />

  <circle cx="135" cy="145" r="55" class="gauge-bg" stroke-width="5" />
  <circle cx="135" cy="145" r="55" stroke="#818CF8" stroke-width="5" stroke-linecap="round" fill="none"
          stroke-dasharray="345.57519189487726" stroke-dashoffset="0" transform="rotate(-90 135 145)" filter="url(#neonPurple)" />

  <circle cx="135" cy="145" r="35" class="gauge-bg" stroke-width="5" />
  <circle cx="135" cy="145" r="35" stroke="#C084FC" stroke-width="5" stroke-linecap="round" fill="none"
          stroke-dasharray="219.9114857512855" stroke-dashoffset="0" transform="rotate(-90 135 145)" filter="url(#neonPink)" />

  <!-- Center planet in the gauge -->
  <circle cx="135" cy="145" r="18" fill="#1E1B4B" stroke="#818CF8" stroke-width="1"/>
  <text x="135" y="150" text-anchor="middle" fill="#38BDF8" font-size="12" font-weight="900" class="font-mono">58d</text>

  <!-- Small rotating planet on the outer orbit -->
  <g class="planet-rot" style="animation: spin-cw 20s linear infinite;">
    <circle cx="210" cy="145" r="4" fill="#38BDF8" filter="url(#neonCyan)" />
  </g>

  <!-- Stats Legend List -->
  <g transform="translate(250, 75)" class="font-sans">
    <!-- Stat 1: Total -->
    <circle cx="0" cy="5" r="5" fill="#38BDF8" filter="url(#neonCyan)" />
    <text x="16" y="8" class="font-mono stat-val" font-size="17">974</text>
    <text x="16" y="24" class="stat-lbl">TOTAL COMMITS</text>

    <!-- Stat 2: Longest -->
    <g transform="translate(0, 52)">
      <circle cx="0" cy="5" r="5" fill="#818CF8" filter="url(#neonPurple)" />
      <text x="16" y="8" class="font-mono stat-val" font-size="17">58 DAYS</text>
      <text x="16" y="24" class="stat-lbl">LONGEST STREAK</text>
    </g>

    <!-- Stat 3: Current -->
    <g transform="translate(0, 104)">
      <circle cx="0" cy="5" r="5" fill="#C084FC" filter="url(#neonPink)" />
      <text x="16" y="8" class="font-mono stat-val" font-size="17">58 DAYS</text>
      <text x="16" y="24" class="stat-lbl">CURRENT STREAK</text>
    </g>
  </g>
</svg>