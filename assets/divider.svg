<svg viewBox="0 0 1200 70" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#152447"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .line{stroke:#38BDF8;stroke-opacity:.25}
      .star{fill:#38BDF8}
      .star2{fill:#F8FAFC}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
      .t1{animation:tw 2.6s ease-in-out infinite}
      .t2{animation:tw 3.4s ease-in-out infinite .4s}
      .t3{animation:tw 2.1s ease-in-out infinite .9s}
      .t4{animation:tw 3.8s ease-in-out infinite 1.3s}
      .t5{animation:tw 2.9s ease-in-out infinite .2s}
      .t6{animation:tw 3.1s ease-in-out infinite 1.7s}
      .t7{animation:tw 2.4s ease-in-out infinite .6s}
      .t8{animation:tw 3.6s ease-in-out infinite 1.1s}
    </style>
  </defs>
  <rect width="1200" height="70" fill="url(#bg)"/>
  <line class="line" x1="0" y1="35" x2="1200" y2="35" stroke-width="1"/>

  <circle class="star t1" cx="60"  cy="20" r="1.6"/>
  <circle class="star2 t2" cx="140" cy="50" r="1.2"/>
  <circle class="star t3" cx="230" cy="16" r="1.8"/>
  <circle class="star2 t4" cx="330" cy="48" r="1.3"/>
  <circle class="star t5" cx="410" cy="24" r="1.5"/>
  <circle class="star2 t6" cx="500" cy="52" r="1.1"/>
  <circle class="star t7" cx="600" cy="18" r="1.7"/>
  <circle class="star2 t1" cx="690" cy="46" r="1.3"/>
  <circle class="star t2" cx="770" cy="22" r="1.6"/>
  <circle class="star2 t3" cx="860" cy="50" r="1.2"/>
  <circle class="star t4" cx="950" cy="16" r="1.8"/>
  <circle class="star2 t5" cx="1040" cy="48" r="1.3"/>
  <circle class="star t6" cx="1110" cy="24" r="1.5"/>
  <circle class="star2 t7" cx="1160" cy="52" r="1.1"/>

  <circle r="3.4" fill="#38BDF8" filter="url(#glow)">
    <animateMotion path="M -20,35 L 1220,35" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
