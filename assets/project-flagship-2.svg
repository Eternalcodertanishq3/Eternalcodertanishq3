<circle cx="29" cy="35" r="0.9" fill="#F8FAFC" opacity="0.60" style="animation: pulse 4.4s ease-in-out infinite 3.6s" />
<circle cx="68" cy="97" r="0.5" fill="#A5B4FC" opacity="0.32" style="animation: pulse 2.1s ease-in-out infinite 2.6s" />
<circle cx="68" cy="24" r="0.8" fill="#818CF8" opacity="0.35" style="animation: pulse 3.4s ease-in-out infinite 0.2s" />
<circle cx="75" cy="58" r="0.9" fill="#F8FAFC" opacity="0.30" style="animation: pulse 2.8s ease-in-out infinite 0.1s" />
<circle cx="202" cy="0" r="0.4" fill="#818CF8" opacity="0.43" style="animation: pulse 2.7s ease-in-out infinite 1.7s" />
<circle cx="216" cy="85" r="0.8" fill="#38BDF8" opacity="0.85" style="animation: pulse 2.8s ease-in-out infinite 0.2s" />
<circle cx="207" cy="129" r="0.9" fill="#38BDF8" opacity="0.30" style="animation: pulse 3.9s ease-in-out infinite 0.2s" />
<circle cx="213" cy="176" r="0.4" fill="#818CF8" opacity="0.33" style="animation: pulse 4.6s ease-in-out infinite 3.4s" />
<circle cx="254" cy="191" r="0.9" fill="#A5B4FC" opacity="0.32" style="animation: pulse 2.9s ease-in-out infinite 2.5s" />
<circle cx="165" cy="76" r="0.6" fill="#38BDF8" opacity="0.73" style="animation: pulse 2.3s ease-in-out infinite 2.3s" />
<circle cx="54" cy="2" r="0.5" fill="#F8FAFC" opacity="0.73" style="animation: pulse 4.5s ease-in-out infinite 3.8s" />
<circle cx="18" cy="121" r="1.2" fill="#A5B4FC" opacity="0.26" style="animation: pulse 3.6s ease-in-out infinite 2.7s" />
<circle cx="110" cy="191" r="0.8" fill="#A5B4FC" opacity="0.70" style="animation: pulse 3.7s ease-in-out infinite 2.9s" />
<circle cx="20" cy="7" r="0.8" fill="#F8FAFC" opacity="0.41" style="animation: pulse 4.7s ease-in-out infinite 3.4s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
