<circle cx="87" cy="4" r="0.7" fill="#F8FAFC" opacity="0.44" style="animation: pulse 3.9s ease-in-out infinite 4.8s" />
<circle cx="158" cy="11" r="0.6" fill="#818CF8" opacity="0.18" style="animation: pulse 3.9s ease-in-out infinite 3.3s" />
<circle cx="33" cy="42" r="0.9" fill="#38BDF8" opacity="0.30" style="animation: pulse 4.3s ease-in-out infinite 0.3s" />
<circle cx="263" cy="174" r="0.6" fill="#A5B4FC" opacity="0.26" style="animation: pulse 3.9s ease-in-out infinite 0.9s" />
<circle cx="68" cy="192" r="0.5" fill="#38BDF8" opacity="0.53" style="animation: pulse 2.4s ease-in-out infinite 1.1s" />
<circle cx="279" cy="28" r="0.4" fill="#818CF8" opacity="0.39" style="animation: pulse 2.2s ease-in-out infinite 2.3s" />
<circle cx="203" cy="150" r="1.0" fill="#38BDF8" opacity="0.75" style="animation: pulse 3.4s ease-in-out infinite 3.3s" />
<circle cx="141" cy="54" r="0.7" fill="#38BDF8" opacity="0.16" style="animation: pulse 4.9s ease-in-out infinite 1.3s" />
<circle cx="54" cy="127" r="0.9" fill="#F8FAFC" opacity="0.39" style="animation: pulse 2.2s ease-in-out infinite 2.5s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


