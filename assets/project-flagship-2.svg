<circle cx="55" cy="52" r="0.7" fill="#A5B4FC" opacity="0.80" style="animation: pulse 4.6s ease-in-out infinite 3.5s" />
<circle cx="113" cy="87" r="0.6" fill="#38BDF8" opacity="0.43" style="animation: pulse 3.3s ease-in-out infinite 4.0s" />
<circle cx="74" cy="51" r="0.6" fill="#818CF8" opacity="0.21" style="animation: pulse 2.9s ease-in-out infinite 2.5s" />
<circle cx="163" cy="11" r="0.5" fill="#A5B4FC" opacity="0.53" style="animation: pulse 4.7s ease-in-out infinite 1.9s" />
<circle cx="267" cy="31" r="1.0" fill="#818CF8" opacity="0.65" style="animation: pulse 2.2s ease-in-out infinite 0.7s" />
<circle cx="13" cy="186" r="0.6" fill="#818CF8" opacity="0.80" style="animation: pulse 3.2s ease-in-out infinite 3.6s" />
<circle cx="124" cy="146" r="1.2" fill="#38BDF8" opacity="0.81" style="animation: pulse 3.9s ease-in-out infinite 0.5s" />
<circle cx="158" cy="87" r="0.6" fill="#38BDF8" opacity="0.29" style="animation: pulse 3.9s ease-in-out infinite 4.8s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


