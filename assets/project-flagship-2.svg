<circle cx="198" cy="58" r="0.8" fill="#818CF8" opacity="0.23" style="animation: pulse 4.2s ease-in-out infinite 2.6s" />
<circle cx="108" cy="183" r="1.2" fill="#F8FAFC" opacity="0.31" style="animation: pulse 2.5s ease-in-out infinite 4.8s" />
<circle cx="265" cy="208" r="1.1" fill="#38BDF8" opacity="0.47" style="animation: pulse 2.4s ease-in-out infinite 1.5s" />
<circle cx="146" cy="156" r="0.9" fill="#818CF8" opacity="0.80" style="animation: pulse 3.3s ease-in-out infinite 1.1s" />
<circle cx="159" cy="89" r="0.6" fill="#F8FAFC" opacity="0.58" style="animation: pulse 2.9s ease-in-out infinite 1.5s" />
<circle cx="174" cy="116" r="1.2" fill="#818CF8" opacity="0.64" style="animation: pulse 2.1s ease-in-out infinite 1.4s" />
<circle cx="188" cy="172" r="1.0" fill="#818CF8" opacity="0.70" style="animation: pulse 3.0s ease-in-out infinite 0.4s" />
<circle cx="105" cy="9" r="1.1" fill="#818CF8" opacity="0.18" style="animation: pulse 3.8s ease-in-out infinite 0.7s" />
<circle cx="47" cy="61" r="0.8" fill="#F8FAFC" opacity="0.83" style="animation: pulse 3.0s ease-in-out infinite 1.4s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
