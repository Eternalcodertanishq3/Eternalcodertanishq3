<circle cx="55" cy="183" r="0.6" fill="#F8FAFC" opacity="0.65" style="animation: pulse 2.5s ease-in-out infinite 3.2s" />
<circle cx="243" cy="111" r="0.8" fill="#38BDF8" opacity="0.59" style="animation: pulse 3.7s ease-in-out infinite 4.4s" />
<circle cx="264" cy="28" r="0.8" fill="#818CF8" opacity="0.69" style="animation: pulse 4.3s ease-in-out infinite 1.0s" />
<circle cx="76" cy="52" r="1.1" fill="#A5B4FC" opacity="0.34" style="animation: pulse 4.2s ease-in-out infinite 0.8s" />
<circle cx="93" cy="39" r="0.7" fill="#F8FAFC" opacity="0.79" style="animation: pulse 3.9s ease-in-out infinite 3.5s" />
<circle cx="19" cy="158" r="0.6" fill="#818CF8" opacity="0.48" style="animation: pulse 2.9s ease-in-out infinite 3.6s" />
<circle cx="147" cy="211" r="1.0" fill="#38BDF8" opacity="0.65" style="animation: pulse 4.0s ease-in-out infinite 2.6s" />
<circle cx="269" cy="5" r="1.0" fill="#38BDF8" opacity="0.80" style="animation: pulse 3.0s ease-in-out infinite 3.0s" />
<circle cx="61" cy="37" r="0.6" fill="#F8FAFC" opacity="0.38" style="animation: pulse 4.2s ease-in-out infinite 3.7s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


