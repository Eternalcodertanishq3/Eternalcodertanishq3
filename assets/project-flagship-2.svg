<circle cx="249" cy="56" r="0.6" fill="#818CF8" opacity="0.26" style="animation: pulse 4.4s ease-in-out infinite 1.6s" />
<circle cx="88" cy="34" r="0.7" fill="#38BDF8" opacity="0.17" style="animation: pulse 2.7s ease-in-out infinite 2.0s" />
<circle cx="234" cy="142" r="1.0" fill="#38BDF8" opacity="0.21" style="animation: pulse 4.8s ease-in-out infinite 1.7s" />
<circle cx="255" cy="117" r="0.4" fill="#38BDF8" opacity="0.70" style="animation: pulse 3.6s ease-in-out infinite 1.7s" />
<circle cx="239" cy="87" r="1.0" fill="#F8FAFC" opacity="0.75" style="animation: pulse 2.2s ease-in-out infinite 1.9s" />
<circle cx="149" cy="181" r="0.9" fill="#818CF8" opacity="0.66" style="animation: pulse 4.3s ease-in-out infinite 3.4s" />
<circle cx="191" cy="175" r="1.2" fill="#A5B4FC" opacity="0.66" style="animation: pulse 2.7s ease-in-out infinite 2.0s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


