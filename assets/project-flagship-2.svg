<circle cx="82" cy="33" r="1.1" fill="#A5B4FC" opacity="0.19" style="animation: pulse 4.9s ease-in-out infinite 0.9s" />
<circle cx="270" cy="200" r="0.4" fill="#818CF8" opacity="0.48" style="animation: pulse 3.4s ease-in-out infinite 0.6s" />
<circle cx="140" cy="6" r="0.9" fill="#F8FAFC" opacity="0.61" style="animation: pulse 3.0s ease-in-out infinite 1.0s" />
<circle cx="39" cy="118" r="0.8" fill="#F8FAFC" opacity="0.64" style="animation: pulse 4.3s ease-in-out infinite 1.0s" />
<circle cx="268" cy="97" r="1.1" fill="#F8FAFC" opacity="0.60" style="animation: pulse 3.7s ease-in-out infinite 3.1s" />
<circle cx="279" cy="41" r="1.0" fill="#A5B4FC" opacity="0.84" style="animation: pulse 2.8s ease-in-out infinite 0.1s" />
<circle cx="108" cy="64" r="1.0" fill="#818CF8" opacity="0.59" style="animation: pulse 2.1s ease-in-out infinite 0.2s" />
<circle cx="3" cy="113" r="1.0" fill="#A5B4FC" opacity="0.38" style="animation: pulse 2.5s ease-in-out infinite 2.2s" />
<circle cx="113" cy="25" r="1.1" fill="#A5B4FC" opacity="0.46" style="animation: pulse 2.0s ease-in-out infinite 2.6s" />
<circle cx="231" cy="35" r="1.0" fill="#38BDF8" opacity="0.22" style="animation: pulse 3.6s ease-in-out infinite 1.5s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

