<circle cx="111" cy="62" r="0.5" fill="#38BDF8" opacity="0.37" style="animation: pulse 4.6s ease-in-out infinite 4.1s" />
<circle cx="114" cy="93" r="0.7" fill="#818CF8" opacity="0.79" style="animation: pulse 2.3s ease-in-out infinite 3.2s" />
<circle cx="246" cy="41" r="1.2" fill="#A5B4FC" opacity="0.38" style="animation: pulse 2.8s ease-in-out infinite 1.6s" />
<circle cx="19" cy="127" r="1.2" fill="#38BDF8" opacity="0.70" style="animation: pulse 4.0s ease-in-out infinite 0.9s" />
<circle cx="231" cy="151" r="1.0" fill="#38BDF8" opacity="0.68" style="animation: pulse 2.4s ease-in-out infinite 3.2s" />
<circle cx="104" cy="202" r="0.6" fill="#818CF8" opacity="0.34" style="animation: pulse 3.6s ease-in-out infinite 3.3s" />
<circle cx="124" cy="78" r="1.2" fill="#A5B4FC" opacity="0.36" style="animation: pulse 3.7s ease-in-out infinite 3.0s" />
<circle cx="232" cy="14" r="0.4" fill="#A5B4FC" opacity="0.80" style="animation: pulse 3.0s ease-in-out infinite 3.0s" />
<circle cx="17" cy="35" r="0.5" fill="#A5B4FC" opacity="0.35" style="animation: pulse 4.3s ease-in-out infinite 0.3s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

