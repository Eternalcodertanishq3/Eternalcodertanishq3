<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="192" cy="132" r="0.9" fill="#A5B4FC" opacity="0.66" style="animation: pulse 4.4s ease-in-out infinite 4.3s" />
<circle cx="265" cy="100" r="0.5" fill="#A5B4FC" opacity="0.60" style="animation: pulse 2.7s ease-in-out infinite 3.5s" />
<circle cx="30" cy="99" r="0.6" fill="#818CF8" opacity="0.83" style="animation: pulse 4.5s ease-in-out infinite 2.9s" />
<circle cx="55" cy="145" r="1.0" fill="#818CF8" opacity="0.30" style="animation: pulse 4.7s ease-in-out infinite 0.4s" />
<circle cx="64" cy="181" r="0.9" fill="#F8FAFC" opacity="0.77" style="animation: pulse 4.7s ease-in-out infinite 2.9s" />
<circle cx="107" cy="132" r="1.0" fill="#818CF8" opacity="0.70" style="animation: pulse 2.6s ease-in-out infinite 4.8s" />
<circle cx="279" cy="86" r="1.1" fill="#A5B4FC" opacity="0.53" style="animation: pulse 4.3s ease-in-out infinite 2.2s" />
<circle cx="190" cy="97" r="0.5" fill="#A5B4FC" opacity="0.66" style="animation: pulse 4.9s ease-in-out infinite 4.5s" />
<circle cx="50" cy="140" r="0.6" fill="#818CF8" opacity="0.24" style="animation: pulse 3.5s ease-in-out infinite 0.8s" />
<circle cx="177" cy="71" r="0.6" fill="#818CF8" opacity="0.84" style="animation: pulse 4.9s ease-in-out infinite 0.7s" />
<circle cx="55" cy="117" r="0.4" fill="#38BDF8" opacity="0.58" style="animation: pulse 5.0s ease-in-out infinite 3.9s" />
<circle cx="252" cy="144" r="1.1" fill="#A5B4FC" opacity="0.69" style="animation: pulse 3.6s ease-in-out infinite 0.6s" />
<circle cx="267" cy="130" r="0.7" fill="#F8FAFC" opacity="0.44" style="animation: pulse 4.4s ease-in-out infinite 2.6s" />
<circle cx="138" cy="89" r="0.4" fill="#38BDF8" opacity="0.31" style="animation: pulse 3.4s ease-in-out infinite 2.2s" />
<circle cx="168" cy="73" r="0.5" fill="#818CF8" opacity="0.54" style="animation: pulse 4.1s ease-in-out infinite 1.2s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

