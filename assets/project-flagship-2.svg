<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="88" cy="195" r="0.9" fill="#818CF8" opacity="0.76" style="animation: pulse 4.5s ease-in-out infinite 0.3s" />
<circle cx="186" cy="140" r="1.1" fill="#F8FAFC" opacity="0.39" style="animation: pulse 4.5s ease-in-out infinite 0.2s" />
<circle cx="145" cy="140" r="0.7" fill="#818CF8" opacity="0.34" style="animation: pulse 2.5s ease-in-out infinite 2.0s" />
<circle cx="196" cy="158" r="1.0" fill="#A5B4FC" opacity="0.23" style="animation: pulse 3.6s ease-in-out infinite 0.0s" />
<circle cx="22" cy="172" r="0.9" fill="#A5B4FC" opacity="0.40" style="animation: pulse 3.7s ease-in-out infinite 4.8s" />
<circle cx="168" cy="88" r="0.9" fill="#818CF8" opacity="0.33" style="animation: pulse 3.5s ease-in-out infinite 0.8s" />
<circle cx="205" cy="97" r="1.2" fill="#818CF8" opacity="0.37" style="animation: pulse 3.4s ease-in-out infinite 1.3s" />
<circle cx="112" cy="62" r="0.8" fill="#38BDF8" opacity="0.80" style="animation: pulse 3.9s ease-in-out infinite 1.8s" />
<circle cx="198" cy="82" r="1.1" fill="#A5B4FC" opacity="0.35" style="animation: pulse 4.3s ease-in-out infinite 2.1s" />
<circle cx="222" cy="188" r="0.9" fill="#A5B4FC" opacity="0.79" style="animation: pulse 4.8s ease-in-out infinite 1.2s" />
<circle cx="4" cy="180" r="1.0" fill="#A5B4FC" opacity="0.67" style="animation: pulse 2.2s ease-in-out infinite 3.3s" />
<circle cx="37" cy="0" r="0.4" fill="#818CF8" opacity="0.36" style="animation: pulse 4.5s ease-in-out infinite 3.8s" />
<circle cx="184" cy="169" r="0.7" fill="#38BDF8" opacity="0.53" style="animation: pulse 3.8s ease-in-out infinite 1.2s" />
<circle cx="109" cy="114" r="0.5" fill="#A5B4FC" opacity="0.70" style="animation: pulse 3.0s ease-in-out infinite 0.4s" />
<circle cx="155" cy="40" r="0.6" fill="#818CF8" opacity="0.24" style="animation: pulse 2.8s ease-in-out infinite 4.6s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>