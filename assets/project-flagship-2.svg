<circle cx="131" cy="74" r="0.7" fill="#818CF8" opacity="0.36" style="animation: pulse 3.1s ease-in-out infinite 0.8s" />
<circle cx="73" cy="41" r="0.9" fill="#F8FAFC" opacity="0.35" style="animation: pulse 2.8s ease-in-out infinite 4.1s" />
<circle cx="218" cy="38" r="0.7" fill="#38BDF8" opacity="0.17" style="animation: pulse 2.3s ease-in-out infinite 0.4s" />
<circle cx="131" cy="1" r="0.4" fill="#818CF8" opacity="0.54" style="animation: pulse 3.1s ease-in-out infinite 2.2s" />
<circle cx="278" cy="132" r="0.6" fill="#38BDF8" opacity="0.37" style="animation: pulse 3.5s ease-in-out infinite 3.2s" />
<circle cx="124" cy="170" r="0.5" fill="#F8FAFC" opacity="0.73" style="animation: pulse 2.9s ease-in-out infinite 0.7s" />
<circle cx="79" cy="39" r="0.7" fill="#F8FAFC" opacity="0.56" style="animation: pulse 2.8s ease-in-out infinite 2.9s" />
<circle cx="92" cy="178" r="1.1" fill="#818CF8" opacity="0.28" style="animation: pulse 2.5s ease-in-out infinite 1.0s" />
<circle cx="44" cy="125" r="0.4" fill="#38BDF8" opacity="0.50" style="animation: pulse 4.2s ease-in-out infinite 4.4s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

