<circle cx="27" cy="106" r="0.4" fill="#F8FAFC" opacity="0.51" style="animation: pulse 2.0s ease-in-out infinite 2.4s" />
<circle cx="185" cy="21" r="0.7" fill="#A5B4FC" opacity="0.32" style="animation: pulse 4.3s ease-in-out infinite 3.1s" />
<circle cx="208" cy="4" r="0.7" fill="#38BDF8" opacity="0.72" style="animation: pulse 2.6s ease-in-out infinite 4.1s" />
<circle cx="43" cy="62" r="0.4" fill="#818CF8" opacity="0.40" style="animation: pulse 2.3s ease-in-out infinite 0.4s" />
<circle cx="86" cy="62" r="1.1" fill="#F8FAFC" opacity="0.39" style="animation: pulse 4.4s ease-in-out infinite 2.0s" />
<circle cx="67" cy="27" r="0.7" fill="#818CF8" opacity="0.68" style="animation: pulse 4.5s ease-in-out infinite 3.1s" />
<circle cx="52" cy="142" r="0.6" fill="#38BDF8" opacity="0.24" style="animation: pulse 4.1s ease-in-out infinite 3.0s" />
<circle cx="246" cy="90" r="0.8" fill="#38BDF8" opacity="0.36" style="animation: pulse 3.1s ease-in-out infinite 0.0s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


