<circle cx="261" cy="27" r="0.8" fill="#A5B4FC" opacity="0.76" style="animation: pulse 4.1s ease-in-out infinite 3.8s" />
<circle cx="138" cy="44" r="0.7" fill="#A5B4FC" opacity="0.74" style="animation: pulse 3.2s ease-in-out infinite 2.8s" />
<circle cx="260" cy="157" r="1.1" fill="#38BDF8" opacity="0.25" style="animation: pulse 3.6s ease-in-out infinite 0.9s" />
