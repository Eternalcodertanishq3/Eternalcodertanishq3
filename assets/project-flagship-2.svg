<circle cx="64" cy="137" r="0.4" fill="#A5B4FC" opacity="0.42" style="animation: pulse 4.6s ease-in-out infinite 2.8s" />
<circle cx="173" cy="115" r="1.0" fill="#A5B4FC" opacity="0.69" style="animation: pulse 3.0s ease-in-out infinite 3.9s" />
<circle cx="225" cy="97" r="0.5" fill="#A5B4FC" opacity="0.71" style="animation: pulse 3.1s ease-in-out infinite 0.1s" />
<circle cx="73" cy="11" r="0.6" fill="#F8FAFC" opacity="0.64" style="animation: pulse 3.9s ease-in-out infinite 0.3s" />
<circle cx="136" cy="3" r="1.0" fill="#A5B4FC" opacity="0.56" style="animation: pulse 4.9s ease-in-out infinite 3.7s" />
<circle cx="122" cy="81" r="0.9" fill="#38BDF8" opacity="0.72" style="animation: pulse 4.4s ease-in-out infinite 2.8s" />
<circle cx="145" cy="116" r="1.2" fill="#818CF8" opacity="0.60" style="animation: pulse 2.5s ease-in-out infinite 2.2s" />
<circle cx="164" cy="174" r="1.0" fill="#F8FAFC" opacity="0.18" style="animation: pulse 4.9s ease-in-out infinite 2.3s" />
<circle cx="217" cy="115" r="0.7" fill="#818CF8" opacity="0.26" style="animation: pulse 4.6s ease-in-out infinite 3.4s" />
<circle cx="7" cy="205" r="0.9" fill="#A5B4FC" opacity="0.38" style="animation: pulse 2.3s ease-in-out infinite 4.1s" />
<circle cx="164" cy="95" r="0.6" fill="#38BDF8" opacity="0.74" style="animation: pulse 3.9s ease-in-out infinite 3.2s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

