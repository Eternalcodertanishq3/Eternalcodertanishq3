<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="239" cy="158" r="0.9" fill="#A5B4FC" opacity="0.30" style="animation: pulse 4.4s ease-in-out infinite 1.5s" />
<circle cx="276" cy="185" r="0.8" fill="#38BDF8" opacity="0.65" style="animation: pulse 2.4s ease-in-out infinite 1.0s" />
<circle cx="14" cy="138" r="0.7" fill="#818CF8" opacity="0.71" style="animation: pulse 3.3s ease-in-out infinite 1.0s" />
<circle cx="15" cy="110" r="1.0" fill="#A5B4FC" opacity="0.84" style="animation: pulse 3.6s ease-in-out infinite 3.6s" />
<circle cx="255" cy="92" r="0.6" fill="#818CF8" opacity="0.55" style="animation: pulse 2.2s ease-in-out infinite 4.4s" />
<circle cx="87" cy="47" r="0.4" fill="#38BDF8" opacity="0.16" style="animation: pulse 4.5s ease-in-out infinite 1.8s" />
<circle cx="176" cy="37" r="0.9" fill="#818CF8" opacity="0.43" style="animation: pulse 2.3s ease-in-out infinite 0.9s" />
<circle cx="127" cy="91" r="0.6" fill="#F8FAFC" opacity="0.55" style="animation: pulse 4.8s ease-in-out infinite 3.7s" />
<circle cx="211" cy="117" r="0.7" fill="#F8FAFC" opacity="0.39" style="animation: pulse 4.7s ease-in-out infinite 4.6s" />
<circle cx="134" cy="1" r="1.0" fill="#F8FAFC" opacity="0.34" style="animation: pulse 3.5s ease-in-out infinite 4.7s" />
<circle cx="83" cy="116" r="0.8" fill="#F8FAFC" opacity="0.26" style="animation: pulse 2.1s ease-in-out infinite 0.6s" />
<circle cx="60" cy="179" r="1.2" fill="#A5B4FC" opacity="0.65" style="animation: pulse 3.9s ease-in-out infinite 0.2s" />
<circle cx="270" cy="10" r="1.1" fill="#F8FAFC" opacity="0.31" style="animation: pulse 5.0s ease-in-out infinite 3.9s" />
<circle cx="279" cy="9" r="0.5" fill="#A5B4FC" opacity="0.41" style="animation: pulse 3.2s ease-in-out infinite 3.7s" />
<circle cx="113" cy="47" r="0.7" fill="#38BDF8" opacity="0.74" style="animation: pulse 3.2s ease-in-out infinite 0.1s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

