<circle cx="149" cy="148" r="1.0" fill="#A5B4FC" opacity="0.72" style="animation: pulse 2.9s ease-in-out infinite 1.6s" />
<circle cx="132" cy="55" r="1.1" fill="#38BDF8" opacity="0.40" style="animation: pulse 3.2s ease-in-out infinite 1.8s" />
