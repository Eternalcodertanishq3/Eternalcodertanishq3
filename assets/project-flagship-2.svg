<circle cx="253" cy="144" r="1.1" fill="#A5B4FC" opacity="0.67" style="animation: pulse 4.2s ease-in-out infinite 1.3s" />
<circle cx="69" cy="211" r="0.7" fill="#F8FAFC" opacity="0.67" style="animation: pulse 2.4s ease-in-out infinite 2.1s" />
<circle cx="210" cy="60" r="1.0" fill="#38BDF8" opacity="0.40" style="animation: pulse 3.9s ease-in-out infinite 5.0s" />
