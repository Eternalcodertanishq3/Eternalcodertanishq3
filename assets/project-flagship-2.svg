<circle cx="232" cy="106" r="0.8" fill="#F8FAFC" opacity="0.21" style="animation: pulse 3.3s ease-in-out infinite 2.9s" />
<circle cx="264" cy="69" r="0.8" fill="#F8FAFC" opacity="0.78" style="animation: pulse 4.1s ease-in-out infinite 0.5s" />
<circle cx="38" cy="56" r="0.5" fill="#38BDF8" opacity="0.54" style="animation: pulse 2.8s ease-in-out infinite 0.7s" />
<circle cx="78" cy="46" r="0.6" fill="#818CF8" opacity="0.66" style="animation: pulse 3.2s ease-in-out infinite 2.0s" />
<circle cx="129" cy="81" r="0.9" fill="#F8FAFC" opacity="0.82" style="animation: pulse 4.7s ease-in-out infinite 0.7s" />
<circle cx="81" cy="72" r="0.5" fill="#818CF8" opacity="0.27" style="animation: pulse 4.4s ease-in-out infinite 2.4s" />
<circle cx="248" cy="188" r="0.5" fill="#F8FAFC" opacity="0.24" style="animation: pulse 2.4s ease-in-out infinite 2.5s" />
<circle cx="162" cy="207" r="0.7" fill="#38BDF8" opacity="0.72" style="animation: pulse 2.7s ease-in-out infinite 1.5s" />
<circle cx="82" cy="126" r="0.5" fill="#818CF8" opacity="0.26" style="animation: pulse 4.7s ease-in-out infinite 3.3s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


