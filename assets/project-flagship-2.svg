<circle cx="212" cy="116" r="0.5" fill="#38BDF8" opacity="0.33" style="animation: pulse 3.5s ease-in-out infinite 2.7s" />
<circle cx="67" cy="168" r="0.6" fill="#F8FAFC" opacity="0.17" style="animation: pulse 3.0s ease-in-out infinite 4.8s" />
<circle cx="146" cy="57" r="1.0" fill="#F8FAFC" opacity="0.39" style="animation: pulse 3.2s ease-in-out infinite 4.6s" />
<circle cx="240" cy="172" r="0.6" fill="#A5B4FC" opacity="0.27" style="animation: pulse 3.1s ease-in-out infinite 2.9s" />
<circle cx="60" cy="28" r="0.5" fill="#818CF8" opacity="0.79" style="animation: pulse 2.6s ease-in-out infinite 2.5s" />
<circle cx="136" cy="79" r="1.1" fill="#A5B4FC" opacity="0.77" style="animation: pulse 4.4s ease-in-out infinite 4.8s" />
<circle cx="277" cy="93" r="0.8" fill="#38BDF8" opacity="0.76" style="animation: pulse 3.7s ease-in-out infinite 1.0s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


