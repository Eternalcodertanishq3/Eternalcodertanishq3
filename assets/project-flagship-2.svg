<circle cx="107" cy="124" r="1.1" fill="#F8FAFC" opacity="0.39" style="animation: pulse 4.1s ease-in-out infinite 1.0s" />
<circle cx="5" cy="50" r="0.9" fill="#A5B4FC" opacity="0.63" style="animation: pulse 3.3s ease-in-out infinite 2.2s" />
<circle cx="276" cy="18" r="0.8" fill="#818CF8" opacity="0.53" style="animation: pulse 4.9s ease-in-out infinite 3.2s" />
<circle cx="57" cy="197" r="1.0" fill="#38BDF8" opacity="0.66" style="animation: pulse 3.7s ease-in-out infinite 4.7s" />
<circle cx="31" cy="79" r="0.5" fill="#F8FAFC" opacity="0.26" style="animation: pulse 3.2s ease-in-out infinite 4.7s" />
<circle cx="18" cy="168" r="0.7" fill="#F8FAFC" opacity="0.35" style="animation: pulse 4.4s ease-in-out infinite 0.9s" />
<circle cx="148" cy="143" r="0.5" fill="#F8FAFC" opacity="0.30" style="animation: pulse 3.7s ease-in-out infinite 0.0s" />
<circle cx="95" cy="110" r="0.7" fill="#F8FAFC" opacity="0.74" style="animation: pulse 2.3s ease-in-out infinite 4.8s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


