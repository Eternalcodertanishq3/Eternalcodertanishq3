<circle cx="247" cy="30" r="0.9" fill="#818CF8" opacity="0.49" style="animation: pulse 4.4s ease-in-out infinite 4.6s" />
<circle cx="154" cy="170" r="0.5" fill="#A5B4FC" opacity="0.78" style="animation: pulse 3.7s ease-in-out infinite 1.0s" />
<circle cx="169" cy="133" r="0.9" fill="#38BDF8" opacity="0.16" style="animation: pulse 4.7s ease-in-out infinite 2.3s" />
<circle cx="122" cy="51" r="1.0" fill="#A5B4FC" opacity="0.24" style="animation: pulse 3.3s ease-in-out infinite 3.4s" />
<circle cx="78" cy="57" r="0.7" fill="#A5B4FC" opacity="0.73" style="animation: pulse 3.8s ease-in-out infinite 3.6s" />
<circle cx="60" cy="168" r="0.4" fill="#38BDF8" opacity="0.31" style="animation: pulse 3.5s ease-in-out infinite 0.1s" />
<circle cx="175" cy="178" r="1.0" fill="#F8FAFC" opacity="0.41" style="animation: pulse 2.2s ease-in-out infinite 3.6s" />
<circle cx="124" cy="204" r="0.7" fill="#38BDF8" opacity="0.25" style="animation: pulse 2.3s ease-in-out infinite 0.5s" />
<circle cx="50" cy="203" r="1.0" fill="#A5B4FC" opacity="0.58" style="animation: pulse 4.5s ease-in-out infinite 5.0s" />
<circle cx="61" cy="22" r="1.0" fill="#F8FAFC" opacity="0.37" style="animation: pulse 3.1s ease-in-out infinite 4.8s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

