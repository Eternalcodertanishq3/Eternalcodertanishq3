<circle cx="205" cy="209" r="0.8" fill="#A5B4FC" opacity="0.42" style="animation: pulse 2.0s ease-in-out infinite 1.8s" />
<circle cx="263" cy="58" r="0.8" fill="#818CF8" opacity="0.68" style="animation: pulse 4.9s ease-in-out infinite 3.1s" />
<circle cx="256" cy="18" r="1.1" fill="#818CF8" opacity="0.49" style="animation: pulse 2.7s ease-in-out infinite 2.0s" />
<circle cx="195" cy="79" r="0.8" fill="#A5B4FC" opacity="0.44" style="animation: pulse 3.8s ease-in-out infinite 1.8s" />
<circle cx="28" cy="77" r="0.6" fill="#F8FAFC" opacity="0.52" style="animation: pulse 3.2s ease-in-out infinite 2.3s" />
<circle cx="223" cy="172" r="0.9" fill="#F8FAFC" opacity="0.27" style="animation: pulse 3.7s ease-in-out infinite 4.2s" />
<circle cx="164" cy="143" r="1.0" fill="#818CF8" opacity="0.75" style="animation: pulse 4.4s ease-in-out infinite 1.4s" />
<circle cx="178" cy="74" r="0.8" fill="#38BDF8" opacity="0.34" style="animation: pulse 2.2s ease-in-out infinite 2.0s" />
<circle cx="242" cy="14" r="0.7" fill="#A5B4FC" opacity="0.27" style="animation: pulse 2.6s ease-in-out infinite 4.0s" />
<circle cx="17" cy="175" r="1.0" fill="#38BDF8" opacity="0.35" style="animation: pulse 4.0s ease-in-out infinite 3.4s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
