<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="112" cy="25" r="1.1" fill="#818CF8" opacity="0.83" style="animation: pulse 3.5s ease-in-out infinite 0.3s" />
<circle cx="149" cy="175" r="0.6" fill="#F8FAFC" opacity="0.67" style="animation: pulse 2.1s ease-in-out infinite 4.1s" />
<circle cx="272" cy="192" r="1.2" fill="#F8FAFC" opacity="0.16" style="animation: pulse 3.0s ease-in-out infinite 2.3s" />
<circle cx="202" cy="175" r="1.1" fill="#818CF8" opacity="0.20" style="animation: pulse 2.4s ease-in-out infinite 3.7s" />
<circle cx="156" cy="154" r="0.9" fill="#38BDF8" opacity="0.61" style="animation: pulse 4.6s ease-in-out infinite 4.0s" />
<circle cx="185" cy="167" r="0.8" fill="#38BDF8" opacity="0.56" style="animation: pulse 3.3s ease-in-out infinite 3.8s" />
<circle cx="272" cy="91" r="0.4" fill="#38BDF8" opacity="0.65" style="animation: pulse 4.4s ease-in-out infinite 1.5s" />
<circle cx="154" cy="39" r="0.4" fill="#F8FAFC" opacity="0.58" style="animation: pulse 2.2s ease-in-out infinite 0.8s" />
<circle cx="140" cy="155" r="1.1" fill="#F8FAFC" opacity="0.34" style="animation: pulse 2.6s ease-in-out infinite 1.5s" />
<circle cx="152" cy="110" r="0.5" fill="#38BDF8" opacity="0.75" style="animation: pulse 2.4s ease-in-out infinite 3.9s" />
<circle cx="254" cy="159" r="1.0" fill="#F8FAFC" opacity="0.84" style="animation: pulse 3.5s ease-in-out infinite 3.6s" />
<circle cx="175" cy="65" r="0.6" fill="#A5B4FC" opacity="0.74" style="animation: pulse 4.8s ease-in-out infinite 0.7s" />
<circle cx="204" cy="66" r="0.6" fill="#A5B4FC" opacity="0.43" style="animation: pulse 4.2s ease-in-out infinite 4.0s" />
<circle cx="75" cy="99" r="0.8" fill="#38BDF8" opacity="0.19" style="animation: pulse 4.8s ease-in-out infinite 4.8s" />
<circle cx="220" cy="50" r="0.7" fill="#F8FAFC" opacity="0.35" style="animation: pulse 3.9s ease-in-out infinite 2.7s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
