<circle cx="131" cy="28" r="1.0" fill="#818CF8" opacity="0.46" style="animation: pulse 2.5s ease-in-out infinite 1.2s" />
<circle cx="189" cy="70" r="0.4" fill="#A5B4FC" opacity="0.56" style="animation: pulse 2.8s ease-in-out infinite 1.5s" />
