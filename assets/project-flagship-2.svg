<circle cx="224" cy="82" r="0.5" fill="#818CF8" opacity="0.69" style="animation: pulse 3.9s ease-in-out infinite 4.4s" />
<circle cx="238" cy="106" r="1.0" fill="#818CF8" opacity="0.33" style="animation: pulse 2.9s ease-in-out infinite 0.8s" />
<circle cx="183" cy="146" r="0.7" fill="#818CF8" opacity="0.54" style="animation: pulse 4.1s ease-in-out infinite 2.1s" />
<circle cx="263" cy="96" r="0.6" fill="#A5B4FC" opacity="0.71" style="animation: pulse 4.1s ease-in-out infinite 2.1s" />
<circle cx="177" cy="190" r="0.8" fill="#818CF8" opacity="0.47" style="animation: pulse 2.4s ease-in-out infinite 2.8s" />
<circle cx="126" cy="138" r="0.6" fill="#F8FAFC" opacity="0.29" style="animation: pulse 2.8s ease-in-out infinite 3.2s" />
<circle cx="165" cy="135" r="0.8" fill="#818CF8" opacity="0.51" style="animation: pulse 3.2s ease-in-out infinite 4.5s" />
<circle cx="177" cy="200" r="1.2" fill="#F8FAFC" opacity="0.43" style="animation: pulse 2.1s ease-in-out infinite 0.5s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


