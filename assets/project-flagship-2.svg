<circle cx="126" cy="86" r="0.8" fill="#A5B4FC" opacity="0.83" style="animation: pulse 4.8s ease-in-out infinite 3.4s" />
<circle cx="185" cy="57" r="0.5" fill="#F8FAFC" opacity="0.77" style="animation: pulse 3.9s ease-in-out infinite 0.5s" />
<circle cx="113" cy="6" r="1.0" fill="#818CF8" opacity="0.38" style="animation: pulse 4.0s ease-in-out infinite 2.4s" />
<circle cx="42" cy="19" r="0.4" fill="#A5B4FC" opacity="0.15" style="animation: pulse 2.4s ease-in-out infinite 5.0s" />
<circle cx="76" cy="103" r="0.8" fill="#A5B4FC" opacity="0.77" style="animation: pulse 4.3s ease-in-out infinite 1.4s" />
<circle cx="255" cy="108" r="0.5" fill="#38BDF8" opacity="0.30" style="animation: pulse 2.2s ease-in-out infinite 4.8s" />
<circle cx="202" cy="66" r="0.6" fill="#38BDF8" opacity="0.60" style="animation: pulse 4.6s ease-in-out infinite 1.6s" />
<circle cx="229" cy="218" r="0.6" fill="#38BDF8" opacity="0.84" style="animation: pulse 3.0s ease-in-out infinite 4.3s" />
<circle cx="84" cy="115" r="0.4" fill="#F8FAFC" opacity="0.73" style="animation: pulse 3.7s ease-in-out infinite 3.3s" />
<circle cx="17" cy="91" r="0.5" fill="#A5B4FC" opacity="0.19" style="animation: pulse 4.8s ease-in-out infinite 1.4s" />
<circle cx="55" cy="73" r="0.6" fill="#38BDF8" opacity="0.26" style="animation: pulse 4.0s ease-in-out infinite 3.3s" />
<circle cx="7" cy="166" r="1.0" fill="#A5B4FC" opacity="0.75" style="animation: pulse 3.3s ease-in-out infinite 3.3s" />
<circle cx="238" cy="76" r="0.7" fill="#A5B4FC" opacity="0.47" style="animation: pulse 3.0s ease-in-out infinite 4.1s" />
<circle cx="70" cy="69" r="0.4" fill="#A5B4FC" opacity="0.41" style="animation: pulse 2.6s ease-in-out infinite 3.6s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


