<circle cx="57" cy="152" r="0.9" fill="#818CF8" opacity="0.61" style="animation: pulse 3.8s ease-in-out infinite 3.6s" />
<circle cx="75" cy="26" r="0.5" fill="#F8FAFC" opacity="0.35" style="animation: pulse 4.4s ease-in-out infinite 0.9s" />
<circle cx="216" cy="116" r="0.5" fill="#A5B4FC" opacity="0.44" style="animation: pulse 3.1s ease-in-out infinite 1.6s" />
<circle cx="111" cy="94" r="1.0" fill="#38BDF8" opacity="0.82" style="animation: pulse 4.6s ease-in-out infinite 1.7s" />
<circle cx="165" cy="74" r="0.5" fill="#818CF8" opacity="0.64" style="animation: pulse 3.3s ease-in-out infinite 4.9s" />
