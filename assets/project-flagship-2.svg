<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="241" cy="112" r="0.8" fill="#A5B4FC" opacity="0.70" style="animation: pulse 3.6s ease-in-out infinite 1.5s" />
<circle cx="139" cy="111" r="0.9" fill="#F8FAFC" opacity="0.68" style="animation: pulse 3.9s ease-in-out infinite 2.4s" />
<circle cx="67" cy="85" r="0.8" fill="#818CF8" opacity="0.71" style="animation: pulse 3.4s ease-in-out infinite 2.4s" />
<circle cx="238" cy="131" r="0.4" fill="#818CF8" opacity="0.52" style="animation: pulse 3.1s ease-in-out infinite 4.2s" />
<circle cx="202" cy="196" r="0.4" fill="#F8FAFC" opacity="0.80" style="animation: pulse 4.2s ease-in-out infinite 2.2s" />
<circle cx="18" cy="178" r="0.9" fill="#38BDF8" opacity="0.32" style="animation: pulse 4.0s ease-in-out infinite 2.0s" />
<circle cx="203" cy="119" r="0.8" fill="#38BDF8" opacity="0.19" style="animation: pulse 2.1s ease-in-out infinite 0.9s" />
<circle cx="111" cy="122" r="1.2" fill="#818CF8" opacity="0.82" style="animation: pulse 3.5s ease-in-out infinite 0.8s" />
<circle cx="83" cy="57" r="0.9" fill="#A5B4FC" opacity="0.24" style="animation: pulse 2.5s ease-in-out infinite 4.0s" />
<circle cx="209" cy="66" r="0.8" fill="#38BDF8" opacity="0.24" style="animation: pulse 2.4s ease-in-out infinite 2.7s" />
<circle cx="150" cy="36" r="0.9" fill="#A5B4FC" opacity="0.77" style="animation: pulse 2.6s ease-in-out infinite 3.4s" />
<circle cx="245" cy="92" r="1.0" fill="#F8FAFC" opacity="0.43" style="animation: pulse 4.4s ease-in-out infinite 0.4s" />
<circle cx="225" cy="84" r="0.7" fill="#38BDF8" opacity="0.38" style="animation: pulse 2.0s ease-in-out infinite 1.6s" />
<circle cx="141" cy="37" r="0.8" fill="#F8FAFC" opacity="0.51" style="animation: pulse 2.9s ease-in-out infinite 4.3s" />
<circle cx="98" cy="24" r="0.9" fill="#38BDF8" opacity="0.25" style="animation: pulse 3.8s ease-in-out infinite 2.8s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
