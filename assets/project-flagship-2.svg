<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="170" cy="158" r="0.5" fill="#38BDF8" opacity="0.34" style="animation: pulse 4.4s ease-in-out infinite 0.7s" />
<circle cx="227" cy="83" r="1.1" fill="#F8FAFC" opacity="0.25" style="animation: pulse 2.7s ease-in-out infinite 2.0s" />
<circle cx="165" cy="89" r="1.1" fill="#F8FAFC" opacity="0.61" style="animation: pulse 3.3s ease-in-out infinite 2.3s" />
<circle cx="55" cy="207" r="0.4" fill="#38BDF8" opacity="0.21" style="animation: pulse 2.9s ease-in-out infinite 1.3s" />
<circle cx="169" cy="100" r="1.0" fill="#A5B4FC" opacity="0.52" style="animation: pulse 3.6s ease-in-out infinite 0.8s" />
<circle cx="233" cy="211" r="0.6" fill="#A5B4FC" opacity="0.43" style="animation: pulse 2.7s ease-in-out infinite 0.4s" />
<circle cx="167" cy="197" r="1.0" fill="#A5B4FC" opacity="0.58" style="animation: pulse 4.4s ease-in-out infinite 3.9s" />
<circle cx="15" cy="197" r="0.5" fill="#F8FAFC" opacity="0.18" style="animation: pulse 4.4s ease-in-out infinite 2.9s" />
<circle cx="216" cy="36" r="0.4" fill="#F8FAFC" opacity="0.84" style="animation: pulse 2.0s ease-in-out infinite 3.4s" />
<circle cx="53" cy="214" r="0.6" fill="#38BDF8" opacity="0.31" style="animation: pulse 3.9s ease-in-out infinite 1.2s" />
<circle cx="197" cy="0" r="0.6" fill="#A5B4FC" opacity="0.37" style="animation: pulse 3.2s ease-in-out infinite 0.2s" />
<circle cx="210" cy="159" r="0.5" fill="#38BDF8" opacity="0.41" style="animation: pulse 3.1s ease-in-out infinite 3.1s" />
<circle cx="136" cy="194" r="1.0" fill="#F8FAFC" opacity="0.48" style="animation: pulse 3.2s ease-in-out infinite 3.4s" />
<circle cx="80" cy="98" r="1.2" fill="#F8FAFC" opacity="0.79" style="animation: pulse 4.7s ease-in-out infinite 1.8s" />
<circle cx="33" cy="12" r="1.1" fill="#38BDF8" opacity="0.80" style="animation: pulse 3.0s ease-in-out infinite 2.0s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>