<circle cx="279" cy="51" r="0.5" fill="#A5B4FC" opacity="0.39" style="animation: pulse 3.2s ease-in-out infinite 3.8s" />
<circle cx="133" cy="177" r="1.0" fill="#A5B4FC" opacity="0.64" style="animation: pulse 2.4s ease-in-out infinite 2.2s" />
<circle cx="115" cy="9" r="0.7" fill="#A5B4FC" opacity="0.17" style="animation: pulse 2.3s ease-in-out infinite 4.5s" />
<circle cx="94" cy="121" r="0.5" fill="#818CF8" opacity="0.37" style="animation: pulse 5.0s ease-in-out infinite 4.0s" />
<circle cx="268" cy="150" r="1.0" fill="#38BDF8" opacity="0.40" style="animation: pulse 4.6s ease-in-out infinite 2.0s" />
<circle cx="79" cy="203" r="0.7" fill="#38BDF8" opacity="0.21" style="animation: pulse 4.9s ease-in-out infinite 1.5s" />
<circle cx="103" cy="155" r="0.8" fill="#A5B4FC" opacity="0.71" style="animation: pulse 2.9s ease-in-out infinite 4.7s" />
<circle cx="196" cy="211" r="0.6" fill="#818CF8" opacity="0.76" style="animation: pulse 2.9s ease-in-out infinite 3.7s" />
<circle cx="17" cy="68" r="0.8" fill="#818CF8" opacity="0.76" style="animation: pulse 4.5s ease-in-out infinite 3.9s" />
<circle cx="17" cy="178" r="0.5" fill="#F8FAFC" opacity="0.82" style="animation: pulse 4.8s ease-in-out infinite 3.0s" />
<circle cx="42" cy="60" r="0.9" fill="#A5B4FC" opacity="0.70" style="animation: pulse 3.1s ease-in-out infinite 0.9s" />
<circle cx="37" cy="50" r="0.9" fill="#A5B4FC" opacity="0.36" style="animation: pulse 2.6s ease-in-out infinite 0.2s" />
<circle cx="277" cy="151" r="0.7" fill="#A5B4FC" opacity="0.20" style="animation: pulse 3.4s ease-in-out infinite 0.6s" />
<circle cx="199" cy="177" r="1.0" fill="#F8FAFC" opacity="0.40" style="animation: pulse 3.6s ease-in-out infinite 0.8s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

