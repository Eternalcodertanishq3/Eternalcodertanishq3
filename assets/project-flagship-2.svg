<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="36" cy="153" r="0.5" fill="#38BDF8" opacity="0.83" style="animation: pulse 4.5s ease-in-out infinite 0.3s" />
<circle cx="16" cy="96" r="0.9" fill="#A5B4FC" opacity="0.58" style="animation: pulse 4.4s ease-in-out infinite 4.1s" />
<circle cx="267" cy="107" r="0.7" fill="#38BDF8" opacity="0.31" style="animation: pulse 2.0s ease-in-out infinite 0.5s" />
<circle cx="230" cy="34" r="1.0" fill="#A5B4FC" opacity="0.56" style="animation: pulse 2.7s ease-in-out infinite 4.6s" />
<circle cx="87" cy="4" r="1.2" fill="#A5B4FC" opacity="0.75" style="animation: pulse 3.2s ease-in-out infinite 3.4s" />
<circle cx="235" cy="154" r="1.0" fill="#F8FAFC" opacity="0.54" style="animation: pulse 3.6s ease-in-out infinite 2.5s" />
<circle cx="173" cy="146" r="0.8" fill="#F8FAFC" opacity="0.54" style="animation: pulse 4.6s ease-in-out infinite 2.4s" />
<circle cx="122" cy="92" r="0.8" fill="#F8FAFC" opacity="0.16" style="animation: pulse 4.9s ease-in-out infinite 0.5s" />
<circle cx="262" cy="140" r="1.1" fill="#38BDF8" opacity="0.76" style="animation: pulse 4.1s ease-in-out infinite 2.4s" />
<circle cx="60" cy="132" r="1.1" fill="#F8FAFC" opacity="0.69" style="animation: pulse 2.8s ease-in-out infinite 1.5s" />
<circle cx="20" cy="115" r="1.1" fill="#A5B4FC" opacity="0.34" style="animation: pulse 2.5s ease-in-out infinite 1.9s" />
<circle cx="131" cy="38" r="0.8" fill="#F8FAFC" opacity="0.55" style="animation: pulse 4.0s ease-in-out infinite 1.6s" />
<circle cx="209" cy="51" r="0.4" fill="#F8FAFC" opacity="0.17" style="animation: pulse 2.8s ease-in-out infinite 1.4s" />
<circle cx="199" cy="45" r="1.1" fill="#A5B4FC" opacity="0.47" style="animation: pulse 2.6s ease-in-out infinite 1.5s" />
<circle cx="2" cy="32" r="0.7" fill="#F8FAFC" opacity="0.30" style="animation: pulse 3.0s ease-in-out infinite 4.5s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>