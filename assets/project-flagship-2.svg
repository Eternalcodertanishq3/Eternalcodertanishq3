<circle cx="257" cy="88" r="0.9" fill="#38BDF8" opacity="0.79" style="animation: pulse 4.6s ease-in-out infinite 1.8s" />
<circle cx="101" cy="109" r="0.5" fill="#38BDF8" opacity="0.63" style="animation: pulse 2.9s ease-in-out infinite 4.7s" />
<circle cx="161" cy="169" r="0.9" fill="#38BDF8" opacity="0.71" style="animation: pulse 3.5s ease-in-out infinite 4.6s" />
<circle cx="108" cy="30" r="1.1" fill="#38BDF8" opacity="0.75" style="animation: pulse 2.9s ease-in-out infinite 4.5s" />
<circle cx="14" cy="60" r="0.9" fill="#818CF8" opacity="0.73" style="animation: pulse 4.5s ease-in-out infinite 1.7s" />
<circle cx="253" cy="56" r="1.0" fill="#38BDF8" opacity="0.75" style="animation: pulse 3.8s ease-in-out infinite 2.7s" />
<circle cx="67" cy="36" r="0.9" fill="#818CF8" opacity="0.42" style="animation: pulse 5.0s ease-in-out infinite 3.9s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


