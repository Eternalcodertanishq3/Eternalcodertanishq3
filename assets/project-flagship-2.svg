<circle cx="236" cy="197" r="1.0" fill="#F8FAFC" opacity="0.77" style="animation: pulse 4.3s ease-in-out infinite 3.4s" />
<circle cx="261" cy="198" r="0.6" fill="#A5B4FC" opacity="0.49" style="animation: pulse 3.8s ease-in-out infinite 2.1s" />
