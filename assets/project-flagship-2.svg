<circle cx="2" cy="40" r="0.9" fill="#818CF8" opacity="0.33" style="animation: pulse 2.4s ease-in-out infinite 0.2s" />
<circle cx="11" cy="82" r="0.6" fill="#38BDF8" opacity="0.20" style="animation: pulse 2.4s ease-in-out infinite 0.1s" />
