<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="65" cy="180" r="0.6" fill="#F8FAFC" opacity="0.52" style="animation: pulse 3.3s ease-in-out infinite 1.3s" />
<circle cx="256" cy="120" r="1.0" fill="#A5B4FC" opacity="0.27" style="animation: pulse 2.9s ease-in-out infinite 4.5s" />
<circle cx="74" cy="55" r="1.0" fill="#38BDF8" opacity="0.40" style="animation: pulse 2.4s ease-in-out infinite 1.0s" />
<circle cx="164" cy="16" r="0.5" fill="#38BDF8" opacity="0.39" style="animation: pulse 4.8s ease-in-out infinite 1.2s" />
<circle cx="181" cy="46" r="1.2" fill="#38BDF8" opacity="0.30" style="animation: pulse 3.2s ease-in-out infinite 2.5s" />
<circle cx="158" cy="216" r="0.4" fill="#A5B4FC" opacity="0.68" style="animation: pulse 5.0s ease-in-out infinite 2.5s" />
<circle cx="68" cy="76" r="0.5" fill="#818CF8" opacity="0.36" style="animation: pulse 2.2s ease-in-out infinite 0.5s" />
<circle cx="71" cy="24" r="0.5" fill="#38BDF8" opacity="0.62" style="animation: pulse 4.1s ease-in-out infinite 2.2s" />
<circle cx="205" cy="176" r="1.0" fill="#F8FAFC" opacity="0.70" style="animation: pulse 4.8s ease-in-out infinite 3.9s" />
<circle cx="87" cy="85" r="0.9" fill="#F8FAFC" opacity="0.20" style="animation: pulse 4.7s ease-in-out infinite 2.2s" />
<circle cx="42" cy="135" r="0.5" fill="#818CF8" opacity="0.51" style="animation: pulse 3.5s ease-in-out infinite 3.0s" />
<circle cx="193" cy="191" r="0.6" fill="#F8FAFC" opacity="0.39" style="animation: pulse 2.4s ease-in-out infinite 1.1s" />
<circle cx="10" cy="75" r="0.7" fill="#38BDF8" opacity="0.78" style="animation: pulse 3.9s ease-in-out infinite 0.5s" />
<circle cx="98" cy="129" r="0.7" fill="#F8FAFC" opacity="0.27" style="animation: pulse 4.7s ease-in-out infinite 2.7s" />
<circle cx="9" cy="10" r="1.0" fill="#F8FAFC" opacity="0.25" style="animation: pulse 3.9s ease-in-out infinite 0.8s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>