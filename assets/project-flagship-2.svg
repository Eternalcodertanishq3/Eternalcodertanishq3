<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="4" cy="79" r="0.6" fill="#818CF8" opacity="0.78" style="animation: pulse 2.8s ease-in-out infinite 2.6s" />
<circle cx="4" cy="71" r="0.7" fill="#F8FAFC" opacity="0.76" style="animation: pulse 2.9s ease-in-out infinite 3.7s" />
<circle cx="7" cy="88" r="0.6" fill="#F8FAFC" opacity="0.22" style="animation: pulse 4.4s ease-in-out infinite 0.4s" />
<circle cx="249" cy="201" r="0.5" fill="#818CF8" opacity="0.35" style="animation: pulse 4.1s ease-in-out infinite 4.7s" />
<circle cx="190" cy="81" r="1.2" fill="#F8FAFC" opacity="0.83" style="animation: pulse 2.3s ease-in-out infinite 3.7s" />
<circle cx="1" cy="55" r="0.9" fill="#F8FAFC" opacity="0.41" style="animation: pulse 2.5s ease-in-out infinite 1.0s" />
<circle cx="251" cy="32" r="0.6" fill="#A5B4FC" opacity="0.65" style="animation: pulse 2.9s ease-in-out infinite 2.7s" />
<circle cx="240" cy="202" r="0.5" fill="#A5B4FC" opacity="0.35" style="animation: pulse 3.1s ease-in-out infinite 4.1s" />
<circle cx="22" cy="191" r="0.6" fill="#F8FAFC" opacity="0.68" style="animation: pulse 3.2s ease-in-out infinite 3.4s" />
<circle cx="213" cy="26" r="1.0" fill="#A5B4FC" opacity="0.83" style="animation: pulse 2.2s ease-in-out infinite 1.3s" />
<circle cx="255" cy="1" r="1.2" fill="#38BDF8" opacity="0.80" style="animation: pulse 3.0s ease-in-out infinite 0.6s" />
<circle cx="197" cy="115" r="0.5" fill="#A5B4FC" opacity="0.27" style="animation: pulse 2.0s ease-in-out infinite 1.6s" />
<circle cx="169" cy="206" r="0.4" fill="#F8FAFC" opacity="0.20" style="animation: pulse 2.5s ease-in-out infinite 3.4s" />
<circle cx="6" cy="60" r="0.4" fill="#38BDF8" opacity="0.64" style="animation: pulse 3.3s ease-in-out infinite 1.4s" />
<circle cx="146" cy="206" r="1.0" fill="#818CF8" opacity="0.19" style="animation: pulse 3.7s ease-in-out infinite 1.2s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>