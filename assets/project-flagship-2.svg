<circle cx="247" cy="41" r="1.0" fill="#38BDF8" opacity="0.36" style="animation: pulse 4.8s ease-in-out infinite 1.9s" />
<circle cx="120" cy="219" r="1.0" fill="#818CF8" opacity="0.19" style="animation: pulse 4.3s ease-in-out infinite 1.6s" />
<circle cx="258" cy="28" r="1.2" fill="#F8FAFC" opacity="0.23" style="animation: pulse 3.5s ease-in-out infinite 1.3s" />
<circle cx="225" cy="126" r="1.2" fill="#F8FAFC" opacity="0.39" style="animation: pulse 3.0s ease-in-out infinite 0.9s" />
<circle cx="66" cy="112" r="0.7" fill="#F8FAFC" opacity="0.68" style="animation: pulse 2.1s ease-in-out infinite 3.0s" />
<circle cx="113" cy="39" r="0.5" fill="#A5B4FC" opacity="0.45" style="animation: pulse 2.2s ease-in-out infinite 4.8s" />
<circle cx="253" cy="77" r="1.2" fill="#818CF8" opacity="0.74" style="animation: pulse 2.3s ease-in-out infinite 4.4s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


