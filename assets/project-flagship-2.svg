<circle cx="95" cy="219" r="0.8" fill="#F8FAFC" opacity="0.65" style="animation: pulse 2.0s ease-in-out infinite 4.1s" />
<circle cx="99" cy="215" r="0.9" fill="#A5B4FC" opacity="0.75" style="animation: pulse 4.1s ease-in-out infinite 0.3s" />
<circle cx="55" cy="219" r="0.5" fill="#F8FAFC" opacity="0.81" style="animation: pulse 4.9s ease-in-out infinite 3.7s" />
<circle cx="129" cy="195" r="0.9" fill="#F8FAFC" opacity="0.59" style="animation: pulse 3.4s ease-in-out infinite 3.5s" />
<circle cx="277" cy="138" r="0.9" fill="#F8FAFC" opacity="0.58" style="animation: pulse 4.4s ease-in-out infinite 3.1s" />
<circle cx="261" cy="149" r="0.7" fill="#A5B4FC" opacity="0.69" style="animation: pulse 4.7s ease-in-out infinite 1.5s" />
<circle cx="147" cy="125" r="0.7" fill="#F8FAFC" opacity="0.72" style="animation: pulse 4.0s ease-in-out infinite 3.8s" />
<circle cx="17" cy="138" r="0.8" fill="#F8FAFC" opacity="0.36" style="animation: pulse 4.1s ease-in-out infinite 1.2s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


