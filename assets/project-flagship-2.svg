<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="196" cy="33" r="1.0" fill="#F8FAFC" opacity="0.71" style="animation: pulse 4.4s ease-in-out infinite 4.8s" />
<circle cx="260" cy="42" r="0.6" fill="#F8FAFC" opacity="0.18" style="animation: pulse 3.3s ease-in-out infinite 3.8s" />
<circle cx="258" cy="203" r="0.9" fill="#F8FAFC" opacity="0.35" style="animation: pulse 2.5s ease-in-out infinite 0.4s" />
<circle cx="216" cy="101" r="1.2" fill="#F8FAFC" opacity="0.49" style="animation: pulse 4.0s ease-in-out infinite 0.5s" />
<circle cx="164" cy="45" r="0.8" fill="#818CF8" opacity="0.58" style="animation: pulse 4.0s ease-in-out infinite 0.6s" />
<circle cx="6" cy="181" r="0.8" fill="#38BDF8" opacity="0.37" style="animation: pulse 4.4s ease-in-out infinite 2.6s" />
<circle cx="193" cy="137" r="0.7" fill="#F8FAFC" opacity="0.36" style="animation: pulse 2.4s ease-in-out infinite 2.8s" />
<circle cx="60" cy="40" r="1.0" fill="#A5B4FC" opacity="0.55" style="animation: pulse 2.7s ease-in-out infinite 0.3s" />
<circle cx="251" cy="210" r="0.9" fill="#F8FAFC" opacity="0.53" style="animation: pulse 2.5s ease-in-out infinite 0.3s" />
<circle cx="268" cy="108" r="0.6" fill="#38BDF8" opacity="0.23" style="animation: pulse 3.8s ease-in-out infinite 4.8s" />
<circle cx="186" cy="134" r="0.8" fill="#818CF8" opacity="0.38" style="animation: pulse 3.8s ease-in-out infinite 1.3s" />
<circle cx="5" cy="191" r="1.0" fill="#F8FAFC" opacity="0.76" style="animation: pulse 3.9s ease-in-out infinite 4.8s" />
<circle cx="188" cy="147" r="1.0" fill="#A5B4FC" opacity="0.27" style="animation: pulse 5.0s ease-in-out infinite 2.6s" />
<circle cx="59" cy="159" r="0.9" fill="#38BDF8" opacity="0.66" style="animation: pulse 3.8s ease-in-out infinite 0.2s" />
<circle cx="250" cy="214" r="0.6" fill="#A5B4FC" opacity="0.69" style="animation: pulse 3.9s ease-in-out infinite 0.3s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

