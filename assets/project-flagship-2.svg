<circle cx="219" cy="83" r="1.1" fill="#818CF8" opacity="0.64" style="animation: pulse 3.7s ease-in-out infinite 2.7s" />
<circle cx="231" cy="213" r="1.2" fill="#38BDF8" opacity="0.71" style="animation: pulse 3.0s ease-in-out infinite 3.0s" />
<circle cx="154" cy="129" r="0.9" fill="#A5B4FC" opacity="0.41" style="animation: pulse 4.5s ease-in-out infinite 0.3s" />
<circle cx="174" cy="131" r="1.1" fill="#F8FAFC" opacity="0.40" style="animation: pulse 4.4s ease-in-out infinite 2.1s" />
<circle cx="121" cy="150" r="0.8" fill="#F8FAFC" opacity="0.82" style="animation: pulse 5.0s ease-in-out infinite 3.2s" />
<circle cx="194" cy="146" r="0.5" fill="#F8FAFC" opacity="0.73" style="animation: pulse 4.6s ease-in-out infinite 2.4s" />
<circle cx="161" cy="16" r="0.9" fill="#818CF8" opacity="0.31" style="animation: pulse 4.5s ease-in-out infinite 3.0s" />
<circle cx="183" cy="38" r="0.6" fill="#818CF8" opacity="0.68" style="animation: pulse 3.7s ease-in-out infinite 1.0s" />
<circle cx="61" cy="190" r="0.6" fill="#A5B4FC" opacity="0.68" style="animation: pulse 2.8s ease-in-out infinite 1.5s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

