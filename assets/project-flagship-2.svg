<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="12" cy="196" r="0.4" fill="#818CF8" opacity="0.84" style="animation: pulse 2.8s ease-in-out infinite 2.8s" />
<circle cx="67" cy="96" r="0.7" fill="#818CF8" opacity="0.28" style="animation: pulse 4.4s ease-in-out infinite 3.0s" />
<circle cx="118" cy="91" r="0.4" fill="#38BDF8" opacity="0.40" style="animation: pulse 3.0s ease-in-out infinite 3.0s" />
<circle cx="171" cy="87" r="0.5" fill="#A5B4FC" opacity="0.48" style="animation: pulse 2.9s ease-in-out infinite 1.1s" />
