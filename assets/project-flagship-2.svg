<circle cx="25" cy="34" r="0.9" fill="#818CF8" opacity="0.55" style="animation: pulse 2.4s ease-in-out infinite 1.4s" />
<circle cx="69" cy="74" r="0.7" fill="#A5B4FC" opacity="0.80" style="animation: pulse 3.6s ease-in-out infinite 3.7s" />
<circle cx="154" cy="49" r="0.9" fill="#38BDF8" opacity="0.29" style="animation: pulse 4.6s ease-in-out infinite 1.5s" />
<circle cx="164" cy="20" r="1.1" fill="#A5B4FC" opacity="0.71" style="animation: pulse 3.4s ease-in-out infinite 4.2s" />
<circle cx="17" cy="194" r="0.6" fill="#F8FAFC" opacity="0.45" style="animation: pulse 3.5s ease-in-out infinite 4.8s" />
<circle cx="271" cy="125" r="1.0" fill="#38BDF8" opacity="0.16" style="animation: pulse 2.3s ease-in-out infinite 4.9s" />
<circle cx="162" cy="126" r="1.0" fill="#F8FAFC" opacity="0.35" style="animation: pulse 2.5s ease-in-out infinite 2.7s" />
<circle cx="162" cy="210" r="0.8" fill="#A5B4FC" opacity="0.24" style="animation: pulse 2.9s ease-in-out infinite 3.3s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
