<circle cx="239" cy="181" r="1.2" fill="#F8FAFC" opacity="0.42" style="animation: pulse 3.8s ease-in-out infinite 2.2s" />
<circle cx="18" cy="179" r="1.0" fill="#818CF8" opacity="0.76" style="animation: pulse 3.7s ease-in-out infinite 4.4s" />
