<circle cx="197" cy="199" r="1.0" fill="#A5B4FC" opacity="0.19" style="animation: pulse 5.0s ease-in-out infinite 4.2s" />
<circle cx="155" cy="219" r="0.8" fill="#818CF8" opacity="0.26" style="animation: pulse 2.9s ease-in-out infinite 3.2s" />
<circle cx="16" cy="21" r="0.6" fill="#818CF8" opacity="0.60" style="animation: pulse 2.8s ease-in-out infinite 1.8s" />
<circle cx="239" cy="196" r="0.4" fill="#38BDF8" opacity="0.26" style="animation: pulse 2.7s ease-in-out infinite 1.1s" />
<circle cx="264" cy="30" r="1.1" fill="#F8FAFC" opacity="0.46" style="animation: pulse 2.9s ease-in-out infinite 3.0s" />
<circle cx="247" cy="29" r="0.7" fill="#F8FAFC" opacity="0.40" style="animation: pulse 4.3s ease-in-out infinite 1.5s" />
