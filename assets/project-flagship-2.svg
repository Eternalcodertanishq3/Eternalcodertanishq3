<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="75" cy="88" r="0.6" fill="#818CF8" opacity="0.66" style="animation: pulse 3.7s ease-in-out infinite 1.5s" />
<circle cx="127" cy="30" r="0.9" fill="#F8FAFC" opacity="0.26" style="animation: pulse 2.6s ease-in-out infinite 2.0s" />
<circle cx="273" cy="81" r="1.2" fill="#A5B4FC" opacity="0.21" style="animation: pulse 5.0s ease-in-out infinite 2.9s" />
<circle cx="271" cy="36" r="0.9" fill="#818CF8" opacity="0.53" style="animation: pulse 3.7s ease-in-out infinite 4.2s" />
<circle cx="257" cy="58" r="0.7" fill="#38BDF8" opacity="0.84" style="animation: pulse 2.7s ease-in-out infinite 3.6s" />
<circle cx="45" cy="15" r="0.8" fill="#A5B4FC" opacity="0.17" style="animation: pulse 3.8s ease-in-out infinite 4.0s" />
<circle cx="48" cy="182" r="1.0" fill="#A5B4FC" opacity="0.39" style="animation: pulse 3.8s ease-in-out infinite 3.8s" />
<circle cx="67" cy="75" r="1.0" fill="#38BDF8" opacity="0.54" style="animation: pulse 3.1s ease-in-out infinite 0.2s" />
<circle cx="112" cy="209" r="1.0" fill="#F8FAFC" opacity="0.24" style="animation: pulse 3.5s ease-in-out infinite 1.8s" />
<circle cx="52" cy="62" r="0.6" fill="#818CF8" opacity="0.34" style="animation: pulse 4.0s ease-in-out infinite 4.8s" />
<circle cx="71" cy="165" r="0.8" fill="#38BDF8" opacity="0.66" style="animation: pulse 4.7s ease-in-out infinite 1.4s" />
<circle cx="95" cy="115" r="0.6" fill="#38BDF8" opacity="0.23" style="animation: pulse 2.9s ease-in-out infinite 4.2s" />
<circle cx="138" cy="157" r="0.6" fill="#38BDF8" opacity="0.84" style="animation: pulse 3.5s ease-in-out infinite 3.3s" />
<circle cx="53" cy="53" r="0.8" fill="#F8FAFC" opacity="0.68" style="animation: pulse 2.6s ease-in-out infinite 0.7s" />
<circle cx="87" cy="156" r="0.7" fill="#818CF8" opacity="0.40" style="animation: pulse 2.4s ease-in-out infinite 0.5s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>