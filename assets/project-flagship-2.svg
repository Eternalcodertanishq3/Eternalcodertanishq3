<circle cx="123" cy="125" r="0.5" fill="#F8FAFC" opacity="0.31" style="animation: pulse 3.9s ease-in-out infinite 0.1s" />
<circle cx="8" cy="218" r="0.4" fill="#A5B4FC" opacity="0.83" style="animation: pulse 2.6s ease-in-out infinite 1.9s" />
<circle cx="233" cy="137" r="0.6" fill="#F8FAFC" opacity="0.67" style="animation: pulse 4.3s ease-in-out infinite 0.2s" />
