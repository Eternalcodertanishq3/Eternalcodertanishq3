<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="228" cy="71" r="1.0" fill="#818CF8" opacity="0.28" style="animation: pulse 4.8s ease-in-out infinite 0.9s" />
<circle cx="56" cy="64" r="0.4" fill="#A5B4FC" opacity="0.17" style="animation: pulse 2.4s ease-in-out infinite 4.3s" />
<circle cx="208" cy="175" r="0.7" fill="#38BDF8" opacity="0.66" style="animation: pulse 3.9s ease-in-out infinite 0.6s" />
<circle cx="155" cy="24" r="0.8" fill="#818CF8" opacity="0.39" style="animation: pulse 2.1s ease-in-out infinite 1.5s" />
<circle cx="62" cy="9" r="0.5" fill="#818CF8" opacity="0.66" style="animation: pulse 4.7s ease-in-out infinite 4.1s" />
<circle cx="136" cy="136" r="0.7" fill="#A5B4FC" opacity="0.75" style="animation: pulse 3.8s ease-in-out infinite 1.7s" />
<circle cx="199" cy="55" r="0.8" fill="#818CF8" opacity="0.82" style="animation: pulse 3.7s ease-in-out infinite 3.3s" />
<circle cx="205" cy="214" r="0.7" fill="#A5B4FC" opacity="0.85" style="animation: pulse 2.8s ease-in-out infinite 3.1s" />
<circle cx="203" cy="106" r="0.9" fill="#818CF8" opacity="0.71" style="animation: pulse 5.0s ease-in-out infinite 3.0s" />
<circle cx="230" cy="149" r="0.5" fill="#38BDF8" opacity="0.43" style="animation: pulse 4.0s ease-in-out infinite 1.5s" />
<circle cx="278" cy="140" r="1.1" fill="#A5B4FC" opacity="0.26" style="animation: pulse 3.9s ease-in-out infinite 2.2s" />
<circle cx="84" cy="58" r="0.7" fill="#38BDF8" opacity="0.21" style="animation: pulse 4.4s ease-in-out infinite 4.8s" />
<circle cx="75" cy="184" r="1.1" fill="#A5B4FC" opacity="0.33" style="animation: pulse 2.2s ease-in-out infinite 3.1s" />
<circle cx="67" cy="89" r="0.6" fill="#818CF8" opacity="0.18" style="animation: pulse 4.2s ease-in-out infinite 1.9s" />
<circle cx="233" cy="125" r="0.5" fill="#F8FAFC" opacity="0.68" style="animation: pulse 4.5s ease-in-out infinite 1.7s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>