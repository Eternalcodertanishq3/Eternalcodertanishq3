<circle cx="147" cy="133" r="0.8" fill="#A5B4FC" opacity="0.48" style="animation: pulse 3.2s ease-in-out infinite 1.5s" />
<circle cx="131" cy="46" r="0.4" fill="#F8FAFC" opacity="0.79" style="animation: pulse 2.7s ease-in-out infinite 1.1s" />
<circle cx="137" cy="169" r="0.5" fill="#F8FAFC" opacity="0.67" style="animation: pulse 3.1s ease-in-out infinite 3.1s" />
<circle cx="191" cy="155" r="0.7" fill="#38BDF8" opacity="0.68" style="animation: pulse 3.5s ease-in-out infinite 2.2s" />
<circle cx="32" cy="214" r="0.8" fill="#A5B4FC" opacity="0.46" style="animation: pulse 4.2s ease-in-out infinite 3.3s" />
<circle cx="116" cy="168" r="0.6" fill="#A5B4FC" opacity="0.52" style="animation: pulse 2.0s ease-in-out infinite 3.0s" />
<circle cx="139" cy="12" r="0.9" fill="#818CF8" opacity="0.69" style="animation: pulse 2.3s ease-in-out infinite 4.0s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


