<circle cx="211" cy="209" r="0.5" fill="#818CF8" opacity="0.46" style="animation: pulse 3.4s ease-in-out infinite 3.8s" />
<circle cx="60" cy="15" r="1.0" fill="#818CF8" opacity="0.81" style="animation: pulse 2.8s ease-in-out infinite 1.4s" />
<circle cx="143" cy="76" r="1.1" fill="#38BDF8" opacity="0.76" style="animation: pulse 4.2s ease-in-out infinite 3.5s" />
<circle cx="138" cy="91" r="0.9" fill="#A5B4FC" opacity="0.78" style="animation: pulse 4.3s ease-in-out infinite 1.4s" />
<circle cx="82" cy="17" r="0.8" fill="#A5B4FC" opacity="0.49" style="animation: pulse 2.4s ease-in-out infinite 3.2s" />
<circle cx="268" cy="111" r="1.1" fill="#A5B4FC" opacity="0.80" style="animation: pulse 3.5s ease-in-out infinite 4.6s" />
<circle cx="139" cy="23" r="1.0" fill="#F8FAFC" opacity="0.22" style="animation: pulse 2.9s ease-in-out infinite 0.2s" />
<circle cx="161" cy="83" r="0.9" fill="#818CF8" opacity="0.34" style="animation: pulse 3.3s ease-in-out infinite 3.2s" />
<circle cx="149" cy="117" r="0.4" fill="#38BDF8" opacity="0.40" style="animation: pulse 3.4s ease-in-out infinite 3.3s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


