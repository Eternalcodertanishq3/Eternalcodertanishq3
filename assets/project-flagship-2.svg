<circle cx="224" cy="214" r="0.9" fill="#38BDF8" opacity="0.69" style="animation: pulse 4.0s ease-in-out infinite 0.7s" />
<circle cx="270" cy="5" r="0.8" fill="#F8FAFC" opacity="0.50" style="animation: pulse 2.1s ease-in-out infinite 1.6s" />
<circle cx="201" cy="37" r="1.0" fill="#F8FAFC" opacity="0.36" style="animation: pulse 2.8s ease-in-out infinite 2.7s" />
<circle cx="110" cy="164" r="0.8" fill="#A5B4FC" opacity="0.68" style="animation: pulse 2.3s ease-in-out infinite 4.9s" />
<circle cx="271" cy="17" r="0.6" fill="#818CF8" opacity="0.38" style="animation: pulse 4.5s ease-in-out infinite 5.0s" />
<circle cx="43" cy="130" r="0.8" fill="#818CF8" opacity="0.21" style="animation: pulse 2.0s ease-in-out infinite 1.0s" />
<circle cx="54" cy="212" r="1.2" fill="#F8FAFC" opacity="0.52" style="animation: pulse 4.0s ease-in-out infinite 2.0s" />
<circle cx="247" cy="27" r="0.6" fill="#818CF8" opacity="0.57" style="animation: pulse 2.0s ease-in-out infinite 4.9s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

