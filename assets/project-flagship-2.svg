<circle cx="61" cy="170" r="0.9" fill="#F8FAFC" opacity="0.25" style="animation: pulse 3.7s ease-in-out infinite 2.4s" />
<circle cx="251" cy="2" r="1.2" fill="#A5B4FC" opacity="0.70" style="animation: pulse 4.1s ease-in-out infinite 3.9s" />
<circle cx="64" cy="60" r="0.9" fill="#818CF8" opacity="0.28" style="animation: pulse 2.4s ease-in-out infinite 3.0s" />
<circle cx="225" cy="54" r="0.7" fill="#A5B4FC" opacity="0.63" style="animation: pulse 3.1s ease-in-out infinite 4.9s" />
<circle cx="118" cy="198" r="1.1" fill="#F8FAFC" opacity="0.62" style="animation: pulse 2.4s ease-in-out infinite 4.3s" />
<circle cx="106" cy="30" r="0.8" fill="#38BDF8" opacity="0.48" style="animation: pulse 3.8s ease-in-out infinite 2.8s" />
