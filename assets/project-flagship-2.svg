<circle cx="33" cy="182" r="0.4" fill="#818CF8" opacity="0.35" style="animation: pulse 3.5s ease-in-out infinite 3.4s" />
<circle cx="172" cy="207" r="0.9" fill="#818CF8" opacity="0.52" style="animation: pulse 4.7s ease-in-out infinite 0.6s" />
<circle cx="39" cy="78" r="0.9" fill="#38BDF8" opacity="0.27" style="animation: pulse 4.8s ease-in-out infinite 4.9s" />
<circle cx="5" cy="201" r="0.7" fill="#38BDF8" opacity="0.72" style="animation: pulse 2.5s ease-in-out infinite 1.5s" />
<circle cx="107" cy="79" r="1.0" fill="#F8FAFC" opacity="0.39" style="animation: pulse 4.8s ease-in-out infinite 1.7s" />
<circle cx="176" cy="75" r="1.0" fill="#A5B4FC" opacity="0.37" style="animation: pulse 3.9s ease-in-out infinite 4.5s" />
<circle cx="15" cy="102" r="1.0" fill="#A5B4FC" opacity="0.85" style="animation: pulse 4.7s ease-in-out infinite 3.2s" />
<circle cx="83" cy="77" r="0.6" fill="#A5B4FC" opacity="0.55" style="animation: pulse 3.4s ease-in-out infinite 2.7s" />
<circle cx="34" cy="79" r="1.0" fill="#38BDF8" opacity="0.37" style="animation: pulse 4.0s ease-in-out infinite 3.1s" />
<circle cx="58" cy="204" r="0.5" fill="#818CF8" opacity="0.46" style="animation: pulse 2.4s ease-in-out infinite 5.0s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

