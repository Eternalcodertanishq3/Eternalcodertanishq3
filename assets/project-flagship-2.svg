<circle cx="32" cy="174" r="1.1" fill="#38BDF8" opacity="0.34" style="animation: pulse 3.5s ease-in-out infinite 1.0s" />
<circle cx="179" cy="75" r="0.6" fill="#38BDF8" opacity="0.54" style="animation: pulse 2.4s ease-in-out infinite 1.6s" />
<circle cx="252" cy="8" r="1.0" fill="#38BDF8" opacity="0.48" style="animation: pulse 3.3s ease-in-out infinite 1.7s" />
<circle cx="138" cy="27" r="0.9" fill="#818CF8" opacity="0.84" style="animation: pulse 2.9s ease-in-out infinite 0.4s" />
<circle cx="181" cy="27" r="0.8" fill="#F8FAFC" opacity="0.76" style="animation: pulse 2.2s ease-in-out infinite 2.8s" />
<circle cx="30" cy="46" r="0.8" fill="#818CF8" opacity="0.29" style="animation: pulse 4.9s ease-in-out infinite 3.1s" />
<circle cx="148" cy="93" r="0.8" fill="#818CF8" opacity="0.62" style="animation: pulse 4.5s ease-in-out infinite 2.1s" />
<circle cx="277" cy="68" r="0.7" fill="#F8FAFC" opacity="0.53" style="animation: pulse 2.9s ease-in-out infinite 1.5s" />
<circle cx="58" cy="37" r="0.9" fill="#F8FAFC" opacity="0.44" style="animation: pulse 2.3s ease-in-out infinite 1.9s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


