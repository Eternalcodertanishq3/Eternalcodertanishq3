<circle cx="150" cy="119" r="0.7" fill="#38BDF8" opacity="0.60" style="animation: pulse 4.4s ease-in-out infinite 3.0s" />
<circle cx="178" cy="15" r="1.0" fill="#F8FAFC" opacity="0.51" style="animation: pulse 4.8s ease-in-out infinite 4.8s" />
<circle cx="83" cy="56" r="0.8" fill="#A5B4FC" opacity="0.59" style="animation: pulse 4.3s ease-in-out infinite 1.8s" />
<circle cx="117" cy="43" r="0.5" fill="#A5B4FC" opacity="0.66" style="animation: pulse 3.6s ease-in-out infinite 0.7s" />
<circle cx="191" cy="140" r="0.8" fill="#A5B4FC" opacity="0.47" style="animation: pulse 4.9s ease-in-out infinite 2.6s" />
<circle cx="143" cy="140" r="1.0" fill="#F8FAFC" opacity="0.28" style="animation: pulse 4.7s ease-in-out infinite 2.6s" />
<circle cx="243" cy="80" r="0.6" fill="#A5B4FC" opacity="0.65" style="animation: pulse 2.0s ease-in-out infinite 4.8s" />
<circle cx="267" cy="17" r="0.6" fill="#A5B4FC" opacity="0.79" style="animation: pulse 4.0s ease-in-out infinite 4.2s" />
<circle cx="160" cy="153" r="0.4" fill="#A5B4FC" opacity="0.21" style="animation: pulse 3.5s ease-in-out infinite 1.9s" />
<circle cx="211" cy="183" r="0.9" fill="#818CF8" opacity="0.55" style="animation: pulse 4.4s ease-in-out infinite 3.8s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


