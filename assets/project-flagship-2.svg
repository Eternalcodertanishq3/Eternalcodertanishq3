<circle cx="199" cy="88" r="0.9" fill="#38BDF8" opacity="0.62" style="animation: pulse 3.5s ease-in-out infinite 4.4s" />
<circle cx="88" cy="57" r="1.2" fill="#818CF8" opacity="0.69" style="animation: pulse 4.9s ease-in-out infinite 2.5s" />
<circle cx="190" cy="24" r="0.6" fill="#38BDF8" opacity="0.82" style="animation: pulse 3.6s ease-in-out infinite 0.8s" />
<circle cx="17" cy="207" r="1.0" fill="#A5B4FC" opacity="0.47" style="animation: pulse 2.3s ease-in-out infinite 0.8s" />
<circle cx="93" cy="53" r="0.8" fill="#A5B4FC" opacity="0.48" style="animation: pulse 2.1s ease-in-out infinite 0.8s" />
<circle cx="191" cy="39" r="0.9" fill="#F8FAFC" opacity="0.64" style="animation: pulse 4.6s ease-in-out infinite 4.4s" />
<circle cx="79" cy="165" r="0.4" fill="#38BDF8" opacity="0.59" style="animation: pulse 4.5s ease-in-out infinite 1.7s" />
<circle cx="180" cy="79" r="0.8" fill="#F8FAFC" opacity="0.62" style="animation: pulse 2.0s ease-in-out infinite 2.5s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


