<circle cx="208" cy="35" r="1.0" fill="#A5B4FC" opacity="0.50" style="animation: pulse 3.3s ease-in-out infinite 1.4s" />
<circle cx="151" cy="58" r="0.8" fill="#38BDF8" opacity="0.80" style="animation: pulse 3.7s ease-in-out infinite 2.0s" />
