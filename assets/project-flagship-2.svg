<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="226" cy="209" r="1.0" fill="#A5B4FC" opacity="0.58" style="animation: pulse 4.0s ease-in-out infinite 4.9s" />
<circle cx="264" cy="201" r="1.1" fill="#38BDF8" opacity="0.54" style="animation: pulse 2.5s ease-in-out infinite 4.3s" />
<circle cx="198" cy="215" r="0.7" fill="#38BDF8" opacity="0.61" style="animation: pulse 4.3s ease-in-out infinite 4.6s" />
<circle cx="199" cy="35" r="0.6" fill="#F8FAFC" opacity="0.55" style="animation: pulse 3.6s ease-in-out infinite 0.1s" />
<circle cx="259" cy="88" r="0.9" fill="#818CF8" opacity="0.36" style="animation: pulse 2.5s ease-in-out infinite 2.5s" />
<circle cx="128" cy="212" r="1.1" fill="#A5B4FC" opacity="0.46" style="animation: pulse 4.0s ease-in-out infinite 0.1s" />
<circle cx="5" cy="122" r="1.1" fill="#F8FAFC" opacity="0.33" style="animation: pulse 4.8s ease-in-out infinite 0.3s" />
<circle cx="278" cy="206" r="0.9" fill="#818CF8" opacity="0.82" style="animation: pulse 3.1s ease-in-out infinite 0.0s" />
<circle cx="142" cy="83" r="0.7" fill="#38BDF8" opacity="0.32" style="animation: pulse 3.9s ease-in-out infinite 1.0s" />
<circle cx="185" cy="79" r="1.1" fill="#A5B4FC" opacity="0.34" style="animation: pulse 3.6s ease-in-out infinite 2.5s" />
<circle cx="157" cy="150" r="0.6" fill="#F8FAFC" opacity="0.66" style="animation: pulse 3.6s ease-in-out infinite 3.2s" />
<circle cx="185" cy="213" r="0.7" fill="#A5B4FC" opacity="0.67" style="animation: pulse 4.6s ease-in-out infinite 0.0s" />
<circle cx="244" cy="60" r="0.6" fill="#A5B4FC" opacity="0.47" style="animation: pulse 4.2s ease-in-out infinite 4.0s" />
<circle cx="277" cy="69" r="0.4" fill="#38BDF8" opacity="0.36" style="animation: pulse 3.6s ease-in-out infinite 0.5s" />
<circle cx="85" cy="79" r="0.7" fill="#F8FAFC" opacity="0.23" style="animation: pulse 4.4s ease-in-out infinite 3.0s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>