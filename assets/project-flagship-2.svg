<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="180" cy="207" r="0.6" fill="#38BDF8" opacity="0.60" style="animation: pulse 2.2s ease-in-out infinite 3.0s" />
<circle cx="257" cy="77" r="1.0" fill="#818CF8" opacity="0.49" style="animation: pulse 4.9s ease-in-out infinite 0.3s" />
<circle cx="110" cy="102" r="0.6" fill="#38BDF8" opacity="0.50" style="animation: pulse 2.1s ease-in-out infinite 2.8s" />
<circle cx="11" cy="150" r="0.7" fill="#818CF8" opacity="0.37" style="animation: pulse 2.5s ease-in-out infinite 2.0s" />
