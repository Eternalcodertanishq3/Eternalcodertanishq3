<circle cx="229" cy="153" r="1.1" fill="#38BDF8" opacity="0.74" style="animation: pulse 3.2s ease-in-out infinite 3.9s" />
<circle cx="21" cy="135" r="0.6" fill="#38BDF8" opacity="0.67" style="animation: pulse 3.4s ease-in-out infinite 4.9s" />
