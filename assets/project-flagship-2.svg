<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="56" cy="178" r="0.5" fill="#A5B4FC" opacity="0.69" style="animation: pulse 3.2s ease-in-out infinite 3.3s" />
<circle cx="270" cy="13" r="0.7" fill="#F8FAFC" opacity="0.33" style="animation: pulse 4.3s ease-in-out infinite 4.7s" />
<circle cx="16" cy="120" r="0.9" fill="#A5B4FC" opacity="0.71" style="animation: pulse 2.9s ease-in-out infinite 2.8s" />
<circle cx="165" cy="64" r="0.7" fill="#38BDF8" opacity="0.50" style="animation: pulse 3.0s ease-in-out infinite 4.4s" />
<circle cx="86" cy="87" r="1.1" fill="#818CF8" opacity="0.33" style="animation: pulse 3.6s ease-in-out infinite 3.9s" />
<circle cx="149" cy="115" r="0.7" fill="#F8FAFC" opacity="0.47" style="animation: pulse 4.8s ease-in-out infinite 3.3s" />
<circle cx="89" cy="102" r="1.1" fill="#F8FAFC" opacity="0.62" style="animation: pulse 3.6s ease-in-out infinite 1.0s" />
<circle cx="2" cy="181" r="0.8" fill="#818CF8" opacity="0.26" style="animation: pulse 2.2s ease-in-out infinite 4.0s" />
<circle cx="163" cy="195" r="0.4" fill="#F8FAFC" opacity="0.61" style="animation: pulse 4.3s ease-in-out infinite 1.5s" />
<circle cx="220" cy="187" r="0.6" fill="#F8FAFC" opacity="0.18" style="animation: pulse 4.5s ease-in-out infinite 4.6s" />
<circle cx="160" cy="72" r="0.5" fill="#818CF8" opacity="0.65" style="animation: pulse 3.6s ease-in-out infinite 3.1s" />
<circle cx="131" cy="167" r="1.2" fill="#F8FAFC" opacity="0.36" style="animation: pulse 2.7s ease-in-out infinite 0.7s" />
<circle cx="271" cy="214" r="0.9" fill="#818CF8" opacity="0.21" style="animation: pulse 3.5s ease-in-out infinite 2.4s" />
<circle cx="58" cy="15" r="0.8" fill="#A5B4FC" opacity="0.54" style="animation: pulse 2.3s ease-in-out infinite 1.4s" />
<circle cx="235" cy="68" r="0.8" fill="#818CF8" opacity="0.78" style="animation: pulse 3.9s ease-in-out infinite 1.1s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>