<circle cx="31" cy="141" r="0.6" fill="#38BDF8" opacity="0.23" style="animation: pulse 4.5s ease-in-out infinite 1.7s" />
<circle cx="5" cy="137" r="0.5" fill="#A5B4FC" opacity="0.65" style="animation: pulse 2.5s ease-in-out infinite 4.8s" />
<circle cx="228" cy="202" r="0.9" fill="#38BDF8" opacity="0.41" style="animation: pulse 4.5s ease-in-out infinite 1.0s" />
<circle cx="246" cy="30" r="0.5" fill="#38BDF8" opacity="0.16" style="animation: pulse 2.4s ease-in-out infinite 4.7s" />
<circle cx="25" cy="10" r="1.2" fill="#F8FAFC" opacity="0.29" style="animation: pulse 3.6s ease-in-out infinite 0.3s" />
<circle cx="155" cy="23" r="1.1" fill="#A5B4FC" opacity="0.30" style="animation: pulse 3.5s ease-in-out infinite 1.2s" />
<circle cx="107" cy="15" r="0.7" fill="#A5B4FC" opacity="0.47" style="animation: pulse 4.9s ease-in-out infinite 0.7s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


