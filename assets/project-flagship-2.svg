<circle cx="113" cy="79" r="0.4" fill="#38BDF8" opacity="0.34" style="animation: pulse 4.4s ease-in-out infinite 2.5s" />
<circle cx="198" cy="66" r="0.5" fill="#F8FAFC" opacity="0.65" style="animation: pulse 3.5s ease-in-out infinite 0.3s" />
<circle cx="19" cy="203" r="0.5" fill="#F8FAFC" opacity="0.45" style="animation: pulse 3.7s ease-in-out infinite 1.4s" />
<circle cx="68" cy="37" r="0.7" fill="#F8FAFC" opacity="0.33" style="animation: pulse 3.4s ease-in-out infinite 3.5s" />
<circle cx="279" cy="207" r="0.6" fill="#38BDF8" opacity="0.81" style="animation: pulse 2.7s ease-in-out infinite 1.4s" />
