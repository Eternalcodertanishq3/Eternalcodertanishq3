<circle cx="120" cy="39" r="0.9" fill="#F8FAFC" opacity="0.45" style="animation: pulse 4.7s ease-in-out infinite 1.5s" />
<circle cx="128" cy="162" r="0.6" fill="#F8FAFC" opacity="0.53" style="animation: pulse 3.9s ease-in-out infinite 3.0s" />
<circle cx="259" cy="16" r="0.7" fill="#38BDF8" opacity="0.56" style="animation: pulse 3.8s ease-in-out infinite 0.5s" />
<circle cx="244" cy="133" r="0.8" fill="#F8FAFC" opacity="0.18" style="animation: pulse 4.3s ease-in-out infinite 4.6s" />
<circle cx="248" cy="219" r="1.1" fill="#A5B4FC" opacity="0.37" style="animation: pulse 4.8s ease-in-out infinite 4.5s" />
<circle cx="34" cy="140" r="0.7" fill="#A5B4FC" opacity="0.24" style="animation: pulse 4.9s ease-in-out infinite 2.7s" />
<circle cx="172" cy="50" r="0.7" fill="#A5B4FC" opacity="0.22" style="animation: pulse 4.4s ease-in-out infinite 4.7s" />
<circle cx="140" cy="38" r="0.9" fill="#818CF8" opacity="0.32" style="animation: pulse 4.1s ease-in-out infinite 2.8s" />
<circle cx="269" cy="34" r="0.8" fill="#F8FAFC" opacity="0.84" style="animation: pulse 3.3s ease-in-out infinite 0.7s" />
<circle cx="152" cy="210" r="0.4" fill="#A5B4FC" opacity="0.23" style="animation: pulse 2.5s ease-in-out infinite 4.5s" />
<circle cx="51" cy="107" r="0.6" fill="#38BDF8" opacity="0.66" style="animation: pulse 4.7s ease-in-out infinite 4.1s" />
<circle cx="260" cy="129" r="0.8" fill="#818CF8" opacity="0.18" style="animation: pulse 4.6s ease-in-out infinite 0.6s" />
<circle cx="76" cy="174" r="0.4" fill="#38BDF8" opacity="0.62" style="animation: pulse 2.3s ease-in-out infinite 3.1s" />
<circle cx="124" cy="101" r="1.0" fill="#F8FAFC" opacity="0.53" style="animation: pulse 5.0s ease-in-out infinite 2.3s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

