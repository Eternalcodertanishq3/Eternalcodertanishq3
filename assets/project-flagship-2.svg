<circle cx="162" cy="114" r="0.7" fill="#A5B4FC" opacity="0.80" style="animation: pulse 2.6s ease-in-out infinite 1.2s" />
<circle cx="4" cy="37" r="1.1" fill="#F8FAFC" opacity="0.79" style="animation: pulse 3.7s ease-in-out infinite 4.1s" />
<circle cx="158" cy="154" r="0.5" fill="#F8FAFC" opacity="0.47" style="animation: pulse 4.0s ease-in-out infinite 0.7s" />
