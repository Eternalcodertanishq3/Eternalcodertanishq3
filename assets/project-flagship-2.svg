<circle cx="103" cy="96" r="0.7" fill="#F8FAFC" opacity="0.68" style="animation: pulse 4.0s ease-in-out infinite 3.2s" />
<circle cx="230" cy="196" r="0.5" fill="#818CF8" opacity="0.39" style="animation: pulse 2.4s ease-in-out infinite 1.6s" />
<circle cx="239" cy="9" r="0.9" fill="#F8FAFC" opacity="0.63" style="animation: pulse 2.4s ease-in-out infinite 2.3s" />
<circle cx="89" cy="160" r="0.4" fill="#38BDF8" opacity="0.45" style="animation: pulse 2.0s ease-in-out infinite 0.8s" />
<circle cx="149" cy="7" r="0.7" fill="#A5B4FC" opacity="0.55" style="animation: pulse 2.5s ease-in-out infinite 1.5s" />
<circle cx="74" cy="148" r="1.0" fill="#A5B4FC" opacity="0.70" style="animation: pulse 2.5s ease-in-out infinite 4.2s" />
<circle cx="2" cy="40" r="0.5" fill="#A5B4FC" opacity="0.17" style="animation: pulse 2.6s ease-in-out infinite 0.7s" />
<circle cx="242" cy="138" r="1.1" fill="#A5B4FC" opacity="0.48" style="animation: pulse 2.6s ease-in-out infinite 2.4s" />
<circle cx="48" cy="82" r="1.1" fill="#818CF8" opacity="0.49" style="animation: pulse 2.5s ease-in-out infinite 0.2s" />
<circle cx="158" cy="77" r="0.7" fill="#A5B4FC" opacity="0.67" style="animation: pulse 2.4s ease-in-out infinite 0.0s" />
<circle cx="249" cy="48" r="0.7" fill="#818CF8" opacity="0.33" style="animation: pulse 3.7s ease-in-out infinite 1.6s" />
<circle cx="129" cy="33" r="0.8" fill="#38BDF8" opacity="0.50" style="animation: pulse 2.4s ease-in-out infinite 0.5s" />
<circle cx="70" cy="31" r="0.9" fill="#F8FAFC" opacity="0.26" style="animation: pulse 3.5s ease-in-out infinite 2.9s" />
<circle cx="81" cy="38" r="0.9" fill="#A5B4FC" opacity="0.69" style="animation: pulse 2.4s ease-in-out infinite 1.7s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
