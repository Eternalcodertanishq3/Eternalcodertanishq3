<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="99" cy="155" r="0.6" fill="#38BDF8" opacity="0.59" style="animation: pulse 3.9s ease-in-out infinite 3.6s" />
<circle cx="221" cy="159" r="0.6" fill="#A5B4FC" opacity="0.30" style="animation: pulse 3.4s ease-in-out infinite 4.0s" />
<circle cx="270" cy="81" r="0.8" fill="#38BDF8" opacity="0.42" style="animation: pulse 3.9s ease-in-out infinite 0.8s" />
<circle cx="93" cy="30" r="0.8" fill="#818CF8" opacity="0.72" style="animation: pulse 4.9s ease-in-out infinite 1.0s" />
<circle cx="13" cy="48" r="0.7" fill="#F8FAFC" opacity="0.20" style="animation: pulse 2.6s ease-in-out infinite 4.7s" />
<circle cx="211" cy="15" r="0.6" fill="#F8FAFC" opacity="0.21" style="animation: pulse 2.0s ease-in-out infinite 4.3s" />
<circle cx="93" cy="118" r="0.9" fill="#818CF8" opacity="0.18" style="animation: pulse 4.7s ease-in-out infinite 2.1s" />
<circle cx="199" cy="102" r="0.4" fill="#A5B4FC" opacity="0.49" style="animation: pulse 2.9s ease-in-out infinite 1.5s" />
<circle cx="243" cy="112" r="0.9" fill="#818CF8" opacity="0.35" style="animation: pulse 3.0s ease-in-out infinite 3.7s" />
<circle cx="16" cy="189" r="0.4" fill="#38BDF8" opacity="0.61" style="animation: pulse 2.2s ease-in-out infinite 2.6s" />
<circle cx="98" cy="48" r="1.1" fill="#F8FAFC" opacity="0.83" style="animation: pulse 2.9s ease-in-out infinite 3.4s" />
<circle cx="75" cy="31" r="0.7" fill="#F8FAFC" opacity="0.47" style="animation: pulse 2.6s ease-in-out infinite 3.1s" />
<circle cx="18" cy="206" r="0.5" fill="#38BDF8" opacity="0.54" style="animation: pulse 3.6s ease-in-out infinite 1.9s" />
<circle cx="69" cy="132" r="0.5" fill="#F8FAFC" opacity="0.39" style="animation: pulse 3.4s ease-in-out infinite 1.8s" />
<circle cx="22" cy="207" r="1.2" fill="#F8FAFC" opacity="0.41" style="animation: pulse 2.8s ease-in-out infinite 2.5s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>