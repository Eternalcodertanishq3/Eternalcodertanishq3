<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="231" cy="47" r="0.6" fill="#38BDF8" opacity="0.50" style="animation: pulse 3.9s ease-in-out infinite 3.7s" />
<circle cx="6" cy="21" r="1.0" fill="#818CF8" opacity="0.59" style="animation: pulse 2.3s ease-in-out infinite 4.2s" />
<circle cx="19" cy="70" r="0.5" fill="#A5B4FC" opacity="0.84" style="animation: pulse 4.6s ease-in-out infinite 0.2s" />
<circle cx="234" cy="189" r="0.6" fill="#818CF8" opacity="0.51" style="animation: pulse 2.9s ease-in-out infinite 2.8s" />
<circle cx="144" cy="8" r="1.2" fill="#38BDF8" opacity="0.37" style="animation: pulse 3.2s ease-in-out infinite 4.6s" />
<circle cx="243" cy="17" r="0.7" fill="#38BDF8" opacity="0.67" style="animation: pulse 5.0s ease-in-out infinite 1.3s" />
<circle cx="187" cy="180" r="0.5" fill="#F8FAFC" opacity="0.74" style="animation: pulse 3.7s ease-in-out infinite 1.2s" />
<circle cx="10" cy="208" r="1.0" fill="#F8FAFC" opacity="0.55" style="animation: pulse 4.8s ease-in-out infinite 0.5s" />
<circle cx="275" cy="147" r="1.1" fill="#A5B4FC" opacity="0.42" style="animation: pulse 2.6s ease-in-out infinite 1.6s" />
<circle cx="131" cy="218" r="0.6" fill="#F8FAFC" opacity="0.17" style="animation: pulse 3.4s ease-in-out infinite 4.0s" />
<circle cx="64" cy="44" r="1.1" fill="#38BDF8" opacity="0.59" style="animation: pulse 3.5s ease-in-out infinite 4.4s" />
<circle cx="165" cy="52" r="0.7" fill="#38BDF8" opacity="0.77" style="animation: pulse 3.7s ease-in-out infinite 0.9s" />
<circle cx="225" cy="207" r="0.4" fill="#A5B4FC" opacity="0.84" style="animation: pulse 2.1s ease-in-out infinite 1.4s" />
<circle cx="83" cy="75" r="0.9" fill="#38BDF8" opacity="0.51" style="animation: pulse 3.1s ease-in-out infinite 4.9s" />
<circle cx="12" cy="111" r="1.2" fill="#F8FAFC" opacity="0.23" style="animation: pulse 3.9s ease-in-out infinite 2.5s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>