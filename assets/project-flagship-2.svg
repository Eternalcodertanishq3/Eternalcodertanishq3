<circle cx="266" cy="206" r="0.5" fill="#38BDF8" opacity="0.36" style="animation: pulse 2.0s ease-in-out infinite 3.7s" />
<circle cx="273" cy="205" r="0.4" fill="#F8FAFC" opacity="0.49" style="animation: pulse 2.4s ease-in-out infinite 2.4s" />
<circle cx="240" cy="175" r="1.0" fill="#38BDF8" opacity="0.29" style="animation: pulse 4.5s ease-in-out infinite 2.2s" />
<circle cx="276" cy="75" r="1.1" fill="#A5B4FC" opacity="0.42" style="animation: pulse 3.8s ease-in-out infinite 3.5s" />
<circle cx="90" cy="157" r="0.6" fill="#A5B4FC" opacity="0.29" style="animation: pulse 4.4s ease-in-out infinite 2.6s" />
<circle cx="66" cy="30" r="0.7" fill="#A5B4FC" opacity="0.78" style="animation: pulse 3.1s ease-in-out infinite 0.9s" />
<circle cx="60" cy="72" r="1.0" fill="#F8FAFC" opacity="0.51" style="animation: pulse 4.7s ease-in-out infinite 1.5s" />
<circle cx="233" cy="104" r="0.4" fill="#F8FAFC" opacity="0.55" style="animation: pulse 2.4s ease-in-out infinite 2.0s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


