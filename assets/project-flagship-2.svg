<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="87" cy="28" r="0.7" fill="#F8FAFC" opacity="0.24" style="animation: pulse 5.0s ease-in-out infinite 2.5s" />
<circle cx="19" cy="6" r="0.9" fill="#A5B4FC" opacity="0.33" style="animation: pulse 2.5s ease-in-out infinite 4.1s" />
<circle cx="168" cy="142" r="0.5" fill="#F8FAFC" opacity="0.25" style="animation: pulse 4.0s ease-in-out infinite 1.1s" />
