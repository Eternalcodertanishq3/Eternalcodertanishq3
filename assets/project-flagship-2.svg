<circle cx="182" cy="55" r="1.1" fill="#818CF8" opacity="0.34" style="animation: pulse 4.2s ease-in-out infinite 1.4s" />
<circle cx="238" cy="163" r="1.0" fill="#A5B4FC" opacity="0.49" style="animation: pulse 2.7s ease-in-out infinite 1.2s" />
<circle cx="18" cy="126" r="1.2" fill="#818CF8" opacity="0.49" style="animation: pulse 4.9s ease-in-out infinite 3.2s" />
