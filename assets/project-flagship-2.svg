<circle cx="98" cy="61" r="0.7" fill="#818CF8" opacity="0.62" style="animation: pulse 2.0s ease-in-out infinite 3.2s" />
<circle cx="236" cy="115" r="0.9" fill="#A5B4FC" opacity="0.56" style="animation: pulse 2.8s ease-in-out infinite 2.3s" />
