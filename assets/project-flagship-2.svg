<circle cx="142" cy="183" r="0.7" fill="#818CF8" opacity="0.30" style="animation: pulse 2.9s ease-in-out infinite 0.5s" />
<circle cx="243" cy="203" r="1.0" fill="#38BDF8" opacity="0.80" style="animation: pulse 4.5s ease-in-out infinite 3.2s" />
<circle cx="133" cy="64" r="0.7" fill="#F8FAFC" opacity="0.23" style="animation: pulse 2.9s ease-in-out infinite 2.8s" />
<circle cx="240" cy="133" r="0.8" fill="#818CF8" opacity="0.54" style="animation: pulse 3.8s ease-in-out infinite 1.3s" />
<circle cx="51" cy="169" r="0.6" fill="#A5B4FC" opacity="0.52" style="animation: pulse 3.5s ease-in-out infinite 3.7s" />
<circle cx="93" cy="101" r="1.1" fill="#38BDF8" opacity="0.81" style="animation: pulse 4.2s ease-in-out infinite 0.2s" />
<circle cx="212" cy="94" r="0.6" fill="#818CF8" opacity="0.21" style="animation: pulse 3.3s ease-in-out infinite 3.2s" />
<circle cx="72" cy="187" r="0.6" fill="#818CF8" opacity="0.77" style="animation: pulse 3.9s ease-in-out infinite 4.8s" />
<circle cx="22" cy="75" r="0.5" fill="#38BDF8" opacity="0.41" style="animation: pulse 4.9s ease-in-out infinite 3.1s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


