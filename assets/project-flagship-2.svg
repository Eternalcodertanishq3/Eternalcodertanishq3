<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="23" cy="50" r="1.0" fill="#818CF8" opacity="0.20" style="animation: pulse 4.5s ease-in-out infinite 2.7s" />
<circle cx="155" cy="34" r="1.1" fill="#818CF8" opacity="0.67" style="animation: pulse 4.8s ease-in-out infinite 2.9s" />
<circle cx="47" cy="6" r="0.5" fill="#F8FAFC" opacity="0.67" style="animation: pulse 4.4s ease-in-out infinite 1.6s" />
<circle cx="128" cy="94" r="0.6" fill="#818CF8" opacity="0.18" style="animation: pulse 4.8s ease-in-out infinite 3.7s" />
<circle cx="233" cy="35" r="0.7" fill="#F8FAFC" opacity="0.29" style="animation: pulse 2.2s ease-in-out infinite 1.7s" />
<circle cx="239" cy="102" r="0.6" fill="#A5B4FC" opacity="0.36" style="animation: pulse 3.0s ease-in-out infinite 1.6s" />
<circle cx="12" cy="24" r="1.0" fill="#818CF8" opacity="0.61" style="animation: pulse 3.6s ease-in-out infinite 1.6s" />
<circle cx="163" cy="172" r="1.0" fill="#818CF8" opacity="0.64" style="animation: pulse 2.6s ease-in-out infinite 0.4s" />
<circle cx="76" cy="110" r="0.7" fill="#38BDF8" opacity="0.57" style="animation: pulse 3.2s ease-in-out infinite 2.4s" />
<circle cx="96" cy="32" r="0.9" fill="#A5B4FC" opacity="0.56" style="animation: pulse 4.2s ease-in-out infinite 0.1s" />
<circle cx="197" cy="141" r="0.4" fill="#818CF8" opacity="0.79" style="animation: pulse 2.4s ease-in-out infinite 0.1s" />
<circle cx="253" cy="37" r="0.7" fill="#F8FAFC" opacity="0.36" style="animation: pulse 3.4s ease-in-out infinite 1.3s" />
<circle cx="6" cy="213" r="1.1" fill="#A5B4FC" opacity="0.42" style="animation: pulse 3.0s ease-in-out infinite 0.3s" />
<circle cx="169" cy="90" r="0.5" fill="#38BDF8" opacity="0.43" style="animation: pulse 2.5s ease-in-out infinite 2.4s" />
<circle cx="79" cy="104" r="0.6" fill="#F8FAFC" opacity="0.22" style="animation: pulse 3.1s ease-in-out infinite 2.6s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
