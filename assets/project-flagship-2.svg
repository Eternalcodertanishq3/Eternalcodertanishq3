<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="67" cy="83" r="0.9" fill="#F8FAFC" opacity="0.77" style="animation: pulse 4.8s ease-in-out infinite 4.1s" />
<circle cx="119" cy="61" r="0.9" fill="#A5B4FC" opacity="0.45" style="animation: pulse 3.5s ease-in-out infinite 1.0s" />
<circle cx="253" cy="204" r="1.0" fill="#A5B4FC" opacity="0.36" style="animation: pulse 4.3s ease-in-out infinite 3.0s" />
<circle cx="63" cy="145" r="0.9" fill="#F8FAFC" opacity="0.22" style="animation: pulse 3.4s ease-in-out infinite 4.9s" />
<circle cx="147" cy="125" r="1.0" fill="#818CF8" opacity="0.32" style="animation: pulse 3.5s ease-in-out infinite 1.7s" />
<circle cx="131" cy="205" r="0.5" fill="#F8FAFC" opacity="0.21" style="animation: pulse 3.5s ease-in-out infinite 3.6s" />
<circle cx="16" cy="110" r="1.0" fill="#38BDF8" opacity="0.85" style="animation: pulse 3.4s ease-in-out infinite 0.2s" />
<circle cx="136" cy="190" r="0.7" fill="#A5B4FC" opacity="0.40" style="animation: pulse 3.9s ease-in-out infinite 4.3s" />
<circle cx="159" cy="41" r="0.7" fill="#38BDF8" opacity="0.21" style="animation: pulse 2.9s ease-in-out infinite 0.1s" />
<circle cx="58" cy="194" r="0.5" fill="#A5B4FC" opacity="0.18" style="animation: pulse 3.2s ease-in-out infinite 2.0s" />
<circle cx="23" cy="144" r="0.9" fill="#38BDF8" opacity="0.38" style="animation: pulse 2.3s ease-in-out infinite 2.5s" />
<circle cx="145" cy="171" r="0.4" fill="#A5B4FC" opacity="0.73" style="animation: pulse 4.7s ease-in-out infinite 5.0s" />
<circle cx="68" cy="104" r="1.1" fill="#F8FAFC" opacity="0.69" style="animation: pulse 4.7s ease-in-out infinite 2.4s" />
<circle cx="9" cy="149" r="0.9" fill="#38BDF8" opacity="0.71" style="animation: pulse 2.3s ease-in-out infinite 0.1s" />
<circle cx="108" cy="7" r="0.9" fill="#818CF8" opacity="0.54" style="animation: pulse 4.6s ease-in-out infinite 0.6s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>