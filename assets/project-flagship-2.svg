<circle cx="198" cy="219" r="0.7" fill="#818CF8" opacity="0.19" style="animation: pulse 4.1s ease-in-out infinite 0.5s" />
<circle cx="138" cy="31" r="1.0" fill="#818CF8" opacity="0.66" style="animation: pulse 2.7s ease-in-out infinite 4.8s" />
