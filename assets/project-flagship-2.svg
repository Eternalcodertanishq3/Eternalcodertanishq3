<circle cx="186" cy="118" r="0.8" fill="#F8FAFC" opacity="0.37" style="animation: pulse 3.9s ease-in-out infinite 0.7s" />
<circle cx="4" cy="55" r="0.6" fill="#38BDF8" opacity="0.33" style="animation: pulse 4.6s ease-in-out infinite 3.0s" />
<circle cx="85" cy="71" r="0.7" fill="#818CF8" opacity="0.69" style="animation: pulse 3.5s ease-in-out infinite 0.9s" />
<circle cx="276" cy="27" r="0.8" fill="#F8FAFC" opacity="0.65" style="animation: pulse 3.7s ease-in-out infinite 2.6s" />
<circle cx="82" cy="20" r="0.7" fill="#A5B4FC" opacity="0.42" style="animation: pulse 3.3s ease-in-out infinite 1.3s" />
<circle cx="175" cy="158" r="1.0" fill="#818CF8" opacity="0.44" style="animation: pulse 4.1s ease-in-out infinite 1.4s" />
<circle cx="155" cy="68" r="1.0" fill="#38BDF8" opacity="0.64" style="animation: pulse 3.6s ease-in-out infinite 3.2s" />
<circle cx="149" cy="215" r="0.7" fill="#A5B4FC" opacity="0.27" style="animation: pulse 3.2s ease-in-out infinite 0.4s" />
<circle cx="162" cy="167" r="0.6" fill="#A5B4FC" opacity="0.41" style="animation: pulse 3.8s ease-in-out infinite 0.1s" />
<circle cx="114" cy="91" r="0.4" fill="#F8FAFC" opacity="0.33" style="animation: pulse 2.2s ease-in-out infinite 2.2s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>