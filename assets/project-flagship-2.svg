<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="12" cy="6" r="0.9" fill="#38BDF8" opacity="0.43" style="animation: pulse 3.0s ease-in-out infinite 4.3s" />
<circle cx="235" cy="4" r="0.5" fill="#F8FAFC" opacity="0.53" style="animation: pulse 2.7s ease-in-out infinite 1.0s" />
<circle cx="229" cy="107" r="0.5" fill="#A5B4FC" opacity="0.62" style="animation: pulse 3.1s ease-in-out infinite 2.4s" />
<circle cx="90" cy="131" r="0.8" fill="#38BDF8" opacity="0.52" style="animation: pulse 2.1s ease-in-out infinite 3.6s" />
<circle cx="101" cy="207" r="1.0" fill="#F8FAFC" opacity="0.47" style="animation: pulse 3.1s ease-in-out infinite 0.8s" />
<circle cx="122" cy="216" r="0.8" fill="#F8FAFC" opacity="0.22" style="animation: pulse 4.5s ease-in-out infinite 0.0s" />
<circle cx="73" cy="111" r="1.1" fill="#F8FAFC" opacity="0.63" style="animation: pulse 4.6s ease-in-out infinite 3.2s" />
<circle cx="145" cy="43" r="0.7" fill="#A5B4FC" opacity="0.65" style="animation: pulse 2.0s ease-in-out infinite 3.5s" />
<circle cx="185" cy="49" r="1.0" fill="#F8FAFC" opacity="0.77" style="animation: pulse 3.8s ease-in-out infinite 5.0s" />
<circle cx="32" cy="191" r="1.1" fill="#818CF8" opacity="0.35" style="animation: pulse 3.3s ease-in-out infinite 0.3s" />
<circle cx="56" cy="25" r="0.6" fill="#A5B4FC" opacity="0.54" style="animation: pulse 4.1s ease-in-out infinite 4.9s" />
<circle cx="90" cy="204" r="0.9" fill="#818CF8" opacity="0.19" style="animation: pulse 2.8s ease-in-out infinite 1.7s" />
<circle cx="33" cy="46" r="1.1" fill="#818CF8" opacity="0.56" style="animation: pulse 3.2s ease-in-out infinite 1.0s" />
<circle cx="141" cy="70" r="0.4" fill="#818CF8" opacity="0.46" style="animation: pulse 4.5s ease-in-out infinite 2.2s" />
<circle cx="118" cy="50" r="0.6" fill="#A5B4FC" opacity="0.68" style="animation: pulse 2.3s ease-in-out infinite 0.2s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>