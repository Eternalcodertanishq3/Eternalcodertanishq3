<circle cx="74" cy="55" r="0.4" fill="#A5B4FC" opacity="0.32" style="animation: pulse 3.7s ease-in-out infinite 3.6s" />
<circle cx="259" cy="191" r="0.5" fill="#818CF8" opacity="0.71" style="animation: pulse 3.1s ease-in-out infinite 3.3s" />
<circle cx="144" cy="59" r="0.6" fill="#38BDF8" opacity="0.25" style="animation: pulse 4.5s ease-in-out infinite 4.1s" />
<circle cx="253" cy="97" r="0.6" fill="#A5B4FC" opacity="0.77" style="animation: pulse 4.7s ease-in-out infinite 3.0s" />
<circle cx="15" cy="168" r="0.9" fill="#818CF8" opacity="0.39" style="animation: pulse 4.2s ease-in-out infinite 3.6s" />
<circle cx="248" cy="103" r="0.6" fill="#A5B4FC" opacity="0.38" style="animation: pulse 2.9s ease-in-out infinite 0.1s" />
