<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="124" cy="151" r="0.9" fill="#A5B4FC" opacity="0.43" style="animation: pulse 2.4s ease-in-out infinite 3.6s" />
<circle cx="31" cy="118" r="1.0" fill="#818CF8" opacity="0.64" style="animation: pulse 2.5s ease-in-out infinite 4.0s" />
<circle cx="73" cy="3" r="0.5" fill="#38BDF8" opacity="0.42" style="animation: pulse 2.3s ease-in-out infinite 1.2s" />
<circle cx="10" cy="175" r="1.2" fill="#38BDF8" opacity="0.45" style="animation: pulse 3.3s ease-in-out infinite 2.1s" />
