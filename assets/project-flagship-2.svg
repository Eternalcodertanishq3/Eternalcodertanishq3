<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="252" cy="107" r="0.7" fill="#F8FAFC" opacity="0.43" style="animation: pulse 2.0s ease-in-out infinite 1.5s" />
<circle cx="168" cy="44" r="0.9" fill="#38BDF8" opacity="0.44" style="animation: pulse 4.0s ease-in-out infinite 2.4s" />
<circle cx="249" cy="36" r="1.1" fill="#A5B4FC" opacity="0.24" style="animation: pulse 2.3s ease-in-out infinite 2.4s" />
<circle cx="153" cy="97" r="0.5" fill="#F8FAFC" opacity="0.63" style="animation: pulse 2.1s ease-in-out infinite 2.8s" />
<circle cx="271" cy="198" r="1.1" fill="#A5B4FC" opacity="0.49" style="animation: pulse 3.1s ease-in-out infinite 3.5s" />
<circle cx="221" cy="115" r="0.6" fill="#A5B4FC" opacity="0.16" style="animation: pulse 3.9s ease-in-out infinite 2.1s" />
<circle cx="195" cy="6" r="1.1" fill="#A5B4FC" opacity="0.24" style="animation: pulse 3.3s ease-in-out infinite 0.8s" />
<circle cx="236" cy="164" r="0.8" fill="#F8FAFC" opacity="0.50" style="animation: pulse 3.8s ease-in-out infinite 0.7s" />
<circle cx="166" cy="25" r="0.7" fill="#38BDF8" opacity="0.59" style="animation: pulse 3.1s ease-in-out infinite 1.5s" />
<circle cx="139" cy="214" r="0.5" fill="#A5B4FC" opacity="0.82" style="animation: pulse 2.0s ease-in-out infinite 4.5s" />
<circle cx="124" cy="169" r="0.9" fill="#F8FAFC" opacity="0.69" style="animation: pulse 2.3s ease-in-out infinite 3.5s" />
<circle cx="142" cy="135" r="0.6" fill="#38BDF8" opacity="0.59" style="animation: pulse 3.5s ease-in-out infinite 3.3s" />
<circle cx="32" cy="36" r="0.6" fill="#F8FAFC" opacity="0.20" style="animation: pulse 4.3s ease-in-out infinite 1.1s" />
<circle cx="92" cy="151" r="1.1" fill="#F8FAFC" opacity="0.24" style="animation: pulse 4.1s ease-in-out infinite 2.1s" />
<circle cx="100" cy="3" r="0.8" fill="#818CF8" opacity="0.54" style="animation: pulse 2.3s ease-in-out infinite 1.7s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>