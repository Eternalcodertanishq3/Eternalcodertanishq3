<circle cx="188" cy="149" r="0.4" fill="#818CF8" opacity="0.76" style="animation: pulse 2.3s ease-in-out infinite 3.9s" />
<circle cx="186" cy="198" r="1.0" fill="#F8FAFC" opacity="0.17" style="animation: pulse 4.1s ease-in-out infinite 1.1s" />
<circle cx="216" cy="162" r="0.6" fill="#38BDF8" opacity="0.74" style="animation: pulse 3.5s ease-in-out infinite 1.9s" />
<circle cx="43" cy="183" r="0.7" fill="#38BDF8" opacity="0.36" style="animation: pulse 3.3s ease-in-out infinite 3.1s" />
<circle cx="223" cy="36" r="0.4" fill="#818CF8" opacity="0.54" style="animation: pulse 2.5s ease-in-out infinite 4.7s" />
<circle cx="113" cy="37" r="0.9" fill="#38BDF8" opacity="0.44" style="animation: pulse 2.7s ease-in-out infinite 3.6s" />
<circle cx="241" cy="121" r="1.2" fill="#A5B4FC" opacity="0.17" style="animation: pulse 3.9s ease-in-out infinite 2.6s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


