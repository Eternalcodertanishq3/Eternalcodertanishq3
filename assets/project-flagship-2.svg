<circle cx="182" cy="143" r="0.6" fill="#A5B4FC" opacity="0.61" style="animation: pulse 4.5s ease-in-out infinite 0.4s" />
<circle cx="221" cy="7" r="1.0" fill="#38BDF8" opacity="0.79" style="animation: pulse 4.8s ease-in-out infinite 1.3s" />
<circle cx="35" cy="56" r="1.0" fill="#A5B4FC" opacity="0.84" style="animation: pulse 2.2s ease-in-out infinite 0.9s" />
<circle cx="43" cy="117" r="0.7" fill="#818CF8" opacity="0.49" style="animation: pulse 3.0s ease-in-out infinite 2.1s" />
<circle cx="180" cy="64" r="0.8" fill="#F8FAFC" opacity="0.62" style="animation: pulse 3.7s ease-in-out infinite 4.5s" />
<circle cx="46" cy="87" r="1.0" fill="#F8FAFC" opacity="0.32" style="animation: pulse 3.1s ease-in-out infinite 1.5s" />
<circle cx="26" cy="96" r="0.4" fill="#818CF8" opacity="0.61" style="animation: pulse 2.3s ease-in-out infinite 0.5s" />
<circle cx="61" cy="38" r="0.6" fill="#F8FAFC" opacity="0.67" style="animation: pulse 3.9s ease-in-out infinite 3.1s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


