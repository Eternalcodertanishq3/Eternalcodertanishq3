<circle cx="154" cy="123" r="1.1" fill="#A5B4FC" opacity="0.57" style="animation: pulse 4.5s ease-in-out infinite 0.5s" />
<circle cx="6" cy="1" r="0.7" fill="#A5B4FC" opacity="0.46" style="animation: pulse 4.5s ease-in-out infinite 4.9s" />
<circle cx="196" cy="205" r="0.7" fill="#38BDF8" opacity="0.54" style="animation: pulse 3.7s ease-in-out infinite 3.3s" />
<circle cx="214" cy="93" r="0.7" fill="#A5B4FC" opacity="0.21" style="animation: pulse 4.3s ease-in-out infinite 2.2s" />
<circle cx="118" cy="3" r="0.7" fill="#A5B4FC" opacity="0.46" style="animation: pulse 3.4s ease-in-out infinite 0.8s" />
<circle cx="53" cy="173" r="1.0" fill="#A5B4FC" opacity="0.55" style="animation: pulse 2.1s ease-in-out infinite 0.9s" />
<circle cx="155" cy="136" r="0.5" fill="#818CF8" opacity="0.30" style="animation: pulse 2.2s ease-in-out infinite 0.6s" />
<circle cx="236" cy="56" r="0.9" fill="#818CF8" opacity="0.26" style="animation: pulse 4.6s ease-in-out infinite 3.0s" />
<circle cx="189" cy="39" r="0.7" fill="#A5B4FC" opacity="0.30" style="animation: pulse 4.9s ease-in-out infinite 5.0s" />
<circle cx="54" cy="201" r="0.9" fill="#818CF8" opacity="0.31" style="animation: pulse 2.9s ease-in-out infinite 1.3s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

