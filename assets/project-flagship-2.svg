<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="54" cy="3" r="0.6" fill="#A5B4FC" opacity="0.36" style="animation: pulse 2.2s ease-in-out infinite 1.8s" />
<circle cx="178" cy="87" r="0.4" fill="#38BDF8" opacity="0.19" style="animation: pulse 3.2s ease-in-out infinite 2.1s" />
<circle cx="197" cy="118" r="1.0" fill="#F8FAFC" opacity="0.32" style="animation: pulse 3.8s ease-in-out infinite 3.7s" />
<circle cx="105" cy="78" r="0.5" fill="#38BDF8" opacity="0.35" style="animation: pulse 2.2s ease-in-out infinite 1.9s" />
<circle cx="89" cy="70" r="0.8" fill="#F8FAFC" opacity="0.19" style="animation: pulse 3.2s ease-in-out infinite 2.0s" />
<circle cx="166" cy="13" r="1.1" fill="#F8FAFC" opacity="0.39" style="animation: pulse 4.0s ease-in-out infinite 1.0s" />
<circle cx="242" cy="196" r="0.7" fill="#F8FAFC" opacity="0.83" style="animation: pulse 4.3s ease-in-out infinite 0.9s" />
<circle cx="223" cy="38" r="0.5" fill="#F8FAFC" opacity="0.73" style="animation: pulse 3.0s ease-in-out infinite 2.4s" />
<circle cx="41" cy="9" r="0.7" fill="#818CF8" opacity="0.40" style="animation: pulse 4.1s ease-in-out infinite 4.6s" />
<circle cx="74" cy="92" r="0.6" fill="#818CF8" opacity="0.40" style="animation: pulse 3.6s ease-in-out infinite 3.3s" />
<circle cx="274" cy="0" r="0.5" fill="#818CF8" opacity="0.56" style="animation: pulse 3.8s ease-in-out infinite 4.5s" />
<circle cx="52" cy="34" r="0.8" fill="#A5B4FC" opacity="0.37" style="animation: pulse 4.8s ease-in-out infinite 0.2s" />
<circle cx="60" cy="30" r="1.2" fill="#A5B4FC" opacity="0.85" style="animation: pulse 4.1s ease-in-out infinite 1.8s" />
<circle cx="149" cy="145" r="0.5" fill="#F8FAFC" opacity="0.39" style="animation: pulse 2.7s ease-in-out infinite 3.5s" />
<circle cx="175" cy="162" r="0.7" fill="#818CF8" opacity="0.37" style="animation: pulse 5.0s ease-in-out infinite 0.9s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
