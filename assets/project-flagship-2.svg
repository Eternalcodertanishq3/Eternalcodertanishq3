<circle cx="195" cy="111" r="0.8" fill="#A5B4FC" opacity="0.22" style="animation: pulse 2.3s ease-in-out infinite 1.7s" />
<circle cx="172" cy="157" r="1.0" fill="#38BDF8" opacity="0.80" style="animation: pulse 2.5s ease-in-out infinite 3.8s" />
<circle cx="3" cy="212" r="0.4" fill="#38BDF8" opacity="0.70" style="animation: pulse 3.8s ease-in-out infinite 2.7s" />
<circle cx="37" cy="152" r="0.5" fill="#38BDF8" opacity="0.33" style="animation: pulse 3.7s ease-in-out infinite 0.8s" />
<circle cx="270" cy="112" r="0.7" fill="#38BDF8" opacity="0.68" style="animation: pulse 2.9s ease-in-out infinite 4.3s" />
<circle cx="196" cy="142" r="1.1" fill="#818CF8" opacity="0.63" style="animation: pulse 3.1s ease-in-out infinite 1.4s" />
