<circle cx="252" cy="5" r="0.9" fill="#A5B4FC" opacity="0.46" style="animation: pulse 4.4s ease-in-out infinite 4.2s" />
<circle cx="187" cy="212" r="0.7" fill="#38BDF8" opacity="0.36" style="animation: pulse 3.9s ease-in-out infinite 2.3s" />
<circle cx="212" cy="106" r="0.7" fill="#818CF8" opacity="0.48" style="animation: pulse 4.9s ease-in-out infinite 1.1s" />
<circle cx="20" cy="160" r="0.5" fill="#818CF8" opacity="0.49" style="animation: pulse 2.1s ease-in-out infinite 2.8s" />
<circle cx="48" cy="216" r="1.0" fill="#38BDF8" opacity="0.80" style="animation: pulse 2.4s ease-in-out infinite 3.2s" />
<circle cx="138" cy="202" r="1.1" fill="#38BDF8" opacity="0.52" style="animation: pulse 4.6s ease-in-out infinite 0.9s" />
<circle cx="259" cy="71" r="1.1" fill="#F8FAFC" opacity="0.32" style="animation: pulse 2.9s ease-in-out infinite 3.6s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


