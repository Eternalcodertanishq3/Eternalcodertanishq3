<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="6" cy="131" r="1.2" fill="#A5B4FC" opacity="0.45" style="animation: pulse 4.2s ease-in-out infinite 0.1s" />
<circle cx="77" cy="98" r="0.5" fill="#F8FAFC" opacity="0.34" style="animation: pulse 4.1s ease-in-out infinite 1.3s" />
<circle cx="232" cy="101" r="1.0" fill="#818CF8" opacity="0.27" style="animation: pulse 2.6s ease-in-out infinite 0.3s" />
<circle cx="190" cy="32" r="0.8" fill="#F8FAFC" opacity="0.24" style="animation: pulse 2.7s ease-in-out infinite 0.9s" />
<circle cx="162" cy="123" r="0.4" fill="#38BDF8" opacity="0.64" style="animation: pulse 2.4s ease-in-out infinite 2.2s" />
<circle cx="109" cy="106" r="0.9" fill="#818CF8" opacity="0.39" style="animation: pulse 3.6s ease-in-out infinite 1.1s" />
<circle cx="111" cy="217" r="1.0" fill="#F8FAFC" opacity="0.83" style="animation: pulse 3.8s ease-in-out infinite 3.3s" />
<circle cx="43" cy="114" r="1.1" fill="#A5B4FC" opacity="0.71" style="animation: pulse 3.7s ease-in-out infinite 0.9s" />
<circle cx="230" cy="137" r="0.9" fill="#38BDF8" opacity="0.19" style="animation: pulse 3.2s ease-in-out infinite 3.7s" />
<circle cx="157" cy="134" r="0.9" fill="#38BDF8" opacity="0.52" style="animation: pulse 2.7s ease-in-out infinite 3.2s" />
<circle cx="53" cy="76" r="1.1" fill="#38BDF8" opacity="0.23" style="animation: pulse 4.3s ease-in-out infinite 2.2s" />
<circle cx="254" cy="68" r="0.9" fill="#A5B4FC" opacity="0.39" style="animation: pulse 2.5s ease-in-out infinite 0.5s" />
<circle cx="199" cy="161" r="0.6" fill="#F8FAFC" opacity="0.79" style="animation: pulse 2.4s ease-in-out infinite 3.3s" />
<circle cx="86" cy="157" r="0.7" fill="#F8FAFC" opacity="0.16" style="animation: pulse 3.8s ease-in-out infinite 3.5s" />
<circle cx="178" cy="75" r="0.8" fill="#F8FAFC" opacity="0.84" style="animation: pulse 3.9s ease-in-out infinite 1.6s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>