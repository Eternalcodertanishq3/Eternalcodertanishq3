<circle cx="194" cy="87" r="0.7" fill="#F8FAFC" opacity="0.28" style="animation: pulse 2.4s ease-in-out infinite 2.2s" />
<circle cx="7" cy="66" r="1.2" fill="#F8FAFC" opacity="0.28" style="animation: pulse 4.7s ease-in-out infinite 1.2s" />
<circle cx="260" cy="57" r="0.7" fill="#A5B4FC" opacity="0.55" style="animation: pulse 3.7s ease-in-out infinite 2.2s" />
<circle cx="154" cy="33" r="0.6" fill="#A5B4FC" opacity="0.62" style="animation: pulse 3.5s ease-in-out infinite 1.0s" />
<circle cx="129" cy="53" r="0.9" fill="#38BDF8" opacity="0.81" style="animation: pulse 4.1s ease-in-out infinite 0.1s" />
<circle cx="66" cy="90" r="0.4" fill="#F8FAFC" opacity="0.27" style="animation: pulse 2.9s ease-in-out infinite 0.0s" />
<circle cx="26" cy="129" r="0.6" fill="#818CF8" opacity="0.41" style="animation: pulse 2.7s ease-in-out infinite 2.5s" />
<circle cx="32" cy="81" r="0.4" fill="#38BDF8" opacity="0.69" style="animation: pulse 2.3s ease-in-out infinite 0.2s" />
<circle cx="109" cy="138" r="1.2" fill="#F8FAFC" opacity="0.61" style="animation: pulse 3.3s ease-in-out infinite 0.1s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


