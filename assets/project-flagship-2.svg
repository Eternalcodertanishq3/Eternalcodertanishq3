<circle cx="123" cy="118" r="0.9" fill="#38BDF8" opacity="0.31" style="animation: pulse 3.3s ease-in-out infinite 3.7s" />
<circle cx="196" cy="62" r="0.6" fill="#38BDF8" opacity="0.67" style="animation: pulse 2.4s ease-in-out infinite 3.3s" />
<circle cx="45" cy="7" r="0.5" fill="#818CF8" opacity="0.52" style="animation: pulse 4.5s ease-in-out infinite 3.1s" />
