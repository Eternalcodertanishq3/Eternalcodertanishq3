<circle cx="61" cy="57" r="0.5" fill="#F8FAFC" opacity="0.64" style="animation: pulse 2.7s ease-in-out infinite 0.4s" />
<circle cx="50" cy="9" r="1.2" fill="#F8FAFC" opacity="0.79" style="animation: pulse 3.5s ease-in-out infinite 2.9s" />
