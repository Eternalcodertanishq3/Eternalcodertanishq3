<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="100" cy="118" r="0.5" fill="#38BDF8" opacity="0.35" style="animation: pulse 4.0s ease-in-out infinite 2.2s" />
<circle cx="254" cy="54" r="0.5" fill="#F8FAFC" opacity="0.53" style="animation: pulse 2.1s ease-in-out infinite 4.5s" />
<circle cx="32" cy="9" r="0.5" fill="#F8FAFC" opacity="0.22" style="animation: pulse 4.8s ease-in-out infinite 4.9s" />
