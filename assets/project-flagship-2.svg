<circle cx="164" cy="111" r="0.9" fill="#F8FAFC" opacity="0.29" style="animation: pulse 4.6s ease-in-out infinite 1.5s" />
<circle cx="133" cy="64" r="0.9" fill="#818CF8" opacity="0.82" style="animation: pulse 2.4s ease-in-out infinite 4.3s" />
<circle cx="107" cy="21" r="0.9" fill="#F8FAFC" opacity="0.32" style="animation: pulse 4.5s ease-in-out infinite 2.8s" />
<circle cx="100" cy="86" r="1.0" fill="#F8FAFC" opacity="0.16" style="animation: pulse 2.3s ease-in-out infinite 1.1s" />
<circle cx="105" cy="85" r="1.0" fill="#818CF8" opacity="0.76" style="animation: pulse 4.5s ease-in-out infinite 1.2s" />
<circle cx="109" cy="7" r="0.4" fill="#818CF8" opacity="0.41" style="animation: pulse 4.4s ease-in-out infinite 1.3s" />
<circle cx="172" cy="137" r="1.0" fill="#F8FAFC" opacity="0.53" style="animation: pulse 2.9s ease-in-out infinite 2.5s" />
<circle cx="270" cy="160" r="1.1" fill="#F8FAFC" opacity="0.39" style="animation: pulse 2.5s ease-in-out infinite 2.9s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


