<circle cx="162" cy="194" r="1.0" fill="#38BDF8" opacity="0.57" style="animation: pulse 2.9s ease-in-out infinite 2.2s" />
<circle cx="136" cy="58" r="0.8" fill="#A5B4FC" opacity="0.22" style="animation: pulse 3.3s ease-in-out infinite 4.6s" />
<circle cx="235" cy="27" r="0.4" fill="#818CF8" opacity="0.25" style="animation: pulse 3.4s ease-in-out infinite 3.1s" />
<circle cx="132" cy="98" r="0.9" fill="#A5B4FC" opacity="0.20" style="animation: pulse 4.9s ease-in-out infinite 1.4s" />
<circle cx="189" cy="12" r="0.8" fill="#F8FAFC" opacity="0.79" style="animation: pulse 2.5s ease-in-out infinite 4.0s" />
<circle cx="150" cy="144" r="0.9" fill="#38BDF8" opacity="0.71" style="animation: pulse 3.2s ease-in-out infinite 0.6s" />
