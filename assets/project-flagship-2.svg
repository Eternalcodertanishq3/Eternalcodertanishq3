<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="252" cy="74" r="0.5" fill="#F8FAFC" opacity="0.43" style="animation: pulse 3.1s ease-in-out infinite 3.3s" />
<circle cx="149" cy="197" r="0.7" fill="#38BDF8" opacity="0.76" style="animation: pulse 3.2s ease-in-out infinite 1.1s" />
<circle cx="139" cy="128" r="1.2" fill="#F8FAFC" opacity="0.62" style="animation: pulse 4.8s ease-in-out infinite 1.2s" />
<circle cx="211" cy="49" r="0.6" fill="#F8FAFC" opacity="0.51" style="animation: pulse 4.8s ease-in-out infinite 4.2s" />
<circle cx="127" cy="160" r="1.1" fill="#F8FAFC" opacity="0.71" style="animation: pulse 2.1s ease-in-out infinite 3.3s" />
<circle cx="118" cy="97" r="1.0" fill="#F8FAFC" opacity="0.58" style="animation: pulse 2.7s ease-in-out infinite 0.9s" />
<circle cx="236" cy="76" r="0.5" fill="#F8FAFC" opacity="0.47" style="animation: pulse 2.7s ease-in-out infinite 4.5s" />
<circle cx="208" cy="86" r="0.8" fill="#A5B4FC" opacity="0.53" style="animation: pulse 3.5s ease-in-out infinite 1.0s" />
<circle cx="189" cy="189" r="1.0" fill="#A5B4FC" opacity="0.75" style="animation: pulse 3.7s ease-in-out infinite 2.0s" />
<circle cx="44" cy="3" r="1.1" fill="#A5B4FC" opacity="0.70" style="animation: pulse 2.3s ease-in-out infinite 3.7s" />
<circle cx="261" cy="163" r="0.7" fill="#818CF8" opacity="0.57" style="animation: pulse 3.2s ease-in-out infinite 1.7s" />
<circle cx="235" cy="44" r="0.6" fill="#A5B4FC" opacity="0.68" style="animation: pulse 4.9s ease-in-out infinite 2.0s" />
<circle cx="75" cy="133" r="1.2" fill="#818CF8" opacity="0.49" style="animation: pulse 3.1s ease-in-out infinite 4.1s" />
<circle cx="38" cy="203" r="0.7" fill="#A5B4FC" opacity="0.32" style="animation: pulse 3.4s ease-in-out infinite 3.7s" />
<circle cx="153" cy="140" r="0.4" fill="#818CF8" opacity="0.24" style="animation: pulse 2.4s ease-in-out infinite 4.4s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>