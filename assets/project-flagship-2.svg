<circle cx="144" cy="142" r="0.8" fill="#A5B4FC" opacity="0.85" style="animation: pulse 4.2s ease-in-out infinite 1.7s" />
<circle cx="256" cy="81" r="0.6" fill="#A5B4FC" opacity="0.83" style="animation: pulse 2.9s ease-in-out infinite 0.8s" />
