  <line x1="24" y1="52" x2="356" y2="52" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="12.5" class="font-sans">Deep learning framework built from scratch</text>
<text x="24" y="101" fill="#94A3B8" font-size="12.5" class="font-sans">in NumPy — gradients verified against</text>
