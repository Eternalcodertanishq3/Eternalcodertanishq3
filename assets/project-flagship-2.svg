<circle cx="248" cy="121" r="0.5" fill="#38BDF8" opacity="0.66" style="animation: pulse 4.4s ease-in-out infinite 0.1s" />
<circle cx="16" cy="219" r="0.9" fill="#F8FAFC" opacity="0.54" style="animation: pulse 3.0s ease-in-out infinite 3.9s" />
<circle cx="28" cy="117" r="0.5" fill="#818CF8" opacity="0.58" style="animation: pulse 3.1s ease-in-out infinite 4.8s" />
<circle cx="72" cy="83" r="0.6" fill="#F8FAFC" opacity="0.52" style="animation: pulse 4.6s ease-in-out infinite 3.7s" />
<circle cx="156" cy="170" r="1.0" fill="#A5B4FC" opacity="0.44" style="animation: pulse 4.2s ease-in-out infinite 3.7s" />
<circle cx="167" cy="45" r="0.8" fill="#F8FAFC" opacity="0.17" style="animation: pulse 2.5s ease-in-out infinite 0.1s" />
<circle cx="81" cy="177" r="0.7" fill="#38BDF8" opacity="0.73" style="animation: pulse 2.1s ease-in-out infinite 1.5s" />
<circle cx="179" cy="42" r="0.7" fill="#F8FAFC" opacity="0.15" style="animation: pulse 3.1s ease-in-out infinite 1.8s" />
<circle cx="88" cy="204" r="0.7" fill="#A5B4FC" opacity="0.50" style="animation: pulse 2.8s ease-in-out infinite 2.6s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>