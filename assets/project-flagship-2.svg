<circle cx="53" cy="92" r="0.7" fill="#38BDF8" opacity="0.43" style="animation: pulse 2.7s ease-in-out infinite 3.9s" />
<circle cx="47" cy="23" r="0.9" fill="#F8FAFC" opacity="0.28" style="animation: pulse 2.8s ease-in-out infinite 2.0s" />
<circle cx="158" cy="140" r="0.6" fill="#38BDF8" opacity="0.58" style="animation: pulse 2.6s ease-in-out infinite 3.6s" />
<circle cx="262" cy="109" r="0.5" fill="#818CF8" opacity="0.76" style="animation: pulse 3.6s ease-in-out infinite 4.2s" />
<circle cx="116" cy="138" r="0.4" fill="#F8FAFC" opacity="0.64" style="animation: pulse 2.1s ease-in-out infinite 0.1s" />
<circle cx="190" cy="130" r="0.6" fill="#818CF8" opacity="0.83" style="animation: pulse 2.2s ease-in-out infinite 4.8s" />
<circle cx="180" cy="128" r="1.1" fill="#818CF8" opacity="0.85" style="animation: pulse 4.9s ease-in-out infinite 1.0s" />
<circle cx="99" cy="37" r="0.5" fill="#A5B4FC" opacity="0.68" style="animation: pulse 2.0s ease-in-out infinite 1.4s" />
<circle cx="71" cy="98" r="0.4" fill="#A5B4FC" opacity="0.64" style="animation: pulse 2.2s ease-in-out infinite 3.4s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

