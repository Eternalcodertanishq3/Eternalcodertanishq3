<circle cx="144" cy="52" r="1.1" fill="#F8FAFC" opacity="0.23" style="animation: pulse 4.3s ease-in-out infinite 4.4s" />
<circle cx="74" cy="14" r="1.1" fill="#F8FAFC" opacity="0.79" style="animation: pulse 2.8s ease-in-out infinite 3.4s" />
<circle cx="241" cy="201" r="0.6" fill="#818CF8" opacity="0.68" style="animation: pulse 4.2s ease-in-out infinite 1.6s" />
<circle cx="263" cy="26" r="1.2" fill="#38BDF8" opacity="0.67" style="animation: pulse 3.5s ease-in-out infinite 2.0s" />
<circle cx="224" cy="102" r="0.6" fill="#F8FAFC" opacity="0.35" style="animation: pulse 4.6s ease-in-out infinite 1.5s" />
<circle cx="184" cy="121" r="1.0" fill="#38BDF8" opacity="0.52" style="animation: pulse 3.6s ease-in-out infinite 4.2s" />
<circle cx="158" cy="61" r="0.7" fill="#818CF8" opacity="0.75" style="animation: pulse 4.8s ease-in-out infinite 2.5s" />
<circle cx="19" cy="198" r="0.6" fill="#F8FAFC" opacity="0.33" style="animation: pulse 3.5s ease-in-out infinite 1.5s" />
<circle cx="54" cy="217" r="1.1" fill="#F8FAFC" opacity="0.75" style="animation: pulse 3.6s ease-in-out infinite 2.6s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


