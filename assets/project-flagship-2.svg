<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="155" cy="120" r="1.1" fill="#A5B4FC" opacity="0.24" style="animation: pulse 3.4s ease-in-out infinite 3.5s" />
<circle cx="244" cy="59" r="0.6" fill="#A5B4FC" opacity="0.38" style="animation: pulse 2.6s ease-in-out infinite 2.4s" />
<circle cx="210" cy="218" r="0.8" fill="#A5B4FC" opacity="0.62" style="animation: pulse 2.7s ease-in-out infinite 3.8s" />
<circle cx="188" cy="20" r="1.1" fill="#A5B4FC" opacity="0.70" style="animation: pulse 2.3s ease-in-out infinite 0.8s" />
<circle cx="125" cy="42" r="0.9" fill="#38BDF8" opacity="0.21" style="animation: pulse 2.3s ease-in-out infinite 4.2s" />
<circle cx="183" cy="144" r="0.7" fill="#38BDF8" opacity="0.45" style="animation: pulse 2.0s ease-in-out infinite 1.6s" />
<circle cx="64" cy="183" r="0.9" fill="#818CF8" opacity="0.48" style="animation: pulse 3.9s ease-in-out infinite 3.1s" />
<circle cx="62" cy="131" r="1.0" fill="#A5B4FC" opacity="0.77" style="animation: pulse 2.5s ease-in-out infinite 2.4s" />
<circle cx="149" cy="104" r="0.9" fill="#38BDF8" opacity="0.33" style="animation: pulse 2.6s ease-in-out infinite 4.7s" />
<circle cx="262" cy="198" r="0.4" fill="#818CF8" opacity="0.84" style="animation: pulse 2.4s ease-in-out infinite 0.9s" />
<circle cx="87" cy="130" r="1.1" fill="#F8FAFC" opacity="0.77" style="animation: pulse 2.6s ease-in-out infinite 0.3s" />
<circle cx="102" cy="214" r="0.8" fill="#A5B4FC" opacity="0.84" style="animation: pulse 4.8s ease-in-out infinite 4.7s" />
<circle cx="117" cy="84" r="0.6" fill="#38BDF8" opacity="0.32" style="animation: pulse 4.0s ease-in-out infinite 1.3s" />
<circle cx="147" cy="26" r="0.7" fill="#A5B4FC" opacity="0.45" style="animation: pulse 4.9s ease-in-out infinite 4.7s" />
<circle cx="141" cy="6" r="0.8" fill="#38BDF8" opacity="0.60" style="animation: pulse 4.4s ease-in-out infinite 1.1s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>