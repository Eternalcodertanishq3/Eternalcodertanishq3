<circle cx="62" cy="64" r="0.4" fill="#F8FAFC" opacity="0.20" style="animation: pulse 2.3s ease-in-out infinite 1.8s" />
<circle cx="136" cy="106" r="1.0" fill="#A5B4FC" opacity="0.22" style="animation: pulse 4.9s ease-in-out infinite 2.7s" />
<circle cx="214" cy="39" r="1.1" fill="#818CF8" opacity="0.76" style="animation: pulse 2.6s ease-in-out infinite 1.9s" />
<circle cx="128" cy="210" r="1.1" fill="#F8FAFC" opacity="0.82" style="animation: pulse 2.1s ease-in-out infinite 0.3s" />
<circle cx="174" cy="40" r="1.2" fill="#A5B4FC" opacity="0.27" style="animation: pulse 2.4s ease-in-out infinite 0.9s" />
<circle cx="101" cy="51" r="1.1" fill="#818CF8" opacity="0.82" style="animation: pulse 4.3s ease-in-out infinite 3.9s" />
<circle cx="231" cy="12" r="1.2" fill="#A5B4FC" opacity="0.34" style="animation: pulse 4.7s ease-in-out infinite 4.0s" />
<circle cx="274" cy="59" r="0.7" fill="#A5B4FC" opacity="0.19" style="animation: pulse 3.8s ease-in-out infinite 3.7s" />
<circle cx="33" cy="43" r="1.1" fill="#A5B4FC" opacity="0.19" style="animation: pulse 3.8s ease-in-out infinite 2.5s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

