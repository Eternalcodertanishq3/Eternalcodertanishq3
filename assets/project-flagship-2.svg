<circle cx="136" cy="36" r="0.5" fill="#A5B4FC" opacity="0.24" style="animation: pulse 2.2s ease-in-out infinite 0.2s" />
<circle cx="230" cy="107" r="0.5" fill="#38BDF8" opacity="0.51" style="animation: pulse 2.6s ease-in-out infinite 3.4s" />
<circle cx="141" cy="62" r="0.7" fill="#A5B4FC" opacity="0.28" style="animation: pulse 2.2s ease-in-out infinite 4.0s" />
<circle cx="34" cy="157" r="0.6" fill="#818CF8" opacity="0.22" style="animation: pulse 2.9s ease-in-out infinite 4.2s" />
<circle cx="99" cy="188" r="0.6" fill="#38BDF8" opacity="0.32" style="animation: pulse 4.2s ease-in-out infinite 3.3s" />
<circle cx="115" cy="39" r="0.6" fill="#A5B4FC" opacity="0.82" style="animation: pulse 2.2s ease-in-out infinite 2.7s" />
<circle cx="267" cy="54" r="1.2" fill="#38BDF8" opacity="0.61" style="animation: pulse 5.0s ease-in-out infinite 2.1s" />
<circle cx="214" cy="18" r="0.7" fill="#A5B4FC" opacity="0.18" style="animation: pulse 3.9s ease-in-out infinite 3.4s" />
<circle cx="99" cy="18" r="1.0" fill="#818CF8" opacity="0.54" style="animation: pulse 4.3s ease-in-out infinite 4.3s" />
<circle cx="75" cy="187" r="1.1" fill="#818CF8" opacity="0.27" style="animation: pulse 3.5s ease-in-out infinite 4.6s" />
<circle cx="178" cy="20" r="1.0" fill="#F8FAFC" opacity="0.26" style="animation: pulse 4.0s ease-in-out infinite 4.0s" />
<circle cx="76" cy="87" r="0.6" fill="#818CF8" opacity="0.85" style="animation: pulse 4.3s ease-in-out infinite 4.6s" />
<circle cx="235" cy="118" r="0.7" fill="#38BDF8" opacity="0.74" style="animation: pulse 4.2s ease-in-out infinite 3.1s" />
<circle cx="26" cy="137" r="0.9" fill="#F8FAFC" opacity="0.70" style="animation: pulse 4.8s ease-in-out infinite 3.1s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>