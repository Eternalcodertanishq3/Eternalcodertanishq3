<circle cx="181" cy="2" r="0.6" fill="#F8FAFC" opacity="0.33" style="animation: pulse 3.2s ease-in-out infinite 1.7s" />
<circle cx="232" cy="177" r="0.9" fill="#A5B4FC" opacity="0.50" style="animation: pulse 4.8s ease-in-out infinite 1.7s" />
<circle cx="142" cy="166" r="1.1" fill="#38BDF8" opacity="0.78" style="animation: pulse 4.9s ease-in-out infinite 2.8s" />
<circle cx="111" cy="123" r="1.1" fill="#818CF8" opacity="0.72" style="animation: pulse 4.7s ease-in-out infinite 1.8s" />
<circle cx="203" cy="152" r="1.2" fill="#F8FAFC" opacity="0.33" style="animation: pulse 3.2s ease-in-out infinite 4.0s" />
<circle cx="196" cy="25" r="0.8" fill="#F8FAFC" opacity="0.62" style="animation: pulse 2.7s ease-in-out infinite 1.8s" />
<circle cx="88" cy="49" r="0.5" fill="#38BDF8" opacity="0.51" style="animation: pulse 4.6s ease-in-out infinite 2.0s" />
<circle cx="95" cy="205" r="0.6" fill="#A5B4FC" opacity="0.68" style="animation: pulse 2.8s ease-in-out infinite 1.3s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


