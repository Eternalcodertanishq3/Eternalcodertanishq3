<circle cx="108" cy="197" r="0.5" fill="#F8FAFC" opacity="0.75" style="animation: pulse 5.0s ease-in-out infinite 4.8s" />
<circle cx="136" cy="56" r="0.7" fill="#38BDF8" opacity="0.31" style="animation: pulse 2.9s ease-in-out infinite 2.8s" />
<circle cx="40" cy="3" r="0.5" fill="#818CF8" opacity="0.74" style="animation: pulse 3.7s ease-in-out infinite 3.4s" />
<circle cx="251" cy="10" r="0.8" fill="#A5B4FC" opacity="0.70" style="animation: pulse 4.9s ease-in-out infinite 4.2s" />
<circle cx="188" cy="91" r="0.9" fill="#38BDF8" opacity="0.50" style="animation: pulse 4.3s ease-in-out infinite 0.7s" />
