<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="161" cy="24" r="0.7" fill="#A5B4FC" opacity="0.28" style="animation: pulse 4.7s ease-in-out infinite 3.8s" />
<circle cx="226" cy="23" r="0.7" fill="#818CF8" opacity="0.37" style="animation: pulse 3.6s ease-in-out infinite 4.7s" />
<circle cx="181" cy="113" r="1.0" fill="#38BDF8" opacity="0.15" style="animation: pulse 3.9s ease-in-out infinite 2.4s" />
<circle cx="166" cy="83" r="0.5" fill="#F8FAFC" opacity="0.33" style="animation: pulse 4.9s ease-in-out infinite 1.2s" />
<circle cx="11" cy="69" r="1.2" fill="#38BDF8" opacity="0.73" style="animation: pulse 2.6s ease-in-out infinite 2.0s" />
<circle cx="61" cy="86" r="0.7" fill="#818CF8" opacity="0.44" style="animation: pulse 3.4s ease-in-out infinite 4.9s" />
<circle cx="61" cy="79" r="0.4" fill="#38BDF8" opacity="0.77" style="animation: pulse 3.5s ease-in-out infinite 3.2s" />
<circle cx="109" cy="209" r="1.2" fill="#F8FAFC" opacity="0.62" style="animation: pulse 4.0s ease-in-out infinite 3.8s" />
<circle cx="7" cy="145" r="0.7" fill="#818CF8" opacity="0.77" style="animation: pulse 4.3s ease-in-out infinite 1.7s" />
<circle cx="104" cy="141" r="0.7" fill="#38BDF8" opacity="0.56" style="animation: pulse 4.9s ease-in-out infinite 4.5s" />
<circle cx="145" cy="56" r="0.8" fill="#38BDF8" opacity="0.56" style="animation: pulse 5.0s ease-in-out infinite 2.9s" />
<circle cx="74" cy="23" r="0.6" fill="#F8FAFC" opacity="0.68" style="animation: pulse 2.7s ease-in-out infinite 2.0s" />
<circle cx="82" cy="157" r="0.4" fill="#A5B4FC" opacity="0.65" style="animation: pulse 3.4s ease-in-out infinite 4.4s" />
<circle cx="28" cy="116" r="0.4" fill="#818CF8" opacity="0.52" style="animation: pulse 3.2s ease-in-out infinite 1.4s" />
<circle cx="72" cy="178" r="0.5" fill="#F8FAFC" opacity="0.62" style="animation: pulse 3.3s ease-in-out infinite 0.2s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>