<circle cx="116" cy="105" r="0.8" fill="#818CF8" opacity="0.38" style="animation: pulse 4.9s ease-in-out infinite 4.0s" />
<circle cx="56" cy="48" r="1.0" fill="#38BDF8" opacity="0.50" style="animation: pulse 2.3s ease-in-out infinite 0.1s" />
