<circle cx="203" cy="24" r="1.0" fill="#A5B4FC" opacity="0.65" style="animation: pulse 3.3s ease-in-out infinite 4.6s" />
<circle cx="33" cy="106" r="0.8" fill="#38BDF8" opacity="0.61" style="animation: pulse 3.5s ease-in-out infinite 4.3s" />
<circle cx="72" cy="16" r="0.9" fill="#F8FAFC" opacity="0.84" style="animation: pulse 2.8s ease-in-out infinite 2.9s" />
<circle cx="179" cy="41" r="1.2" fill="#38BDF8" opacity="0.63" style="animation: pulse 2.3s ease-in-out infinite 1.5s" />
<circle cx="236" cy="66" r="0.9" fill="#F8FAFC" opacity="0.40" style="animation: pulse 2.8s ease-in-out infinite 3.3s" />
<circle cx="213" cy="135" r="0.6" fill="#A5B4FC" opacity="0.17" style="animation: pulse 2.7s ease-in-out infinite 3.8s" />
