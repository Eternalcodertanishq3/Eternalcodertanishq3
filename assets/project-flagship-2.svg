<circle cx="43" cy="211" r="0.6" fill="#38BDF8" opacity="0.72" style="animation: pulse 2.9s ease-in-out infinite 1.8s" />
<circle cx="256" cy="165" r="0.6" fill="#38BDF8" opacity="0.64" style="animation: pulse 4.5s ease-in-out infinite 2.2s" />
<circle cx="116" cy="87" r="0.5" fill="#818CF8" opacity="0.59" style="animation: pulse 5.0s ease-in-out infinite 1.7s" />
<circle cx="116" cy="12" r="0.6" fill="#F8FAFC" opacity="0.40" style="animation: pulse 3.5s ease-in-out infinite 4.1s" />
<circle cx="229" cy="35" r="0.6" fill="#818CF8" opacity="0.50" style="animation: pulse 3.0s ease-in-out infinite 0.1s" />
<circle cx="85" cy="154" r="0.7" fill="#818CF8" opacity="0.60" style="animation: pulse 2.3s ease-in-out infinite 0.4s" />
<circle cx="76" cy="103" r="0.8" fill="#A5B4FC" opacity="0.58" style="animation: pulse 4.5s ease-in-out infinite 4.0s" />
<circle cx="153" cy="142" r="1.2" fill="#F8FAFC" opacity="0.37" style="animation: pulse 4.8s ease-in-out infinite 2.7s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


