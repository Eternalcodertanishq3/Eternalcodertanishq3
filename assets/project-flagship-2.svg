<circle cx="201" cy="171" r="0.6" fill="#F8FAFC" opacity="0.54" style="animation: pulse 2.6s ease-in-out infinite 0.7s" />
<circle cx="2" cy="7" r="0.8" fill="#A5B4FC" opacity="0.43" style="animation: pulse 2.8s ease-in-out infinite 3.3s" />
<circle cx="278" cy="43" r="1.0" fill="#A5B4FC" opacity="0.75" style="animation: pulse 2.9s ease-in-out infinite 2.6s" />
<circle cx="150" cy="14" r="0.8" fill="#A5B4FC" opacity="0.70" style="animation: pulse 4.1s ease-in-out infinite 4.9s" />
<circle cx="62" cy="168" r="0.5" fill="#F8FAFC" opacity="0.30" style="animation: pulse 3.8s ease-in-out infinite 3.3s" />
<circle cx="23" cy="132" r="1.0" fill="#38BDF8" opacity="0.50" style="animation: pulse 2.9s ease-in-out infinite 4.0s" />
<circle cx="191" cy="214" r="1.0" fill="#38BDF8" opacity="0.36" style="animation: pulse 4.3s ease-in-out infinite 4.6s" />
<circle cx="58" cy="132" r="1.2" fill="#818CF8" opacity="0.26" style="animation: pulse 3.7s ease-in-out infinite 5.0s" />
<circle cx="209" cy="202" r="0.9" fill="#A5B4FC" opacity="0.30" style="animation: pulse 2.2s ease-in-out infinite 0.1s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>