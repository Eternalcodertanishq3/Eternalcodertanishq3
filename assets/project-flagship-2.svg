<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="35" cy="147" r="1.1" fill="#818CF8" opacity="0.66" style="animation: pulse 3.4s ease-in-out infinite 4.2s" />
<circle cx="0" cy="199" r="0.4" fill="#38BDF8" opacity="0.28" style="animation: pulse 2.2s ease-in-out infinite 0.4s" />
<circle cx="81" cy="153" r="0.5" fill="#A5B4FC" opacity="0.62" style="animation: pulse 3.7s ease-in-out infinite 1.4s" />
<circle cx="104" cy="179" r="0.9" fill="#38BDF8" opacity="0.29" style="animation: pulse 4.6s ease-in-out infinite 3.9s" />
<circle cx="240" cy="200" r="0.7" fill="#A5B4FC" opacity="0.28" style="animation: pulse 3.6s ease-in-out infinite 0.3s" />
<circle cx="160" cy="33" r="0.7" fill="#818CF8" opacity="0.20" style="animation: pulse 4.9s ease-in-out infinite 5.0s" />
<circle cx="2" cy="140" r="0.7" fill="#F8FAFC" opacity="0.84" style="animation: pulse 4.6s ease-in-out infinite 1.9s" />
<circle cx="180" cy="173" r="0.5" fill="#818CF8" opacity="0.64" style="animation: pulse 2.1s ease-in-out infinite 3.7s" />
<circle cx="49" cy="163" r="0.7" fill="#818CF8" opacity="0.20" style="animation: pulse 4.5s ease-in-out infinite 3.3s" />
<circle cx="46" cy="65" r="0.9" fill="#A5B4FC" opacity="0.65" style="animation: pulse 4.3s ease-in-out infinite 0.5s" />
<circle cx="76" cy="27" r="0.6" fill="#818CF8" opacity="0.61" style="animation: pulse 3.5s ease-in-out infinite 3.9s" />
<circle cx="132" cy="76" r="1.0" fill="#38BDF8" opacity="0.76" style="animation: pulse 4.3s ease-in-out infinite 1.4s" />
<circle cx="212" cy="77" r="0.7" fill="#A5B4FC" opacity="0.25" style="animation: pulse 2.4s ease-in-out infinite 4.7s" />
<circle cx="142" cy="146" r="1.0" fill="#38BDF8" opacity="0.47" style="animation: pulse 4.7s ease-in-out infinite 4.6s" />
<circle cx="136" cy="109" r="1.0" fill="#F8FAFC" opacity="0.31" style="animation: pulse 4.8s ease-in-out infinite 3.1s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
