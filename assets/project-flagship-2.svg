<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="40" cy="203" r="0.6" fill="#A5B4FC" opacity="0.58" style="animation: pulse 4.5s ease-in-out infinite 2.4s" />
<circle cx="51" cy="96" r="0.4" fill="#F8FAFC" opacity="0.27" style="animation: pulse 3.1s ease-in-out infinite 2.3s" />
<circle cx="161" cy="28" r="1.0" fill="#818CF8" opacity="0.17" style="animation: pulse 5.0s ease-in-out infinite 3.0s" />
<circle cx="180" cy="219" r="1.1" fill="#818CF8" opacity="0.56" style="animation: pulse 4.8s ease-in-out infinite 0.4s" />
<circle cx="111" cy="13" r="0.6" fill="#818CF8" opacity="0.41" style="animation: pulse 4.3s ease-in-out infinite 0.7s" />
<circle cx="178" cy="205" r="0.8" fill="#F8FAFC" opacity="0.40" style="animation: pulse 4.1s ease-in-out infinite 4.2s" />
<circle cx="267" cy="27" r="0.4" fill="#38BDF8" opacity="0.35" style="animation: pulse 2.7s ease-in-out infinite 2.3s" />
<circle cx="140" cy="99" r="0.6" fill="#A5B4FC" opacity="0.48" style="animation: pulse 3.1s ease-in-out infinite 0.8s" />
<circle cx="205" cy="90" r="0.6" fill="#38BDF8" opacity="0.66" style="animation: pulse 4.9s ease-in-out infinite 3.6s" />
<circle cx="221" cy="201" r="0.7" fill="#38BDF8" opacity="0.70" style="animation: pulse 4.3s ease-in-out infinite 1.8s" />
<circle cx="70" cy="158" r="0.5" fill="#818CF8" opacity="0.62" style="animation: pulse 2.8s ease-in-out infinite 1.3s" />
<circle cx="48" cy="132" r="1.0" fill="#818CF8" opacity="0.24" style="animation: pulse 4.5s ease-in-out infinite 3.6s" />
<circle cx="72" cy="188" r="0.8" fill="#38BDF8" opacity="0.55" style="animation: pulse 2.6s ease-in-out infinite 2.6s" />
<circle cx="73" cy="93" r="0.7" fill="#A5B4FC" opacity="0.41" style="animation: pulse 2.3s ease-in-out infinite 3.0s" />
<circle cx="157" cy="98" r="1.0" fill="#818CF8" opacity="0.48" style="animation: pulse 2.6s ease-in-out infinite 1.0s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>