<circle cx="145" cy="117" r="1.1" fill="#38BDF8" opacity="0.29" style="animation: pulse 2.2s ease-in-out infinite 0.5s" />
<circle cx="227" cy="9" r="0.5" fill="#38BDF8" opacity="0.74" style="animation: pulse 4.6s ease-in-out infinite 1.8s" />
<circle cx="6" cy="133" r="0.8" fill="#818CF8" opacity="0.47" style="animation: pulse 2.3s ease-in-out infinite 0.4s" />
