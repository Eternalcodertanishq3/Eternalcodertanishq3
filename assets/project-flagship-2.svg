<circle cx="209" cy="172" r="0.5" fill="#38BDF8" opacity="0.69" style="animation: pulse 3.9s ease-in-out infinite 4.1s" />
<circle cx="18" cy="194" r="0.9" fill="#F8FAFC" opacity="0.53" style="animation: pulse 2.6s ease-in-out infinite 4.0s" />
<circle cx="261" cy="109" r="1.0" fill="#F8FAFC" opacity="0.81" style="animation: pulse 2.1s ease-in-out infinite 1.9s" />
<circle cx="194" cy="197" r="1.1" fill="#F8FAFC" opacity="0.41" style="animation: pulse 2.3s ease-in-out infinite 4.0s" />
<circle cx="250" cy="19" r="0.7" fill="#38BDF8" opacity="0.44" style="animation: pulse 3.7s ease-in-out infinite 0.5s" />
<circle cx="173" cy="196" r="0.8" fill="#A5B4FC" opacity="0.22" style="animation: pulse 3.0s ease-in-out infinite 1.5s" />
<circle cx="110" cy="161" r="0.5" fill="#F8FAFC" opacity="0.77" style="animation: pulse 3.9s ease-in-out infinite 0.1s" />
<circle cx="174" cy="153" r="0.7" fill="#F8FAFC" opacity="0.49" style="animation: pulse 4.2s ease-in-out infinite 0.4s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


