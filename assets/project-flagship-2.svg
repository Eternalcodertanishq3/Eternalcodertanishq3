<circle cx="207" cy="142" r="1.1" fill="#38BDF8" opacity="0.64" style="animation: pulse 2.7s ease-in-out infinite 1.7s" />
<circle cx="155" cy="156" r="0.7" fill="#818CF8" opacity="0.20" style="animation: pulse 2.9s ease-in-out infinite 2.5s" />
<circle cx="88" cy="9" r="0.5" fill="#818CF8" opacity="0.47" style="animation: pulse 3.8s ease-in-out infinite 4.9s" />
<circle cx="59" cy="175" r="1.1" fill="#38BDF8" opacity="0.55" style="animation: pulse 2.2s ease-in-out infinite 1.6s" />
<circle cx="109" cy="77" r="0.9" fill="#A5B4FC" opacity="0.80" style="animation: pulse 2.7s ease-in-out infinite 4.3s" />
<circle cx="277" cy="158" r="0.7" fill="#818CF8" opacity="0.28" style="animation: pulse 4.0s ease-in-out infinite 4.5s" />
<circle cx="256" cy="54" r="0.5" fill="#818CF8" opacity="0.58" style="animation: pulse 2.4s ease-in-out infinite 0.9s" />
<circle cx="153" cy="197" r="1.1" fill="#F8FAFC" opacity="0.55" style="animation: pulse 4.9s ease-in-out infinite 0.7s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


