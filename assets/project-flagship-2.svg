<circle cx="215" cy="96" r="0.6" fill="#818CF8" opacity="0.83" style="animation: pulse 3.9s ease-in-out infinite 3.3s" />
<circle cx="1" cy="77" r="1.0" fill="#F8FAFC" opacity="0.46" style="animation: pulse 3.4s ease-in-out infinite 3.7s" />
<circle cx="36" cy="195" r="1.0" fill="#818CF8" opacity="0.61" style="animation: pulse 2.4s ease-in-out infinite 1.3s" />
<circle cx="69" cy="47" r="0.7" fill="#F8FAFC" opacity="0.83" style="animation: pulse 2.6s ease-in-out infinite 1.6s" />
<circle cx="62" cy="65" r="0.4" fill="#A5B4FC" opacity="0.81" style="animation: pulse 3.2s ease-in-out infinite 5.0s" />
<circle cx="86" cy="161" r="0.7" fill="#A5B4FC" opacity="0.73" style="animation: pulse 5.0s ease-in-out infinite 2.0s" />
<circle cx="262" cy="179" r="1.1" fill="#38BDF8" opacity="0.71" style="animation: pulse 3.0s ease-in-out infinite 2.1s" />
<circle cx="248" cy="122" r="1.0" fill="#A5B4FC" opacity="0.28" style="animation: pulse 3.3s ease-in-out infinite 4.9s" />
<circle cx="90" cy="161" r="0.8" fill="#F8FAFC" opacity="0.68" style="animation: pulse 2.7s ease-in-out infinite 1.2s" />
<circle cx="57" cy="149" r="0.6" fill="#818CF8" opacity="0.71" style="animation: pulse 4.9s ease-in-out infinite 4.1s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

