<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="84" cy="33" r="0.9" fill="#38BDF8" opacity="0.58" style="animation: pulse 4.9s ease-in-out infinite 0.8s" />
<circle cx="194" cy="162" r="0.4" fill="#818CF8" opacity="0.66" style="animation: pulse 2.5s ease-in-out infinite 1.8s" />
<circle cx="210" cy="180" r="0.7" fill="#F8FAFC" opacity="0.64" style="animation: pulse 4.1s ease-in-out infinite 1.0s" />
<circle cx="71" cy="97" r="0.4" fill="#38BDF8" opacity="0.24" style="animation: pulse 2.2s ease-in-out infinite 1.8s" />
<circle cx="150" cy="118" r="0.6" fill="#38BDF8" opacity="0.67" style="animation: pulse 3.3s ease-in-out infinite 3.7s" />
