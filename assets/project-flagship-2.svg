<circle cx="97" cy="70" r="0.9" fill="#818CF8" opacity="0.17" style="animation: pulse 3.0s ease-in-out infinite 1.7s" />
<circle cx="36" cy="109" r="1.1" fill="#818CF8" opacity="0.45" style="animation: pulse 4.6s ease-in-out infinite 1.0s" />
<circle cx="176" cy="79" r="1.0" fill="#F8FAFC" opacity="0.56" style="animation: pulse 2.8s ease-in-out infinite 2.4s" />
