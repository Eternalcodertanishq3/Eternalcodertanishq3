<circle cx="9" cy="191" r="0.6" fill="#F8FAFC" opacity="0.53" style="animation: pulse 4.0s ease-in-out infinite 3.9s" />
<circle cx="232" cy="97" r="0.7" fill="#818CF8" opacity="0.21" style="animation: pulse 3.4s ease-in-out infinite 2.1s" />
<circle cx="153" cy="5" r="1.2" fill="#A5B4FC" opacity="0.57" style="animation: pulse 2.0s ease-in-out infinite 3.4s" />
<circle cx="265" cy="113" r="0.7" fill="#F8FAFC" opacity="0.69" style="animation: pulse 3.9s ease-in-out infinite 4.9s" />
<circle cx="279" cy="119" r="0.9" fill="#F8FAFC" opacity="0.60" style="animation: pulse 4.9s ease-in-out infinite 4.0s" />
<circle cx="7" cy="102" r="1.1" fill="#818CF8" opacity="0.74" style="animation: pulse 3.9s ease-in-out infinite 3.0s" />
<circle cx="108" cy="68" r="0.5" fill="#F8FAFC" opacity="0.31" style="animation: pulse 3.8s ease-in-out infinite 0.7s" />
<circle cx="203" cy="137" r="0.7" fill="#A5B4FC" opacity="0.31" style="animation: pulse 3.2s ease-in-out infinite 2.3s" />
<circle cx="52" cy="143" r="0.6" fill="#38BDF8" opacity="0.82" style="animation: pulse 2.9s ease-in-out infinite 5.0s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


