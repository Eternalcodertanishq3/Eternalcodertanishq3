<circle cx="37" cy="10" r="0.7" fill="#818CF8" opacity="0.49" style="animation: pulse 4.7s ease-in-out infinite 2.1s" />
<circle cx="186" cy="169" r="0.7" fill="#F8FAFC" opacity="0.35" style="animation: pulse 2.5s ease-in-out infinite 4.0s" />
