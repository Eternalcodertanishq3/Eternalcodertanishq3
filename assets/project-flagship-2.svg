<circle cx="50" cy="144" r="1.1" fill="#38BDF8" opacity="0.64" style="animation: pulse 4.2s ease-in-out infinite 2.9s" />
<circle cx="275" cy="27" r="0.8" fill="#818CF8" opacity="0.55" style="animation: pulse 3.0s ease-in-out infinite 2.6s" />
