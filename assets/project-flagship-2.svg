<circle cx="228" cy="86" r="1.0" fill="#818CF8" opacity="0.64" style="animation: pulse 4.7s ease-in-out infinite 3.4s" />
<circle cx="236" cy="87" r="0.7" fill="#38BDF8" opacity="0.72" style="animation: pulse 2.8s ease-in-out infinite 2.6s" />
