<circle cx="223" cy="189" r="0.6" fill="#818CF8" opacity="0.35" style="animation: pulse 5.0s ease-in-out infinite 4.2s" />
<circle cx="269" cy="110" r="0.8" fill="#818CF8" opacity="0.42" style="animation: pulse 2.3s ease-in-out infinite 3.2s" />
<circle cx="169" cy="49" r="0.6" fill="#38BDF8" opacity="0.31" style="animation: pulse 2.3s ease-in-out infinite 2.1s" />
