<circle cx="272" cy="150" r="0.7" fill="#F8FAFC" opacity="0.59" style="animation: pulse 3.6s ease-in-out infinite 4.9s" />
<circle cx="198" cy="77" r="0.8" fill="#F8FAFC" opacity="0.59" style="animation: pulse 4.6s ease-in-out infinite 0.1s" />
<circle cx="253" cy="2" r="1.0" fill="#818CF8" opacity="0.67" style="animation: pulse 3.4s ease-in-out infinite 0.7s" />
<circle cx="77" cy="52" r="0.4" fill="#38BDF8" opacity="0.42" style="animation: pulse 4.3s ease-in-out infinite 1.1s" />
<circle cx="194" cy="201" r="1.2" fill="#F8FAFC" opacity="0.16" style="animation: pulse 3.2s ease-in-out infinite 2.5s" />
<circle cx="227" cy="6" r="0.5" fill="#F8FAFC" opacity="0.31" style="animation: pulse 5.0s ease-in-out infinite 0.5s" />
<circle cx="106" cy="111" r="1.1" fill="#A5B4FC" opacity="0.77" style="animation: pulse 2.3s ease-in-out infinite 3.7s" />
<circle cx="187" cy="36" r="1.0" fill="#38BDF8" opacity="0.26" style="animation: pulse 3.6s ease-in-out infinite 1.4s" />
<circle cx="245" cy="78" r="0.5" fill="#818CF8" opacity="0.23" style="animation: pulse 3.7s ease-in-out infinite 0.5s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


