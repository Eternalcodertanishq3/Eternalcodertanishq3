<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="125" cy="138" r="0.6" fill="#A5B4FC" opacity="0.22" style="animation: pulse 2.7s ease-in-out infinite 4.5s" />
<circle cx="41" cy="199" r="0.5" fill="#818CF8" opacity="0.62" style="animation: pulse 4.7s ease-in-out infinite 3.3s" />
<circle cx="27" cy="19" r="1.1" fill="#38BDF8" opacity="0.43" style="animation: pulse 4.4s ease-in-out infinite 2.3s" />
<circle cx="45" cy="158" r="0.8" fill="#38BDF8" opacity="0.56" style="animation: pulse 2.4s ease-in-out infinite 3.4s" />
<circle cx="78" cy="89" r="1.1" fill="#A5B4FC" opacity="0.41" style="animation: pulse 2.6s ease-in-out infinite 2.3s" />
<circle cx="87" cy="5" r="0.6" fill="#38BDF8" opacity="0.73" style="animation: pulse 3.2s ease-in-out infinite 4.3s" />
<circle cx="243" cy="137" r="0.7" fill="#A5B4FC" opacity="0.75" style="animation: pulse 3.2s ease-in-out infinite 1.8s" />
<circle cx="139" cy="113" r="0.9" fill="#A5B4FC" opacity="0.46" style="animation: pulse 3.9s ease-in-out infinite 3.8s" />
<circle cx="247" cy="94" r="0.5" fill="#F8FAFC" opacity="0.24" style="animation: pulse 2.0s ease-in-out infinite 1.9s" />
<circle cx="77" cy="138" r="0.5" fill="#38BDF8" opacity="0.85" style="animation: pulse 3.8s ease-in-out infinite 0.5s" />
<circle cx="181" cy="65" r="1.1" fill="#818CF8" opacity="0.28" style="animation: pulse 3.0s ease-in-out infinite 0.1s" />
<circle cx="57" cy="156" r="0.5" fill="#38BDF8" opacity="0.84" style="animation: pulse 3.6s ease-in-out infinite 1.1s" />
<circle cx="40" cy="196" r="0.9" fill="#A5B4FC" opacity="0.39" style="animation: pulse 2.5s ease-in-out infinite 1.3s" />
<circle cx="12" cy="203" r="0.8" fill="#818CF8" opacity="0.23" style="animation: pulse 4.3s ease-in-out infinite 1.7s" />
<circle cx="106" cy="212" r="0.8" fill="#38BDF8" opacity="0.73" style="animation: pulse 2.9s ease-in-out infinite 0.3s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>