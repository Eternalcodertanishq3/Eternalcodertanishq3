<circle cx="261" cy="187" r="1.0" fill="#A5B4FC" opacity="0.62" style="animation: pulse 4.3s ease-in-out infinite 3.9s" />
<circle cx="63" cy="53" r="0.5" fill="#A5B4FC" opacity="0.80" style="animation: pulse 3.4s ease-in-out infinite 4.1s" />
<circle cx="251" cy="9" r="0.6" fill="#818CF8" opacity="0.67" style="animation: pulse 3.8s ease-in-out infinite 1.5s" />
<circle cx="255" cy="92" r="0.9" fill="#38BDF8" opacity="0.23" style="animation: pulse 4.9s ease-in-out infinite 0.4s" />
<circle cx="66" cy="127" r="1.1" fill="#818CF8" opacity="0.63" style="animation: pulse 2.1s ease-in-out infinite 4.2s" />
<circle cx="141" cy="123" r="1.2" fill="#A5B4FC" opacity="0.16" style="animation: pulse 4.5s ease-in-out infinite 0.2s" />
<circle cx="165" cy="195" r="0.5" fill="#38BDF8" opacity="0.37" style="animation: pulse 4.5s ease-in-out infinite 0.1s" />
<circle cx="217" cy="116" r="0.4" fill="#38BDF8" opacity="0.77" style="animation: pulse 2.5s ease-in-out infinite 0.0s" />
<circle cx="226" cy="89" r="0.7" fill="#818CF8" opacity="0.61" style="animation: pulse 3.8s ease-in-out infinite 3.8s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

