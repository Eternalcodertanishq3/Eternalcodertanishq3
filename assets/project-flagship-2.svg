<circle cx="80" cy="196" r="1.2" fill="#38BDF8" opacity="0.74" style="animation: pulse 3.7s ease-in-out infinite 4.5s" />
<circle cx="18" cy="196" r="1.0" fill="#F8FAFC" opacity="0.46" style="animation: pulse 2.4s ease-in-out infinite 5.0s" />
<circle cx="250" cy="30" r="0.6" fill="#F8FAFC" opacity="0.42" style="animation: pulse 2.2s ease-in-out infinite 0.5s" />
<circle cx="189" cy="147" r="0.8" fill="#818CF8" opacity="0.73" style="animation: pulse 4.3s ease-in-out infinite 4.7s" />
<circle cx="164" cy="153" r="0.7" fill="#818CF8" opacity="0.38" style="animation: pulse 4.9s ease-in-out infinite 0.8s" />
<circle cx="56" cy="130" r="0.7" fill="#F8FAFC" opacity="0.35" style="animation: pulse 3.8s ease-in-out infinite 3.2s" />
<circle cx="275" cy="141" r="0.7" fill="#818CF8" opacity="0.66" style="animation: pulse 3.5s ease-in-out infinite 4.7s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


