<circle cx="51" cy="31" r="1.0" fill="#F8FAFC" opacity="0.54" style="animation: pulse 2.4s ease-in-out infinite 2.1s" />
<circle cx="279" cy="34" r="0.8" fill="#A5B4FC" opacity="0.21" style="animation: pulse 2.8s ease-in-out infinite 1.9s" />
<circle cx="200" cy="33" r="0.9" fill="#38BDF8" opacity="0.45" style="animation: pulse 5.0s ease-in-out infinite 1.0s" />
