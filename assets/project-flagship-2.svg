<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="85" cy="55" r="0.8" fill="#A5B4FC" opacity="0.36" style="animation: pulse 2.3s ease-in-out infinite 2.2s" />
<circle cx="247" cy="213" r="0.8" fill="#818CF8" opacity="0.61" style="animation: pulse 3.2s ease-in-out infinite 2.2s" />
<circle cx="95" cy="44" r="0.8" fill="#818CF8" opacity="0.53" style="animation: pulse 2.5s ease-in-out infinite 3.1s" />
<circle cx="156" cy="158" r="0.6" fill="#F8FAFC" opacity="0.81" style="animation: pulse 4.1s ease-in-out infinite 4.5s" />
<circle cx="242" cy="104" r="0.9" fill="#A5B4FC" opacity="0.64" style="animation: pulse 3.7s ease-in-out infinite 0.2s" />
<circle cx="105" cy="110" r="0.9" fill="#F8FAFC" opacity="0.30" style="animation: pulse 3.1s ease-in-out infinite 2.1s" />
<circle cx="172" cy="199" r="1.0" fill="#818CF8" opacity="0.64" style="animation: pulse 3.2s ease-in-out infinite 0.4s" />
<circle cx="180" cy="92" r="0.9" fill="#F8FAFC" opacity="0.45" style="animation: pulse 4.9s ease-in-out infinite 3.6s" />
<circle cx="100" cy="89" r="0.5" fill="#818CF8" opacity="0.73" style="animation: pulse 4.0s ease-in-out infinite 1.7s" />
<circle cx="143" cy="143" r="1.1" fill="#F8FAFC" opacity="0.79" style="animation: pulse 4.6s ease-in-out infinite 2.7s" />
<circle cx="129" cy="140" r="0.6" fill="#A5B4FC" opacity="0.61" style="animation: pulse 3.4s ease-in-out infinite 2.4s" />
<circle cx="192" cy="140" r="0.4" fill="#818CF8" opacity="0.55" style="animation: pulse 4.2s ease-in-out infinite 4.1s" />
<circle cx="112" cy="45" r="1.0" fill="#818CF8" opacity="0.20" style="animation: pulse 2.9s ease-in-out infinite 1.5s" />
<circle cx="73" cy="205" r="0.9" fill="#818CF8" opacity="0.82" style="animation: pulse 3.8s ease-in-out infinite 3.6s" />
<circle cx="9" cy="197" r="0.9" fill="#818CF8" opacity="0.84" style="animation: pulse 3.3s ease-in-out infinite 2.1s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>