<circle cx="251" cy="2" r="0.4" fill="#38BDF8" opacity="0.27" style="animation: pulse 3.9s ease-in-out infinite 4.9s" />
<circle cx="56" cy="178" r="1.1" fill="#818CF8" opacity="0.46" style="animation: pulse 2.5s ease-in-out infinite 2.9s" />
