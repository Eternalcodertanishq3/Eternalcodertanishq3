<circle cx="66" cy="52" r="1.0" fill="#818CF8" opacity="0.77" style="animation: pulse 4.1s ease-in-out infinite 3.7s" />
<circle cx="73" cy="28" r="1.0" fill="#F8FAFC" opacity="0.20" style="animation: pulse 2.9s ease-in-out infinite 2.3s" />
<circle cx="168" cy="86" r="0.9" fill="#A5B4FC" opacity="0.41" style="animation: pulse 2.9s ease-in-out infinite 4.6s" />
<circle cx="239" cy="196" r="1.0" fill="#818CF8" opacity="0.55" style="animation: pulse 3.7s ease-in-out infinite 4.9s" />
<circle cx="168" cy="37" r="1.1" fill="#38BDF8" opacity="0.71" style="animation: pulse 4.5s ease-in-out infinite 2.1s" />
<circle cx="17" cy="131" r="1.1" fill="#A5B4FC" opacity="0.30" style="animation: pulse 4.9s ease-in-out infinite 2.8s" />
<circle cx="196" cy="208" r="0.9" fill="#38BDF8" opacity="0.72" style="animation: pulse 3.5s ease-in-out infinite 3.7s" />
<circle cx="147" cy="186" r="0.7" fill="#818CF8" opacity="0.69" style="animation: pulse 4.5s ease-in-out infinite 3.7s" />
<circle cx="68" cy="85" r="0.9" fill="#818CF8" opacity="0.82" style="animation: pulse 3.7s ease-in-out infinite 3.7s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


