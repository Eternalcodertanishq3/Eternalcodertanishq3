<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="186" cy="115" r="0.7" fill="#F8FAFC" opacity="0.20" style="animation: pulse 3.1s ease-in-out infinite 1.6s" />
<circle cx="277" cy="95" r="0.5" fill="#A5B4FC" opacity="0.46" style="animation: pulse 4.1s ease-in-out infinite 2.5s" />
<circle cx="14" cy="16" r="0.9" fill="#F8FAFC" opacity="0.24" style="animation: pulse 3.6s ease-in-out infinite 1.3s" />
<circle cx="90" cy="33" r="0.7" fill="#A5B4FC" opacity="0.42" style="animation: pulse 2.2s ease-in-out infinite 2.1s" />
<circle cx="123" cy="32" r="0.9" fill="#F8FAFC" opacity="0.79" style="animation: pulse 4.9s ease-in-out infinite 2.4s" />
<circle cx="183" cy="99" r="0.8" fill="#A5B4FC" opacity="0.38" style="animation: pulse 4.8s ease-in-out infinite 4.6s" />
<circle cx="122" cy="202" r="1.0" fill="#A5B4FC" opacity="0.34" style="animation: pulse 3.8s ease-in-out infinite 0.3s" />
<circle cx="18" cy="43" r="0.7" fill="#F8FAFC" opacity="0.36" style="animation: pulse 2.5s ease-in-out infinite 3.2s" />
<circle cx="229" cy="180" r="1.1" fill="#A5B4FC" opacity="0.74" style="animation: pulse 2.3s ease-in-out infinite 1.8s" />
<circle cx="189" cy="104" r="0.5" fill="#F8FAFC" opacity="0.17" style="animation: pulse 4.5s ease-in-out infinite 3.2s" />
<circle cx="114" cy="105" r="0.6" fill="#38BDF8" opacity="0.16" style="animation: pulse 2.1s ease-in-out infinite 1.4s" />
<circle cx="275" cy="167" r="0.8" fill="#38BDF8" opacity="0.48" style="animation: pulse 4.1s ease-in-out infinite 0.2s" />
<circle cx="168" cy="98" r="0.6" fill="#818CF8" opacity="0.80" style="animation: pulse 5.0s ease-in-out infinite 0.7s" />
<circle cx="66" cy="112" r="1.1" fill="#A5B4FC" opacity="0.51" style="animation: pulse 3.6s ease-in-out infinite 0.0s" />
<circle cx="232" cy="198" r="0.4" fill="#818CF8" opacity="0.21" style="animation: pulse 4.1s ease-in-out infinite 2.0s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
