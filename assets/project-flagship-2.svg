<circle cx="49" cy="154" r="1.0" fill="#A5B4FC" opacity="0.69" style="animation: pulse 4.0s ease-in-out infinite 2.3s" />
<circle cx="257" cy="149" r="0.5" fill="#38BDF8" opacity="0.47" style="animation: pulse 4.6s ease-in-out infinite 1.8s" />
