<circle cx="279" cy="99" r="0.4" fill="#818CF8" opacity="0.31" style="animation: pulse 4.3s ease-in-out infinite 3.3s" />
<circle cx="248" cy="6" r="1.1" fill="#A5B4FC" opacity="0.82" style="animation: pulse 4.6s ease-in-out infinite 2.7s" />
