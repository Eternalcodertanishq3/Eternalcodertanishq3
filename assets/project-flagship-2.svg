<circle cx="54" cy="151" r="0.7" fill="#818CF8" opacity="0.36" style="animation: pulse 2.1s ease-in-out infinite 0.3s" />
<circle cx="158" cy="204" r="0.5" fill="#F8FAFC" opacity="0.23" style="animation: pulse 2.3s ease-in-out infinite 1.4s" />
