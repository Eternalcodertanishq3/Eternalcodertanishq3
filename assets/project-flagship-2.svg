<circle cx="20" cy="125" r="0.6" fill="#A5B4FC" opacity="0.58" style="animation: pulse 3.3s ease-in-out infinite 4.5s" />
<circle cx="222" cy="103" r="0.8" fill="#818CF8" opacity="0.46" style="animation: pulse 2.2s ease-in-out infinite 0.9s" />
<circle cx="190" cy="105" r="0.6" fill="#38BDF8" opacity="0.41" style="animation: pulse 2.4s ease-in-out infinite 3.7s" />
<circle cx="89" cy="6" r="1.2" fill="#818CF8" opacity="0.56" style="animation: pulse 3.9s ease-in-out infinite 0.9s" />
<circle cx="75" cy="37" r="0.4" fill="#818CF8" opacity="0.85" style="animation: pulse 4.7s ease-in-out infinite 4.7s" />
<circle cx="120" cy="136" r="1.0" fill="#818CF8" opacity="0.42" style="animation: pulse 4.6s ease-in-out infinite 2.0s" />
<circle cx="94" cy="190" r="0.5" fill="#818CF8" opacity="0.36" style="animation: pulse 4.4s ease-in-out infinite 0.6s" />
<circle cx="231" cy="123" r="0.8" fill="#F8FAFC" opacity="0.35" style="animation: pulse 2.0s ease-in-out infinite 3.6s" />
<circle cx="211" cy="20" r="1.2" fill="#38BDF8" opacity="0.59" style="animation: pulse 3.9s ease-in-out infinite 2.5s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


