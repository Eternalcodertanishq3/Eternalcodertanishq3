<circle cx="218" cy="84" r="0.8" fill="#F8FAFC" opacity="0.37" style="animation: pulse 3.7s ease-in-out infinite 0.8s" />
<circle cx="100" cy="139" r="0.9" fill="#38BDF8" opacity="0.80" style="animation: pulse 2.9s ease-in-out infinite 3.4s" />
