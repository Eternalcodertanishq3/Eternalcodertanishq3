<circle cx="34" cy="106" r="0.6" fill="#F8FAFC" opacity="0.31" style="animation: pulse 4.6s ease-in-out infinite 2.7s" />
<circle cx="96" cy="175" r="0.7" fill="#A5B4FC" opacity="0.51" style="animation: pulse 3.3s ease-in-out infinite 1.9s" />
<circle cx="48" cy="15" r="0.4" fill="#A5B4FC" opacity="0.67" style="animation: pulse 2.9s ease-in-out infinite 1.2s" />
<circle cx="217" cy="138" r="1.1" fill="#A5B4FC" opacity="0.16" style="animation: pulse 3.4s ease-in-out infinite 3.5s" />
<circle cx="132" cy="71" r="0.5" fill="#38BDF8" opacity="0.58" style="animation: pulse 2.0s ease-in-out infinite 4.1s" />
<circle cx="137" cy="94" r="0.4" fill="#38BDF8" opacity="0.44" style="animation: pulse 2.2s ease-in-out infinite 3.9s" />
<circle cx="220" cy="26" r="1.1" fill="#F8FAFC" opacity="0.15" style="animation: pulse 4.2s ease-in-out infinite 1.1s" />
<circle cx="210" cy="66" r="1.2" fill="#818CF8" opacity="0.46" style="animation: pulse 3.4s ease-in-out infinite 1.0s" />
<circle cx="8" cy="176" r="0.9" fill="#A5B4FC" opacity="0.81" style="animation: pulse 3.8s ease-in-out infinite 1.5s" />
<circle cx="166" cy="213" r="0.9" fill="#A5B4FC" opacity="0.21" style="animation: pulse 2.6s ease-in-out infinite 3.5s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
