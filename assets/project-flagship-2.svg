<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="168" cy="87" r="1.0" fill="#38BDF8" opacity="0.79" style="animation: pulse 4.7s ease-in-out infinite 0.6s" />
<circle cx="270" cy="78" r="1.1" fill="#A5B4FC" opacity="0.52" style="animation: pulse 2.4s ease-in-out infinite 0.1s" />
<circle cx="51" cy="203" r="1.2" fill="#F8FAFC" opacity="0.44" style="animation: pulse 4.7s ease-in-out infinite 3.6s" />
<circle cx="252" cy="159" r="0.8" fill="#818CF8" opacity="0.72" style="animation: pulse 2.7s ease-in-out infinite 0.4s" />
<circle cx="207" cy="211" r="0.5" fill="#38BDF8" opacity="0.52" style="animation: pulse 3.6s ease-in-out infinite 0.4s" />
<circle cx="197" cy="101" r="0.5" fill="#A5B4FC" opacity="0.64" style="animation: pulse 3.5s ease-in-out infinite 1.9s" />
<circle cx="185" cy="17" r="1.1" fill="#F8FAFC" opacity="0.27" style="animation: pulse 4.1s ease-in-out infinite 0.0s" />
<circle cx="214" cy="154" r="0.7" fill="#F8FAFC" opacity="0.82" style="animation: pulse 2.0s ease-in-out infinite 3.0s" />
<circle cx="267" cy="51" r="0.5" fill="#38BDF8" opacity="0.26" style="animation: pulse 4.3s ease-in-out infinite 4.1s" />
<circle cx="137" cy="186" r="1.0" fill="#38BDF8" opacity="0.23" style="animation: pulse 3.9s ease-in-out infinite 4.5s" />
<circle cx="180" cy="76" r="1.2" fill="#A5B4FC" opacity="0.40" style="animation: pulse 2.5s ease-in-out infinite 2.3s" />
<circle cx="273" cy="127" r="0.4" fill="#38BDF8" opacity="0.74" style="animation: pulse 2.2s ease-in-out infinite 2.5s" />
<circle cx="86" cy="115" r="0.7" fill="#38BDF8" opacity="0.32" style="animation: pulse 2.1s ease-in-out infinite 1.0s" />
<circle cx="152" cy="175" r="1.0" fill="#818CF8" opacity="0.73" style="animation: pulse 2.1s ease-in-out infinite 0.5s" />
<circle cx="112" cy="35" r="0.7" fill="#818CF8" opacity="0.74" style="animation: pulse 4.0s ease-in-out infinite 2.0s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>