<circle cx="17" cy="101" r="1.1" fill="#F8FAFC" opacity="0.54" style="animation: pulse 4.6s ease-in-out infinite 1.7s" />
<circle cx="234" cy="123" r="0.8" fill="#F8FAFC" opacity="0.78" style="animation: pulse 2.6s ease-in-out infinite 4.0s" />
<circle cx="3" cy="4" r="0.6" fill="#A5B4FC" opacity="0.33" style="animation: pulse 3.7s ease-in-out infinite 0.0s" />
<circle cx="149" cy="52" r="0.6" fill="#818CF8" opacity="0.59" style="animation: pulse 4.2s ease-in-out infinite 5.0s" />
<circle cx="177" cy="68" r="0.9" fill="#A5B4FC" opacity="0.70" style="animation: pulse 3.3s ease-in-out infinite 2.9s" />
<circle cx="170" cy="200" r="0.5" fill="#38BDF8" opacity="0.45" style="animation: pulse 4.2s ease-in-out infinite 3.2s" />
<circle cx="239" cy="88" r="0.9" fill="#818CF8" opacity="0.64" style="animation: pulse 4.8s ease-in-out infinite 4.3s" />
<circle cx="210" cy="133" r="0.7" fill="#F8FAFC" opacity="0.69" style="animation: pulse 2.2s ease-in-out infinite 1.7s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


