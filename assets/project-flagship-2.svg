<circle cx="211" cy="27" r="0.6" fill="#A5B4FC" opacity="0.61" style="animation: pulse 3.0s ease-in-out infinite 0.4s" />
<circle cx="213" cy="56" r="0.6" fill="#38BDF8" opacity="0.46" style="animation: pulse 2.1s ease-in-out infinite 1.7s" />
