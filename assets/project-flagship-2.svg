<circle cx="73" cy="143" r="1.0" fill="#818CF8" opacity="0.45" style="animation: pulse 3.7s ease-in-out infinite 0.3s" />
<circle cx="11" cy="36" r="1.2" fill="#818CF8" opacity="0.69" style="animation: pulse 2.8s ease-in-out infinite 0.7s" />
<circle cx="17" cy="51" r="0.6" fill="#F8FAFC" opacity="0.22" style="animation: pulse 4.1s ease-in-out infinite 0.2s" />
