<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="212" cy="200" r="0.7" fill="#F8FAFC" opacity="0.42" style="animation: pulse 3.8s ease-in-out infinite 0.9s" />
<circle cx="188" cy="133" r="0.7" fill="#38BDF8" opacity="0.18" style="animation: pulse 5.0s ease-in-out infinite 1.1s" />
<circle cx="139" cy="202" r="0.9" fill="#F8FAFC" opacity="0.25" style="animation: pulse 4.4s ease-in-out infinite 1.4s" />
<circle cx="220" cy="165" r="0.6" fill="#F8FAFC" opacity="0.59" style="animation: pulse 3.9s ease-in-out infinite 1.4s" />
<circle cx="140" cy="217" r="1.2" fill="#A5B4FC" opacity="0.53" style="animation: pulse 2.8s ease-in-out infinite 2.7s" />
<circle cx="207" cy="140" r="1.1" fill="#818CF8" opacity="0.38" style="animation: pulse 4.7s ease-in-out infinite 0.8s" />
<circle cx="155" cy="177" r="1.2" fill="#38BDF8" opacity="0.49" style="animation: pulse 2.8s ease-in-out infinite 0.9s" />
<circle cx="113" cy="92" r="0.8" fill="#F8FAFC" opacity="0.56" style="animation: pulse 4.1s ease-in-out infinite 2.2s" />
<circle cx="43" cy="29" r="1.0" fill="#38BDF8" opacity="0.18" style="animation: pulse 2.3s ease-in-out infinite 3.4s" />
<circle cx="147" cy="7" r="0.7" fill="#818CF8" opacity="0.55" style="animation: pulse 2.6s ease-in-out infinite 2.4s" />
<circle cx="169" cy="68" r="0.9" fill="#F8FAFC" opacity="0.49" style="animation: pulse 3.1s ease-in-out infinite 3.9s" />
<circle cx="260" cy="1" r="0.6" fill="#818CF8" opacity="0.46" style="animation: pulse 2.9s ease-in-out infinite 0.3s" />
<circle cx="14" cy="128" r="1.0" fill="#38BDF8" opacity="0.18" style="animation: pulse 3.5s ease-in-out infinite 2.0s" />
<circle cx="80" cy="157" r="1.2" fill="#818CF8" opacity="0.52" style="animation: pulse 5.0s ease-in-out infinite 4.3s" />
<circle cx="40" cy="20" r="0.7" fill="#F8FAFC" opacity="0.55" style="animation: pulse 2.9s ease-in-out infinite 0.2s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>