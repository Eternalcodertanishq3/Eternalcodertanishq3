<circle cx="122" cy="192" r="0.6" fill="#818CF8" opacity="0.48" style="animation: pulse 4.3s ease-in-out infinite 2.2s" />
<circle cx="149" cy="207" r="0.7" fill="#818CF8" opacity="0.70" style="animation: pulse 2.8s ease-in-out infinite 1.7s" />
<circle cx="11" cy="57" r="0.7" fill="#F8FAFC" opacity="0.82" style="animation: pulse 2.4s ease-in-out infinite 0.1s" />
<circle cx="213" cy="33" r="1.0" fill="#A5B4FC" opacity="0.59" style="animation: pulse 4.3s ease-in-out infinite 3.3s" />
<circle cx="42" cy="135" r="0.5" fill="#F8FAFC" opacity="0.39" style="animation: pulse 2.4s ease-in-out infinite 4.0s" />
<circle cx="20" cy="65" r="0.8" fill="#818CF8" opacity="0.71" style="animation: pulse 2.2s ease-in-out infinite 3.9s" />
<circle cx="71" cy="128" r="1.0" fill="#818CF8" opacity="0.60" style="animation: pulse 4.3s ease-in-out infinite 2.9s" />
<circle cx="273" cy="47" r="0.7" fill="#F8FAFC" opacity="0.19" style="animation: pulse 2.3s ease-in-out infinite 3.3s" />
<circle cx="69" cy="59" r="0.6" fill="#38BDF8" opacity="0.32" style="animation: pulse 3.7s ease-in-out infinite 3.9s" />
<circle cx="57" cy="119" r="0.4" fill="#818CF8" opacity="0.17" style="animation: pulse 3.1s ease-in-out infinite 3.5s" />
<circle cx="229" cy="176" r="0.7" fill="#818CF8" opacity="0.35" style="animation: pulse 3.2s ease-in-out infinite 0.9s" />
<circle cx="42" cy="164" r="0.9" fill="#F8FAFC" opacity="0.30" style="animation: pulse 2.5s ease-in-out infinite 2.0s" />
<circle cx="245" cy="168" r="0.4" fill="#38BDF8" opacity="0.29" style="animation: pulse 2.3s ease-in-out infinite 2.0s" />
<circle cx="264" cy="74" r="1.1" fill="#A5B4FC" opacity="0.60" style="animation: pulse 2.5s ease-in-out infinite 2.2s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
