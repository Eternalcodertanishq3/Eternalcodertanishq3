<circle cx="53" cy="5" r="0.5" fill="#F8FAFC" opacity="0.40" style="animation: pulse 2.8s ease-in-out infinite 3.8s" />
<circle cx="144" cy="25" r="1.1" fill="#38BDF8" opacity="0.48" style="animation: pulse 4.7s ease-in-out infinite 4.3s" />
<circle cx="58" cy="218" r="0.5" fill="#F8FAFC" opacity="0.41" style="animation: pulse 3.4s ease-in-out infinite 4.0s" />
<circle cx="159" cy="118" r="0.8" fill="#818CF8" opacity="0.30" style="animation: pulse 4.4s ease-in-out infinite 1.6s" />
