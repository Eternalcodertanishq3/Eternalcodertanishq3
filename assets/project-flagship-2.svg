<circle cx="237" cy="86" r="1.2" fill="#A5B4FC" opacity="0.49" style="animation: pulse 2.1s ease-in-out infinite 4.8s" />
<circle cx="95" cy="42" r="0.5" fill="#38BDF8" opacity="0.42" style="animation: pulse 4.1s ease-in-out infinite 3.1s" />
<circle cx="4" cy="98" r="1.1" fill="#A5B4FC" opacity="0.30" style="animation: pulse 4.8s ease-in-out infinite 2.7s" />
<circle cx="184" cy="217" r="1.0" fill="#F8FAFC" opacity="0.40" style="animation: pulse 3.0s ease-in-out infinite 3.4s" />
