<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="200" cy="108" r="1.0" fill="#38BDF8" opacity="0.74" style="animation: pulse 2.2s ease-in-out infinite 4.8s" />
<circle cx="40" cy="153" r="0.4" fill="#38BDF8" opacity="0.76" style="animation: pulse 3.4s ease-in-out infinite 2.9s" />
<circle cx="16" cy="115" r="0.6" fill="#A5B4FC" opacity="0.68" style="animation: pulse 4.0s ease-in-out infinite 2.1s" />
<circle cx="279" cy="199" r="1.0" fill="#A5B4FC" opacity="0.55" style="animation: pulse 2.3s ease-in-out infinite 0.1s" />
<circle cx="34" cy="182" r="1.0" fill="#38BDF8" opacity="0.49" style="animation: pulse 4.4s ease-in-out infinite 4.5s" />
<circle cx="207" cy="180" r="0.5" fill="#F8FAFC" opacity="0.54" style="animation: pulse 3.2s ease-in-out infinite 2.9s" />
<circle cx="57" cy="157" r="0.8" fill="#38BDF8" opacity="0.17" style="animation: pulse 4.2s ease-in-out infinite 1.5s" />
<circle cx="90" cy="92" r="1.1" fill="#38BDF8" opacity="0.40" style="animation: pulse 4.0s ease-in-out infinite 1.0s" />
<circle cx="147" cy="79" r="0.8" fill="#F8FAFC" opacity="0.53" style="animation: pulse 3.7s ease-in-out infinite 4.9s" />
<circle cx="31" cy="217" r="0.8" fill="#38BDF8" opacity="0.31" style="animation: pulse 2.9s ease-in-out infinite 2.2s" />
<circle cx="56" cy="29" r="1.0" fill="#818CF8" opacity="0.53" style="animation: pulse 2.3s ease-in-out infinite 3.2s" />
<circle cx="26" cy="75" r="0.9" fill="#F8FAFC" opacity="0.83" style="animation: pulse 2.2s ease-in-out infinite 2.1s" />
<circle cx="231" cy="125" r="0.7" fill="#F8FAFC" opacity="0.55" style="animation: pulse 3.9s ease-in-out infinite 0.8s" />
<circle cx="23" cy="52" r="0.9" fill="#818CF8" opacity="0.64" style="animation: pulse 2.2s ease-in-out infinite 4.3s" />
<circle cx="36" cy="28" r="1.1" fill="#818CF8" opacity="0.80" style="animation: pulse 3.1s ease-in-out infinite 0.7s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>