<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="33" cy="36" r="1.0" fill="#A5B4FC" opacity="0.40" style="animation: pulse 3.1s ease-in-out infinite 0.2s" />
<circle cx="13" cy="108" r="0.7" fill="#F8FAFC" opacity="0.43" style="animation: pulse 3.2s ease-in-out infinite 1.1s" />
<circle cx="120" cy="5" r="0.6" fill="#A5B4FC" opacity="0.61" style="animation: pulse 3.1s ease-in-out infinite 0.6s" />
<circle cx="245" cy="140" r="1.1" fill="#38BDF8" opacity="0.70" style="animation: pulse 3.8s ease-in-out infinite 1.9s" />
<circle cx="230" cy="112" r="0.5" fill="#818CF8" opacity="0.58" style="animation: pulse 3.5s ease-in-out infinite 2.8s" />
<circle cx="259" cy="90" r="0.6" fill="#F8FAFC" opacity="0.31" style="animation: pulse 2.4s ease-in-out infinite 3.3s" />
<circle cx="61" cy="171" r="0.9" fill="#F8FAFC" opacity="0.66" style="animation: pulse 2.4s ease-in-out infinite 4.4s" />
<circle cx="99" cy="180" r="0.9" fill="#F8FAFC" opacity="0.79" style="animation: pulse 4.9s ease-in-out infinite 1.2s" />
<circle cx="272" cy="115" r="1.0" fill="#38BDF8" opacity="0.24" style="animation: pulse 3.9s ease-in-out infinite 3.6s" />
<circle cx="67" cy="187" r="0.8" fill="#38BDF8" opacity="0.58" style="animation: pulse 2.9s ease-in-out infinite 2.9s" />
<circle cx="206" cy="132" r="1.1" fill="#38BDF8" opacity="0.42" style="animation: pulse 3.1s ease-in-out infinite 2.6s" />
<circle cx="167" cy="4" r="0.6" fill="#38BDF8" opacity="0.24" style="animation: pulse 3.1s ease-in-out infinite 2.4s" />
<circle cx="234" cy="190" r="1.2" fill="#818CF8" opacity="0.84" style="animation: pulse 3.4s ease-in-out infinite 3.5s" />
<circle cx="134" cy="210" r="0.8" fill="#F8FAFC" opacity="0.43" style="animation: pulse 2.4s ease-in-out infinite 0.7s" />
<circle cx="213" cy="211" r="1.0" fill="#818CF8" opacity="0.18" style="animation: pulse 4.6s ease-in-out infinite 2.9s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>