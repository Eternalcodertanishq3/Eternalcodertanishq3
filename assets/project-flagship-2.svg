<circle cx="58" cy="80" r="1.1" fill="#F8FAFC" opacity="0.79" style="animation: pulse 2.3s ease-in-out infinite 0.8s" />
<circle cx="218" cy="51" r="0.6" fill="#38BDF8" opacity="0.16" style="animation: pulse 2.2s ease-in-out infinite 0.5s" />
<circle cx="68" cy="157" r="0.6" fill="#818CF8" opacity="0.66" style="animation: pulse 4.9s ease-in-out infinite 2.6s" />
<circle cx="114" cy="1" r="1.1" fill="#A5B4FC" opacity="0.74" style="animation: pulse 3.7s ease-in-out infinite 1.8s" />
<circle cx="110" cy="30" r="1.2" fill="#818CF8" opacity="0.19" style="animation: pulse 4.8s ease-in-out infinite 3.0s" />
<circle cx="15" cy="32" r="0.8" fill="#F8FAFC" opacity="0.66" style="animation: pulse 3.0s ease-in-out infinite 2.8s" />
<circle cx="149" cy="151" r="0.8" fill="#38BDF8" opacity="0.44" style="animation: pulse 2.1s ease-in-out infinite 0.1s" />
<circle cx="10" cy="194" r="1.1" fill="#818CF8" opacity="0.73" style="animation: pulse 4.9s ease-in-out infinite 3.2s" />
<circle cx="131" cy="219" r="0.6" fill="#818CF8" opacity="0.82" style="animation: pulse 2.9s ease-in-out infinite 4.8s" />
<circle cx="151" cy="66" r="1.1" fill="#38BDF8" opacity="0.27" style="animation: pulse 3.6s ease-in-out infinite 1.4s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


