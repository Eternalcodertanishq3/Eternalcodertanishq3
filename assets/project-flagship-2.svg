<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="25" cy="64" r="1.2" fill="#F8FAFC" opacity="0.77" style="animation: pulse 3.1s ease-in-out infinite 0.9s" />
<circle cx="53" cy="124" r="0.4" fill="#818CF8" opacity="0.72" style="animation: pulse 4.1s ease-in-out infinite 1.6s" />
<circle cx="28" cy="63" r="0.8" fill="#818CF8" opacity="0.76" style="animation: pulse 4.2s ease-in-out infinite 3.5s" />
<circle cx="32" cy="60" r="1.1" fill="#A5B4FC" opacity="0.21" style="animation: pulse 4.5s ease-in-out infinite 0.6s" />
<circle cx="267" cy="64" r="0.8" fill="#F8FAFC" opacity="0.63" style="animation: pulse 2.4s ease-in-out infinite 0.2s" />
<circle cx="131" cy="38" r="0.5" fill="#38BDF8" opacity="0.60" style="animation: pulse 2.6s ease-in-out infinite 1.3s" />
<circle cx="24" cy="177" r="1.1" fill="#818CF8" opacity="0.55" style="animation: pulse 3.2s ease-in-out infinite 0.8s" />
<circle cx="88" cy="123" r="0.6" fill="#818CF8" opacity="0.25" style="animation: pulse 2.1s ease-in-out infinite 0.5s" />
<circle cx="251" cy="43" r="1.0" fill="#38BDF8" opacity="0.58" style="animation: pulse 4.8s ease-in-out infinite 2.4s" />
<circle cx="82" cy="51" r="1.2" fill="#F8FAFC" opacity="0.81" style="animation: pulse 2.3s ease-in-out infinite 0.5s" />
<circle cx="241" cy="135" r="0.6" fill="#38BDF8" opacity="0.58" style="animation: pulse 3.0s ease-in-out infinite 4.7s" />
<circle cx="113" cy="93" r="0.9" fill="#A5B4FC" opacity="0.78" style="animation: pulse 4.0s ease-in-out infinite 0.5s" />
<circle cx="140" cy="99" r="0.6" fill="#818CF8" opacity="0.76" style="animation: pulse 4.9s ease-in-out infinite 4.0s" />
<circle cx="87" cy="215" r="0.5" fill="#38BDF8" opacity="0.50" style="animation: pulse 2.1s ease-in-out infinite 4.6s" />
<circle cx="216" cy="160" r="0.5" fill="#A5B4FC" opacity="0.82" style="animation: pulse 4.4s ease-in-out infinite 2.5s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>