<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="125" cy="21" r="1.1" fill="#F8FAFC" opacity="0.23" style="animation: pulse 2.7s ease-in-out infinite 3.7s" />
<circle cx="134" cy="7" r="0.7" fill="#F8FAFC" opacity="0.16" style="animation: pulse 3.1s ease-in-out infinite 3.7s" />
<circle cx="135" cy="8" r="0.5" fill="#A5B4FC" opacity="0.16" style="animation: pulse 4.2s ease-in-out infinite 0.8s" />
<circle cx="78" cy="176" r="0.4" fill="#818CF8" opacity="0.21" style="animation: pulse 2.5s ease-in-out infinite 4.7s" />
<circle cx="66" cy="211" r="0.9" fill="#F8FAFC" opacity="0.83" style="animation: pulse 2.9s ease-in-out infinite 3.5s" />
<circle cx="207" cy="148" r="1.0" fill="#A5B4FC" opacity="0.60" style="animation: pulse 2.8s ease-in-out infinite 0.1s" />
<circle cx="162" cy="141" r="0.5" fill="#A5B4FC" opacity="0.74" style="animation: pulse 3.6s ease-in-out infinite 3.0s" />
<circle cx="47" cy="112" r="0.4" fill="#38BDF8" opacity="0.20" style="animation: pulse 2.4s ease-in-out infinite 4.0s" />
<circle cx="187" cy="89" r="1.1" fill="#A5B4FC" opacity="0.66" style="animation: pulse 2.3s ease-in-out infinite 0.2s" />
<circle cx="144" cy="78" r="0.9" fill="#818CF8" opacity="0.59" style="animation: pulse 4.1s ease-in-out infinite 2.3s" />
<circle cx="273" cy="117" r="0.8" fill="#818CF8" opacity="0.61" style="animation: pulse 2.1s ease-in-out infinite 3.9s" />
<circle cx="209" cy="98" r="1.1" fill="#818CF8" opacity="0.61" style="animation: pulse 3.8s ease-in-out infinite 2.7s" />
<circle cx="106" cy="17" r="1.2" fill="#A5B4FC" opacity="0.43" style="animation: pulse 4.9s ease-in-out infinite 3.8s" />
<circle cx="91" cy="52" r="1.0" fill="#818CF8" opacity="0.45" style="animation: pulse 4.3s ease-in-out infinite 2.4s" />
<circle cx="272" cy="128" r="0.8" fill="#F8FAFC" opacity="0.46" style="animation: pulse 3.6s ease-in-out infinite 4.8s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>