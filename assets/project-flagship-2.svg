<circle cx="101" cy="2" r="0.8" fill="#818CF8" opacity="0.63" style="animation: pulse 3.7s ease-in-out infinite 2.5s" />
<circle cx="61" cy="217" r="1.1" fill="#F8FAFC" opacity="0.53" style="animation: pulse 2.9s ease-in-out infinite 3.5s" />
<circle cx="191" cy="4" r="1.2" fill="#38BDF8" opacity="0.38" style="animation: pulse 3.7s ease-in-out infinite 3.1s" />
<circle cx="76" cy="49" r="0.8" fill="#A5B4FC" opacity="0.57" style="animation: pulse 3.2s ease-in-out infinite 0.8s" />
<circle cx="186" cy="75" r="0.9" fill="#F8FAFC" opacity="0.71" style="animation: pulse 3.9s ease-in-out infinite 1.5s" />
<circle cx="151" cy="201" r="0.5" fill="#A5B4FC" opacity="0.66" style="animation: pulse 2.7s ease-in-out infinite 3.9s" />
<circle cx="115" cy="27" r="1.0" fill="#A5B4FC" opacity="0.60" style="animation: pulse 3.5s ease-in-out infinite 2.0s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


