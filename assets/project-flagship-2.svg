<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="270" cy="160" r="0.4" fill="#38BDF8" opacity="0.64" style="animation: pulse 3.1s ease-in-out infinite 0.3s" />
<circle cx="260" cy="56" r="0.5" fill="#818CF8" opacity="0.30" style="animation: pulse 2.4s ease-in-out infinite 3.1s" />
<circle cx="98" cy="44" r="0.7" fill="#A5B4FC" opacity="0.47" style="animation: pulse 4.2s ease-in-out infinite 3.1s" />
<circle cx="175" cy="192" r="0.5" fill="#A5B4FC" opacity="0.56" style="animation: pulse 3.5s ease-in-out infinite 1.8s" />
<circle cx="158" cy="35" r="0.9" fill="#F8FAFC" opacity="0.27" style="animation: pulse 4.9s ease-in-out infinite 0.8s" />
<circle cx="18" cy="34" r="0.6" fill="#818CF8" opacity="0.60" style="animation: pulse 3.0s ease-in-out infinite 0.1s" />
<circle cx="276" cy="198" r="1.0" fill="#F8FAFC" opacity="0.51" style="animation: pulse 2.1s ease-in-out infinite 0.2s" />
<circle cx="256" cy="32" r="0.6" fill="#38BDF8" opacity="0.31" style="animation: pulse 2.2s ease-in-out infinite 4.0s" />
<circle cx="71" cy="22" r="0.5" fill="#38BDF8" opacity="0.42" style="animation: pulse 3.6s ease-in-out infinite 0.8s" />
<circle cx="63" cy="56" r="1.1" fill="#A5B4FC" opacity="0.50" style="animation: pulse 4.1s ease-in-out infinite 0.8s" />
<circle cx="74" cy="14" r="0.6" fill="#818CF8" opacity="0.56" style="animation: pulse 2.9s ease-in-out infinite 0.2s" />
<circle cx="133" cy="79" r="0.9" fill="#A5B4FC" opacity="0.29" style="animation: pulse 4.6s ease-in-out infinite 2.5s" />
<circle cx="235" cy="177" r="0.8" fill="#818CF8" opacity="0.31" style="animation: pulse 2.5s ease-in-out infinite 1.4s" />
<circle cx="242" cy="151" r="0.4" fill="#F8FAFC" opacity="0.60" style="animation: pulse 3.9s ease-in-out infinite 0.3s" />
<circle cx="252" cy="91" r="0.6" fill="#38BDF8" opacity="0.30" style="animation: pulse 4.6s ease-in-out infinite 2.4s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>