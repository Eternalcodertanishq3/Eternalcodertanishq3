<circle cx="94" cy="215" r="1.1" fill="#A5B4FC" opacity="0.17" style="animation: pulse 2.1s ease-in-out infinite 3.7s" />
<circle cx="61" cy="82" r="0.8" fill="#A5B4FC" opacity="0.54" style="animation: pulse 2.1s ease-in-out infinite 2.5s" />
