<circle cx="226" cy="13" r="0.9" fill="#818CF8" opacity="0.80" style="animation: pulse 3.2s ease-in-out infinite 1.7s" />
<circle cx="144" cy="214" r="0.5" fill="#38BDF8" opacity="0.85" style="animation: pulse 2.0s ease-in-out infinite 2.0s" />
<circle cx="224" cy="93" r="0.5" fill="#A5B4FC" opacity="0.19" style="animation: pulse 2.1s ease-in-out infinite 2.9s" />
<circle cx="27" cy="161" r="0.6" fill="#F8FAFC" opacity="0.38" style="animation: pulse 4.0s ease-in-out infinite 0.2s" />
<circle cx="252" cy="62" r="1.0" fill="#A5B4FC" opacity="0.30" style="animation: pulse 3.8s ease-in-out infinite 3.3s" />
<circle cx="126" cy="153" r="0.9" fill="#A5B4FC" opacity="0.71" style="animation: pulse 4.5s ease-in-out infinite 4.2s" />
<circle cx="121" cy="156" r="0.4" fill="#818CF8" opacity="0.36" style="animation: pulse 3.5s ease-in-out infinite 2.0s" />
<circle cx="137" cy="150" r="0.9" fill="#F8FAFC" opacity="0.77" style="animation: pulse 4.6s ease-in-out infinite 1.7s" />
<circle cx="88" cy="200" r="1.1" fill="#F8FAFC" opacity="0.79" style="animation: pulse 4.1s ease-in-out infinite 3.8s" />
<circle cx="189" cy="69" r="0.9" fill="#38BDF8" opacity="0.67" style="animation: pulse 3.9s ease-in-out infinite 3.7s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
