<circle cx="33" cy="89" r="0.5" fill="#818CF8" opacity="0.68" style="animation: pulse 4.4s ease-in-out infinite 3.1s" />
<circle cx="235" cy="218" r="0.5" fill="#F8FAFC" opacity="0.24" style="animation: pulse 2.7s ease-in-out infinite 1.3s" />
<circle cx="178" cy="122" r="0.8" fill="#38BDF8" opacity="0.33" style="animation: pulse 4.2s ease-in-out infinite 3.0s" />
<circle cx="179" cy="170" r="1.0" fill="#F8FAFC" opacity="0.73" style="animation: pulse 2.1s ease-in-out infinite 3.9s" />
<circle cx="248" cy="73" r="0.8" fill="#818CF8" opacity="0.39" style="animation: pulse 4.6s ease-in-out infinite 4.8s" />
<circle cx="255" cy="24" r="1.0" fill="#F8FAFC" opacity="0.42" style="animation: pulse 4.0s ease-in-out infinite 1.8s" />
<circle cx="185" cy="69" r="0.9" fill="#A5B4FC" opacity="0.37" style="animation: pulse 4.0s ease-in-out infinite 4.8s" />
<circle cx="188" cy="217" r="0.5" fill="#38BDF8" opacity="0.38" style="animation: pulse 4.4s ease-in-out infinite 4.2s" />
<circle cx="134" cy="14" r="0.8" fill="#38BDF8" opacity="0.76" style="animation: pulse 4.7s ease-in-out infinite 0.8s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

