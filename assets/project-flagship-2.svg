<circle cx="130" cy="217" r="0.6" fill="#818CF8" opacity="0.46" style="animation: pulse 3.5s ease-in-out infinite 2.7s" />
<circle cx="187" cy="41" r="0.5" fill="#38BDF8" opacity="0.36" style="animation: pulse 2.9s ease-in-out infinite 3.0s" />
<circle cx="26" cy="205" r="1.1" fill="#F8FAFC" opacity="0.64" style="animation: pulse 2.0s ease-in-out infinite 3.9s" />
<circle cx="0" cy="29" r="0.4" fill="#F8FAFC" opacity="0.42" style="animation: pulse 2.1s ease-in-out infinite 4.3s" />
<circle cx="138" cy="206" r="0.9" fill="#818CF8" opacity="0.73" style="animation: pulse 3.9s ease-in-out infinite 2.4s" />
<circle cx="171" cy="186" r="1.1" fill="#A5B4FC" opacity="0.53" style="animation: pulse 2.6s ease-in-out infinite 2.0s" />
<circle cx="76" cy="203" r="1.2" fill="#38BDF8" opacity="0.18" style="animation: pulse 2.6s ease-in-out infinite 2.1s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


