<circle cx="30" cy="24" r="0.8" fill="#F8FAFC" opacity="0.16" style="animation: pulse 4.6s ease-in-out infinite 1.8s" />
<circle cx="26" cy="212" r="0.8" fill="#818CF8" opacity="0.82" style="animation: pulse 4.9s ease-in-out infinite 2.5s" />
<circle cx="260" cy="175" r="0.8" fill="#38BDF8" opacity="0.51" style="animation: pulse 3.6s ease-in-out infinite 1.7s" />
<circle cx="274" cy="26" r="0.7" fill="#818CF8" opacity="0.34" style="animation: pulse 4.0s ease-in-out infinite 1.4s" />
<circle cx="49" cy="190" r="1.1" fill="#818CF8" opacity="0.44" style="animation: pulse 3.3s ease-in-out infinite 0.9s" />
<circle cx="143" cy="109" r="0.7" fill="#38BDF8" opacity="0.50" style="animation: pulse 2.6s ease-in-out infinite 0.7s" />
<circle cx="211" cy="205" r="0.6" fill="#F8FAFC" opacity="0.71" style="animation: pulse 2.9s ease-in-out infinite 2.6s" />
<circle cx="83" cy="22" r="0.7" fill="#818CF8" opacity="0.79" style="animation: pulse 4.1s ease-in-out infinite 2.9s" />
<circle cx="187" cy="134" r="0.8" fill="#F8FAFC" opacity="0.53" style="animation: pulse 4.1s ease-in-out infinite 2.3s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
