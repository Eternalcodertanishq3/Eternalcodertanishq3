<circle cx="202" cy="89" r="0.9" fill="#A5B4FC" opacity="0.80" style="animation: pulse 3.4s ease-in-out infinite 0.5s" />
<circle cx="100" cy="199" r="0.5" fill="#F8FAFC" opacity="0.60" style="animation: pulse 4.1s ease-in-out infinite 0.1s" />
<circle cx="233" cy="62" r="0.8" fill="#A5B4FC" opacity="0.59" style="animation: pulse 2.6s ease-in-out infinite 4.4s" />
