<circle cx="109" cy="89" r="0.7" fill="#A5B4FC" opacity="0.74" style="animation: pulse 2.1s ease-in-out infinite 2.1s" />
<circle cx="124" cy="203" r="0.6" fill="#818CF8" opacity="0.76" style="animation: pulse 4.8s ease-in-out infinite 2.6s" />
