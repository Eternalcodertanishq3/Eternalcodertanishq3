<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="168" cy="215" r="0.8" fill="#F8FAFC" opacity="0.19" style="animation: pulse 3.1s ease-in-out infinite 2.5s" />
<circle cx="52" cy="138" r="0.4" fill="#A5B4FC" opacity="0.66" style="animation: pulse 2.2s ease-in-out infinite 0.0s" />
<circle cx="208" cy="25" r="0.6" fill="#38BDF8" opacity="0.64" style="animation: pulse 4.7s ease-in-out infinite 4.0s" />
