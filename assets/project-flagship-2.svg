<circle cx="180" cy="62" r="1.2" fill="#38BDF8" opacity="0.62" style="animation: pulse 2.8s ease-in-out infinite 1.0s" />
<circle cx="183" cy="193" r="0.8" fill="#818CF8" opacity="0.32" style="animation: pulse 3.8s ease-in-out infinite 1.1s" />
<circle cx="7" cy="171" r="0.6" fill="#A5B4FC" opacity="0.49" style="animation: pulse 2.6s ease-in-out infinite 3.3s" />
<circle cx="158" cy="208" r="0.4" fill="#818CF8" opacity="0.75" style="animation: pulse 4.4s ease-in-out infinite 1.7s" />
<circle cx="198" cy="9" r="0.9" fill="#818CF8" opacity="0.17" style="animation: pulse 4.8s ease-in-out infinite 1.8s" />
<circle cx="130" cy="96" r="1.0" fill="#38BDF8" opacity="0.70" style="animation: pulse 2.1s ease-in-out infinite 1.1s" />
<circle cx="16" cy="49" r="1.0" fill="#A5B4FC" opacity="0.56" style="animation: pulse 2.3s ease-in-out infinite 2.8s" />
<circle cx="93" cy="95" r="0.8" fill="#F8FAFC" opacity="0.66" style="animation: pulse 4.3s ease-in-out infinite 3.8s" />
<circle cx="69" cy="17" r="0.6" fill="#38BDF8" opacity="0.78" style="animation: pulse 2.8s ease-in-out infinite 3.1s" />
<circle cx="56" cy="213" r="0.9" fill="#818CF8" opacity="0.35" style="animation: pulse 3.9s ease-in-out infinite 4.2s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
