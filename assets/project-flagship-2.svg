<circle cx="67" cy="18" r="0.7" fill="#F8FAFC" opacity="0.41" style="animation: pulse 5.0s ease-in-out infinite 3.4s" />
<circle cx="126" cy="91" r="0.6" fill="#38BDF8" opacity="0.49" style="animation: pulse 4.9s ease-in-out infinite 1.6s" />
