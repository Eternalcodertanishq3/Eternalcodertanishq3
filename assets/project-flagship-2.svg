<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="69" cy="111" r="1.1" fill="#38BDF8" opacity="0.29" style="animation: pulse 3.8s ease-in-out infinite 3.2s" />
<circle cx="195" cy="59" r="0.5" fill="#A5B4FC" opacity="0.39" style="animation: pulse 3.5s ease-in-out infinite 1.8s" />
<circle cx="91" cy="72" r="0.7" fill="#A5B4FC" opacity="0.49" style="animation: pulse 2.9s ease-in-out infinite 0.6s" />
