<circle cx="34" cy="14" r="1.0" fill="#A5B4FC" opacity="0.42" style="animation: pulse 4.2s ease-in-out infinite 3.3s" />
<circle cx="183" cy="106" r="0.8" fill="#F8FAFC" opacity="0.59" style="animation: pulse 4.7s ease-in-out infinite 2.6s" />
<circle cx="80" cy="205" r="0.9" fill="#38BDF8" opacity="0.48" style="animation: pulse 5.0s ease-in-out infinite 0.5s" />
