<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="112" cy="151" r="1.2" fill="#38BDF8" opacity="0.47" style="animation: pulse 3.6s ease-in-out infinite 3.4s" />
<circle cx="212" cy="41" r="1.1" fill="#F8FAFC" opacity="0.52" style="animation: pulse 3.3s ease-in-out infinite 2.9s" />
<circle cx="251" cy="26" r="0.9" fill="#818CF8" opacity="0.25" style="animation: pulse 4.8s ease-in-out infinite 0.7s" />
<circle cx="183" cy="18" r="0.6" fill="#818CF8" opacity="0.43" style="animation: pulse 4.3s ease-in-out infinite 4.8s" />
<circle cx="139" cy="136" r="0.8" fill="#F8FAFC" opacity="0.46" style="animation: pulse 4.9s ease-in-out infinite 4.8s" />
<circle cx="226" cy="35" r="1.0" fill="#818CF8" opacity="0.48" style="animation: pulse 3.0s ease-in-out infinite 1.2s" />
<circle cx="51" cy="208" r="0.8" fill="#38BDF8" opacity="0.74" style="animation: pulse 4.4s ease-in-out infinite 3.2s" />
<circle cx="206" cy="70" r="0.7" fill="#818CF8" opacity="0.78" style="animation: pulse 2.1s ease-in-out infinite 2.0s" />
<circle cx="166" cy="129" r="0.8" fill="#A5B4FC" opacity="0.72" style="animation: pulse 3.5s ease-in-out infinite 4.5s" />
<circle cx="156" cy="122" r="0.6" fill="#F8FAFC" opacity="0.53" style="animation: pulse 2.4s ease-in-out infinite 3.9s" />
<circle cx="243" cy="100" r="0.9" fill="#A5B4FC" opacity="0.20" style="animation: pulse 3.4s ease-in-out infinite 0.5s" />
<circle cx="110" cy="117" r="1.1" fill="#818CF8" opacity="0.32" style="animation: pulse 3.5s ease-in-out infinite 4.7s" />
<circle cx="276" cy="133" r="0.7" fill="#A5B4FC" opacity="0.82" style="animation: pulse 4.1s ease-in-out infinite 3.2s" />
<circle cx="75" cy="31" r="0.5" fill="#F8FAFC" opacity="0.21" style="animation: pulse 2.3s ease-in-out infinite 4.6s" />
<circle cx="260" cy="95" r="1.1" fill="#A5B4FC" opacity="0.41" style="animation: pulse 2.8s ease-in-out infinite 4.4s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>