<circle cx="135" cy="156" r="1.1" fill="#F8FAFC" opacity="0.43" style="animation: pulse 3.2s ease-in-out infinite 0.3s" />
<circle cx="64" cy="85" r="0.7" fill="#818CF8" opacity="0.34" style="animation: pulse 4.6s ease-in-out infinite 3.1s" />
<circle cx="204" cy="137" r="0.7" fill="#A5B4FC" opacity="0.15" style="animation: pulse 3.7s ease-in-out infinite 0.7s" />
<circle cx="63" cy="193" r="0.7" fill="#38BDF8" opacity="0.77" style="animation: pulse 3.0s ease-in-out infinite 3.6s" />
<circle cx="158" cy="80" r="0.9" fill="#818CF8" opacity="0.44" style="animation: pulse 3.3s ease-in-out infinite 0.9s" />
<circle cx="226" cy="12" r="0.7" fill="#38BDF8" opacity="0.50" style="animation: pulse 3.0s ease-in-out infinite 0.8s" />
<circle cx="150" cy="105" r="0.5" fill="#A5B4FC" opacity="0.48" style="animation: pulse 2.1s ease-in-out infinite 0.1s" />
<circle cx="189" cy="167" r="0.9" fill="#F8FAFC" opacity="0.78" style="animation: pulse 2.3s ease-in-out infinite 2.8s" />
<circle cx="49" cy="163" r="0.4" fill="#818CF8" opacity="0.51" style="animation: pulse 2.3s ease-in-out infinite 1.5s" />
<circle cx="193" cy="67" r="0.7" fill="#F8FAFC" opacity="0.39" style="animation: pulse 3.6s ease-in-out infinite 2.5s" />
<circle cx="28" cy="212" r="0.5" fill="#A5B4FC" opacity="0.77" style="animation: pulse 4.4s ease-in-out infinite 3.3s" />
<circle cx="244" cy="31" r="0.7" fill="#A5B4FC" opacity="0.20" style="animation: pulse 4.0s ease-in-out infinite 3.6s" />
<circle cx="237" cy="139" r="0.6" fill="#38BDF8" opacity="0.42" style="animation: pulse 5.0s ease-in-out infinite 1.2s" />
<circle cx="249" cy="41" r="0.8" fill="#F8FAFC" opacity="0.79" style="animation: pulse 4.5s ease-in-out infinite 4.9s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

