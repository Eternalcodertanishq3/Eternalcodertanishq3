<circle cx="60" cy="209" r="1.1" fill="#818CF8" opacity="0.46" style="animation: pulse 4.5s ease-in-out infinite 2.3s" />
<circle cx="79" cy="181" r="1.1" fill="#818CF8" opacity="0.85" style="animation: pulse 4.5s ease-in-out infinite 3.5s" />
