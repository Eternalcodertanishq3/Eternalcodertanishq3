<circle cx="41" cy="56" r="1.2" fill="#A5B4FC" opacity="0.72" style="animation: pulse 4.9s ease-in-out infinite 2.2s" />
<circle cx="28" cy="197" r="0.5" fill="#38BDF8" opacity="0.35" style="animation: pulse 4.2s ease-in-out infinite 3.7s" />
<circle cx="127" cy="42" r="0.7" fill="#818CF8" opacity="0.53" style="animation: pulse 4.9s ease-in-out infinite 3.2s" />
<circle cx="256" cy="165" r="1.1" fill="#F8FAFC" opacity="0.41" style="animation: pulse 4.8s ease-in-out infinite 1.8s" />
<circle cx="214" cy="86" r="0.7" fill="#F8FAFC" opacity="0.22" style="animation: pulse 3.0s ease-in-out infinite 3.0s" />
<circle cx="118" cy="89" r="0.9" fill="#F8FAFC" opacity="0.57" style="animation: pulse 4.9s ease-in-out infinite 0.4s" />
<circle cx="135" cy="216" r="0.6" fill="#A5B4FC" opacity="0.76" style="animation: pulse 3.4s ease-in-out infinite 2.6s" />
<circle cx="103" cy="33" r="1.0" fill="#F8FAFC" opacity="0.40" style="animation: pulse 3.9s ease-in-out infinite 0.4s" />
<circle cx="193" cy="57" r="1.1" fill="#F8FAFC" opacity="0.61" style="animation: pulse 3.2s ease-in-out infinite 2.4s" />
<circle cx="21" cy="175" r="1.1" fill="#38BDF8" opacity="0.55" style="animation: pulse 2.5s ease-in-out infinite 1.2s" />
<circle cx="105" cy="204" r="0.9" fill="#A5B4FC" opacity="0.79" style="animation: pulse 4.4s ease-in-out infinite 0.0s" />
<circle cx="195" cy="66" r="0.7" fill="#A5B4FC" opacity="0.64" style="animation: pulse 2.9s ease-in-out infinite 0.8s" />
<circle cx="138" cy="123" r="1.1" fill="#38BDF8" opacity="0.70" style="animation: pulse 4.3s ease-in-out infinite 3.7s" />
<circle cx="155" cy="92" r="0.6" fill="#818CF8" opacity="0.85" style="animation: pulse 3.3s ease-in-out infinite 3.2s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

