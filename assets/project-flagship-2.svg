<circle cx="98" cy="166" r="0.8" fill="#F8FAFC" opacity="0.27" style="animation: pulse 4.0s ease-in-out infinite 1.7s" />
<circle cx="55" cy="211" r="0.8" fill="#818CF8" opacity="0.17" style="animation: pulse 3.7s ease-in-out infinite 1.8s" />
<circle cx="182" cy="36" r="0.5" fill="#A5B4FC" opacity="0.75" style="animation: pulse 2.1s ease-in-out infinite 3.3s" />
<circle cx="188" cy="198" r="0.8" fill="#F8FAFC" opacity="0.42" style="animation: pulse 2.5s ease-in-out infinite 3.7s" />
<circle cx="125" cy="134" r="1.1" fill="#38BDF8" opacity="0.83" style="animation: pulse 2.5s ease-in-out infinite 3.5s" />
<circle cx="178" cy="170" r="1.2" fill="#F8FAFC" opacity="0.58" style="animation: pulse 2.7s ease-in-out infinite 3.7s" />
<circle cx="164" cy="82" r="0.8" fill="#F8FAFC" opacity="0.55" style="animation: pulse 4.7s ease-in-out infinite 3.5s" />
<circle cx="154" cy="185" r="1.0" fill="#F8FAFC" opacity="0.33" style="animation: pulse 4.3s ease-in-out infinite 2.5s" />
<circle cx="41" cy="46" r="0.8" fill="#38BDF8" opacity="0.72" style="animation: pulse 2.6s ease-in-out infinite 4.1s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
