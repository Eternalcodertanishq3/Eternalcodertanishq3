<circle cx="239" cy="134" r="1.2" fill="#38BDF8" opacity="0.73" style="animation: pulse 2.3s ease-in-out infinite 1.3s" />
<circle cx="136" cy="200" r="0.5" fill="#818CF8" opacity="0.33" style="animation: pulse 4.4s ease-in-out infinite 1.7s" />
<circle cx="270" cy="51" r="0.8" fill="#F8FAFC" opacity="0.44" style="animation: pulse 2.2s ease-in-out infinite 1.3s" />
<circle cx="155" cy="166" r="1.0" fill="#818CF8" opacity="0.62" style="animation: pulse 3.3s ease-in-out infinite 1.4s" />
<circle cx="11" cy="97" r="0.6" fill="#38BDF8" opacity="0.67" style="animation: pulse 2.9s ease-in-out infinite 0.2s" />
<circle cx="17" cy="213" r="0.9" fill="#F8FAFC" opacity="0.17" style="animation: pulse 3.7s ease-in-out infinite 4.1s" />
