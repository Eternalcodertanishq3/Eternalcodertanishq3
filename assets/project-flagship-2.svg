<circle cx="91" cy="112" r="0.4" fill="#38BDF8" opacity="0.49" style="animation: pulse 4.9s ease-in-out infinite 2.5s" />
<circle cx="136" cy="161" r="0.5" fill="#818CF8" opacity="0.51" style="animation: pulse 2.4s ease-in-out infinite 0.3s" />
