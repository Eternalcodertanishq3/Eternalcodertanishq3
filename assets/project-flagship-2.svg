<circle cx="48" cy="85" r="0.9" fill="#38BDF8" opacity="0.21" style="animation: pulse 2.1s ease-in-out infinite 4.1s" />
<circle cx="140" cy="129" r="1.2" fill="#F8FAFC" opacity="0.16" style="animation: pulse 3.2s ease-in-out infinite 3.6s" />
