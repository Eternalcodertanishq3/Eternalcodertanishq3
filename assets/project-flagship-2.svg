<circle cx="37" cy="68" r="0.7" fill="#A5B4FC" opacity="0.70" style="animation: pulse 3.8s ease-in-out infinite 2.8s" />
<circle cx="33" cy="143" r="0.8" fill="#F8FAFC" opacity="0.51" style="animation: pulse 4.6s ease-in-out infinite 3.4s" />
