<circle cx="0" cy="51" r="1.2" fill="#818CF8" opacity="0.29" style="animation: pulse 4.0s ease-in-out infinite 4.3s" />
<circle cx="97" cy="204" r="1.1" fill="#818CF8" opacity="0.32" style="animation: pulse 4.5s ease-in-out infinite 1.3s" />
<circle cx="20" cy="202" r="0.8" fill="#38BDF8" opacity="0.28" style="animation: pulse 2.9s ease-in-out infinite 1.0s" />
<circle cx="279" cy="11" r="0.6" fill="#A5B4FC" opacity="0.29" style="animation: pulse 4.9s ease-in-out infinite 1.8s" />
<circle cx="118" cy="92" r="0.8" fill="#A5B4FC" opacity="0.70" style="animation: pulse 3.9s ease-in-out infinite 1.0s" />
<circle cx="232" cy="190" r="1.1" fill="#818CF8" opacity="0.42" style="animation: pulse 2.4s ease-in-out infinite 1.4s" />
<circle cx="222" cy="179" r="0.4" fill="#38BDF8" opacity="0.75" style="animation: pulse 4.9s ease-in-out infinite 1.0s" />
<circle cx="97" cy="96" r="0.6" fill="#A5B4FC" opacity="0.31" style="animation: pulse 2.9s ease-in-out infinite 4.3s" />
<circle cx="250" cy="99" r="1.1" fill="#38BDF8" opacity="0.28" style="animation: pulse 3.6s ease-in-out infinite 2.8s" />
<circle cx="154" cy="152" r="0.6" fill="#818CF8" opacity="0.24" style="animation: pulse 2.9s ease-in-out infinite 2.5s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


