<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="44" cy="198" r="0.8" fill="#818CF8" opacity="0.55" style="animation: pulse 2.9s ease-in-out infinite 0.5s" />
<circle cx="175" cy="51" r="0.9" fill="#F8FAFC" opacity="0.60" style="animation: pulse 3.2s ease-in-out infinite 2.8s" />
<circle cx="241" cy="179" r="0.5" fill="#F8FAFC" opacity="0.65" style="animation: pulse 4.4s ease-in-out infinite 1.5s" />
<circle cx="170" cy="69" r="1.0" fill="#818CF8" opacity="0.16" style="animation: pulse 4.6s ease-in-out infinite 1.8s" />
<circle cx="147" cy="59" r="1.0" fill="#818CF8" opacity="0.70" style="animation: pulse 5.0s ease-in-out infinite 2.0s" />
<circle cx="101" cy="185" r="0.9" fill="#A5B4FC" opacity="0.63" style="animation: pulse 3.3s ease-in-out infinite 1.8s" />
<circle cx="208" cy="187" r="0.6" fill="#818CF8" opacity="0.48" style="animation: pulse 3.4s ease-in-out infinite 0.8s" />
<circle cx="125" cy="186" r="1.2" fill="#38BDF8" opacity="0.51" style="animation: pulse 4.4s ease-in-out infinite 0.5s" />
<circle cx="40" cy="200" r="0.6" fill="#F8FAFC" opacity="0.27" style="animation: pulse 2.8s ease-in-out infinite 3.7s" />
<circle cx="173" cy="150" r="0.7" fill="#F8FAFC" opacity="0.62" style="animation: pulse 3.8s ease-in-out infinite 2.6s" />
<circle cx="220" cy="10" r="0.7" fill="#A5B4FC" opacity="0.70" style="animation: pulse 4.7s ease-in-out infinite 4.8s" />
<circle cx="53" cy="175" r="0.5" fill="#A5B4FC" opacity="0.74" style="animation: pulse 4.8s ease-in-out infinite 4.5s" />
<circle cx="5" cy="68" r="0.6" fill="#818CF8" opacity="0.44" style="animation: pulse 3.8s ease-in-out infinite 2.8s" />
<circle cx="219" cy="100" r="0.6" fill="#F8FAFC" opacity="0.51" style="animation: pulse 2.5s ease-in-out infinite 2.0s" />
<circle cx="96" cy="195" r="0.5" fill="#818CF8" opacity="0.74" style="animation: pulse 3.5s ease-in-out infinite 4.5s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
