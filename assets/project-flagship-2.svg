<circle cx="252" cy="192" r="0.7" fill="#818CF8" opacity="0.78" style="animation: pulse 4.4s ease-in-out infinite 1.4s" />
<circle cx="169" cy="219" r="0.5" fill="#A5B4FC" opacity="0.28" style="animation: pulse 4.5s ease-in-out infinite 4.5s" />
<circle cx="191" cy="6" r="0.5" fill="#38BDF8" opacity="0.45" style="animation: pulse 3.1s ease-in-out infinite 4.3s" />
<circle cx="101" cy="178" r="1.2" fill="#38BDF8" opacity="0.31" style="animation: pulse 3.0s ease-in-out infinite 1.3s" />
<circle cx="259" cy="51" r="0.4" fill="#818CF8" opacity="0.32" style="animation: pulse 2.4s ease-in-out infinite 1.5s" />
<circle cx="89" cy="62" r="0.5" fill="#F8FAFC" opacity="0.48" style="animation: pulse 3.3s ease-in-out infinite 1.5s" />
<circle cx="62" cy="115" r="0.5" fill="#38BDF8" opacity="0.50" style="animation: pulse 3.5s ease-in-out infinite 0.5s" />
<circle cx="16" cy="163" r="1.0" fill="#A5B4FC" opacity="0.55" style="animation: pulse 2.8s ease-in-out infinite 2.2s" />
<circle cx="42" cy="156" r="0.5" fill="#818CF8" opacity="0.20" style="animation: pulse 2.9s ease-in-out infinite 0.7s" />
<circle cx="81" cy="163" r="0.7" fill="#F8FAFC" opacity="0.43" style="animation: pulse 2.7s ease-in-out infinite 4.3s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


