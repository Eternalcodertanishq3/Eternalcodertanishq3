<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="158" cy="128" r="0.7" fill="#A5B4FC" opacity="0.53" style="animation: pulse 3.0s ease-in-out infinite 1.4s" />
<circle cx="224" cy="124" r="0.7" fill="#818CF8" opacity="0.70" style="animation: pulse 3.8s ease-in-out infinite 3.9s" />
<circle cx="106" cy="117" r="0.9" fill="#A5B4FC" opacity="0.45" style="animation: pulse 2.9s ease-in-out infinite 1.1s" />
<circle cx="24" cy="38" r="0.4" fill="#A5B4FC" opacity="0.57" style="animation: pulse 4.8s ease-in-out infinite 1.8s" />
