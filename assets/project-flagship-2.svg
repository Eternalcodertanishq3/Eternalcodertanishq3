<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="38" cy="159" r="0.7" fill="#38BDF8" opacity="0.39" style="animation: pulse 4.0s ease-in-out infinite 4.0s" />
<circle cx="78" cy="7" r="0.8" fill="#F8FAFC" opacity="0.52" style="animation: pulse 3.4s ease-in-out infinite 4.5s" />
<circle cx="27" cy="148" r="0.4" fill="#38BDF8" opacity="0.48" style="animation: pulse 4.9s ease-in-out infinite 3.9s" />
<circle cx="124" cy="84" r="0.5" fill="#A5B4FC" opacity="0.71" style="animation: pulse 4.2s ease-in-out infinite 0.0s" />
<circle cx="239" cy="5" r="0.5" fill="#38BDF8" opacity="0.29" style="animation: pulse 4.4s ease-in-out infinite 1.1s" />
<circle cx="111" cy="40" r="1.0" fill="#818CF8" opacity="0.45" style="animation: pulse 2.2s ease-in-out infinite 4.8s" />
<circle cx="179" cy="210" r="0.9" fill="#38BDF8" opacity="0.18" style="animation: pulse 4.5s ease-in-out infinite 2.3s" />
<circle cx="42" cy="62" r="1.1" fill="#A5B4FC" opacity="0.79" style="animation: pulse 2.1s ease-in-out infinite 2.2s" />
<circle cx="48" cy="194" r="0.6" fill="#818CF8" opacity="0.49" style="animation: pulse 4.8s ease-in-out infinite 1.5s" />
<circle cx="114" cy="185" r="0.7" fill="#A5B4FC" opacity="0.44" style="animation: pulse 2.7s ease-in-out infinite 2.9s" />
<circle cx="55" cy="200" r="0.8" fill="#A5B4FC" opacity="0.48" style="animation: pulse 2.3s ease-in-out infinite 4.6s" />
<circle cx="115" cy="130" r="0.5" fill="#818CF8" opacity="0.71" style="animation: pulse 2.1s ease-in-out infinite 0.3s" />
<circle cx="87" cy="95" r="0.6" fill="#F8FAFC" opacity="0.72" style="animation: pulse 4.9s ease-in-out infinite 4.1s" />
<circle cx="74" cy="130" r="1.1" fill="#818CF8" opacity="0.46" style="animation: pulse 2.4s ease-in-out infinite 2.6s" />
<circle cx="128" cy="70" r="1.0" fill="#818CF8" opacity="0.47" style="animation: pulse 4.8s ease-in-out infinite 3.9s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>