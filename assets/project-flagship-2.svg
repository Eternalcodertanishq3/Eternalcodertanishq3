<circle cx="86" cy="101" r="0.6" fill="#A5B4FC" opacity="0.81" style="animation: pulse 2.3s ease-in-out infinite 2.9s" />
<circle cx="243" cy="28" r="0.5" fill="#A5B4FC" opacity="0.41" style="animation: pulse 4.1s ease-in-out infinite 1.4s" />
<circle cx="99" cy="40" r="0.4" fill="#818CF8" opacity="0.45" style="animation: pulse 4.9s ease-in-out infinite 2.6s" />
