<circle cx="233" cy="44" r="0.7" fill="#A5B4FC" opacity="0.15" style="animation: pulse 3.1s ease-in-out infinite 4.5s" />
<circle cx="264" cy="58" r="0.6" fill="#818CF8" opacity="0.71" style="animation: pulse 3.0s ease-in-out infinite 4.9s" />
<circle cx="160" cy="195" r="0.7" fill="#A5B4FC" opacity="0.51" style="animation: pulse 4.2s ease-in-out infinite 3.3s" />
<circle cx="136" cy="132" r="1.0" fill="#A5B4FC" opacity="0.62" style="animation: pulse 3.2s ease-in-out infinite 2.2s" />
<circle cx="130" cy="214" r="0.6" fill="#A5B4FC" opacity="0.65" style="animation: pulse 2.7s ease-in-out infinite 1.6s" />
<circle cx="269" cy="70" r="1.1" fill="#818CF8" opacity="0.64" style="animation: pulse 4.1s ease-in-out infinite 4.1s" />
<circle cx="21" cy="97" r="0.7" fill="#818CF8" opacity="0.47" style="animation: pulse 4.1s ease-in-out infinite 2.8s" />
<circle cx="220" cy="89" r="1.1" fill="#818CF8" opacity="0.62" style="animation: pulse 4.9s ease-in-out infinite 0.2s" />
<circle cx="227" cy="55" r="1.1" fill="#38BDF8" opacity="0.33" style="animation: pulse 3.6s ease-in-out infinite 3.9s" />
<circle cx="91" cy="194" r="0.6" fill="#38BDF8" opacity="0.23" style="animation: pulse 3.6s ease-in-out infinite 4.8s" />
<circle cx="6" cy="80" r="0.6" fill="#A5B4FC" opacity="0.64" style="animation: pulse 4.3s ease-in-out infinite 3.8s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


