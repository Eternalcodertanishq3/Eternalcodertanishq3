<circle cx="178" cy="212" r="0.4" fill="#A5B4FC" opacity="0.46" style="animation: pulse 3.7s ease-in-out infinite 0.8s" />
<circle cx="44" cy="67" r="0.9" fill="#38BDF8" opacity="0.72" style="animation: pulse 4.5s ease-in-out infinite 3.4s" />
<circle cx="107" cy="196" r="0.6" fill="#38BDF8" opacity="0.84" style="animation: pulse 3.9s ease-in-out infinite 0.4s" />
<circle cx="13" cy="50" r="0.7" fill="#38BDF8" opacity="0.59" style="animation: pulse 3.1s ease-in-out infinite 5.0s" />
<circle cx="132" cy="8" r="0.7" fill="#38BDF8" opacity="0.18" style="animation: pulse 3.7s ease-in-out infinite 1.4s" />
<circle cx="24" cy="31" r="1.0" fill="#A5B4FC" opacity="0.51" style="animation: pulse 2.8s ease-in-out infinite 3.9s" />
<circle cx="234" cy="102" r="0.5" fill="#F8FAFC" opacity="0.31" style="animation: pulse 4.1s ease-in-out infinite 3.6s" />
<circle cx="49" cy="192" r="1.2" fill="#818CF8" opacity="0.62" style="animation: pulse 3.1s ease-in-out infinite 2.1s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


