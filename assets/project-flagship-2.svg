<circle cx="134" cy="170" r="1.2" fill="#A5B4FC" opacity="0.49" style="animation: pulse 3.0s ease-in-out infinite 4.6s" />
<circle cx="3" cy="211" r="0.5" fill="#F8FAFC" opacity="0.78" style="animation: pulse 2.0s ease-in-out infinite 0.6s" />
<circle cx="206" cy="166" r="0.9" fill="#818CF8" opacity="0.39" style="animation: pulse 3.1s ease-in-out infinite 1.6s" />
<circle cx="117" cy="64" r="1.0" fill="#F8FAFC" opacity="0.38" style="animation: pulse 2.2s ease-in-out infinite 2.1s" />
<circle cx="152" cy="64" r="0.8" fill="#F8FAFC" opacity="0.20" style="animation: pulse 3.9s ease-in-out infinite 4.3s" />
<circle cx="3" cy="171" r="0.5" fill="#A5B4FC" opacity="0.16" style="animation: pulse 2.8s ease-in-out infinite 2.1s" />
<circle cx="240" cy="50" r="1.0" fill="#38BDF8" opacity="0.25" style="animation: pulse 2.4s ease-in-out infinite 2.8s" />
<circle cx="136" cy="64" r="1.0" fill="#F8FAFC" opacity="0.65" style="animation: pulse 2.1s ease-in-out infinite 2.9s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

