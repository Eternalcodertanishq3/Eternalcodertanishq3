<circle cx="101" cy="80" r="0.6" fill="#A5B4FC" opacity="0.23" style="animation: pulse 2.5s ease-in-out infinite 3.7s" />
<circle cx="29" cy="66" r="0.6" fill="#818CF8" opacity="0.55" style="animation: pulse 2.4s ease-in-out infinite 1.6s" />
<circle cx="7" cy="114" r="0.5" fill="#38BDF8" opacity="0.82" style="animation: pulse 4.1s ease-in-out infinite 0.6s" />
<circle cx="14" cy="125" r="1.0" fill="#F8FAFC" opacity="0.37" style="animation: pulse 4.0s ease-in-out infinite 1.9s" />
<circle cx="0" cy="48" r="1.0" fill="#38BDF8" opacity="0.20" style="animation: pulse 2.4s ease-in-out infinite 2.4s" />
<circle cx="261" cy="136" r="0.6" fill="#38BDF8" opacity="0.55" style="animation: pulse 4.7s ease-in-out infinite 2.3s" />
<circle cx="71" cy="98" r="1.2" fill="#F8FAFC" opacity="0.51" style="animation: pulse 2.6s ease-in-out infinite 1.3s" />
<circle cx="25" cy="38" r="1.0" fill="#38BDF8" opacity="0.39" style="animation: pulse 4.2s ease-in-out infinite 2.9s" />
<circle cx="21" cy="167" r="1.2" fill="#A5B4FC" opacity="0.25" style="animation: pulse 3.2s ease-in-out infinite 3.8s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

