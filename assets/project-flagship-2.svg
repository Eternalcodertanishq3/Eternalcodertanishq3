<circle cx="212" cy="123" r="0.7" fill="#A5B4FC" opacity="0.61" style="animation: pulse 3.6s ease-in-out infinite 0.8s" />
<circle cx="277" cy="44" r="0.7" fill="#818CF8" opacity="0.30" style="animation: pulse 2.1s ease-in-out infinite 4.5s" />
<circle cx="133" cy="35" r="0.5" fill="#F8FAFC" opacity="0.52" style="animation: pulse 2.6s ease-in-out infinite 3.9s" />
<circle cx="269" cy="69" r="0.5" fill="#A5B4FC" opacity="0.45" style="animation: pulse 4.4s ease-in-out infinite 2.9s" />
<circle cx="155" cy="125" r="0.5" fill="#F8FAFC" opacity="0.24" style="animation: pulse 2.9s ease-in-out infinite 3.5s" />
<circle cx="59" cy="66" r="0.4" fill="#F8FAFC" opacity="0.33" style="animation: pulse 2.5s ease-in-out infinite 3.6s" />
<circle cx="71" cy="87" r="0.7" fill="#38BDF8" opacity="0.43" style="animation: pulse 2.6s ease-in-out infinite 3.9s" />
<circle cx="175" cy="197" r="0.4" fill="#818CF8" opacity="0.61" style="animation: pulse 4.5s ease-in-out infinite 2.7s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


