<circle cx="258" cy="154" r="0.6" fill="#818CF8" opacity="0.60" style="animation: pulse 4.0s ease-in-out infinite 3.2s" />
<circle cx="195" cy="109" r="1.1" fill="#818CF8" opacity="0.42" style="animation: pulse 4.2s ease-in-out infinite 3.5s" />
<circle cx="228" cy="44" r="0.6" fill="#F8FAFC" opacity="0.49" style="animation: pulse 3.9s ease-in-out infinite 3.8s" />
<circle cx="137" cy="131" r="0.9" fill="#38BDF8" opacity="0.63" style="animation: pulse 4.1s ease-in-out infinite 3.9s" />
<circle cx="209" cy="135" r="0.7" fill="#818CF8" opacity="0.84" style="animation: pulse 4.4s ease-in-out infinite 3.4s" />
<circle cx="211" cy="65" r="1.0" fill="#F8FAFC" opacity="0.40" style="animation: pulse 4.8s ease-in-out infinite 0.2s" />
