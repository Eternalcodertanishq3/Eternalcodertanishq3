<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="177" cy="70" r="1.2" fill="#F8FAFC" opacity="0.18" style="animation: pulse 4.2s ease-in-out infinite 3.3s" />
<circle cx="212" cy="90" r="0.9" fill="#38BDF8" opacity="0.79" style="animation: pulse 3.9s ease-in-out infinite 3.3s" />
<circle cx="161" cy="29" r="1.1" fill="#A5B4FC" opacity="0.56" style="animation: pulse 2.7s ease-in-out infinite 2.9s" />
<circle cx="270" cy="195" r="1.1" fill="#A5B4FC" opacity="0.59" style="animation: pulse 3.2s ease-in-out infinite 3.6s" />
<circle cx="188" cy="107" r="0.5" fill="#818CF8" opacity="0.81" style="animation: pulse 4.7s ease-in-out infinite 2.3s" />
<circle cx="43" cy="131" r="0.9" fill="#38BDF8" opacity="0.30" style="animation: pulse 2.1s ease-in-out infinite 0.5s" />
<circle cx="31" cy="17" r="0.8" fill="#818CF8" opacity="0.42" style="animation: pulse 4.4s ease-in-out infinite 4.5s" />
<circle cx="258" cy="2" r="1.0" fill="#38BDF8" opacity="0.70" style="animation: pulse 4.0s ease-in-out infinite 2.3s" />
<circle cx="59" cy="214" r="0.9" fill="#818CF8" opacity="0.78" style="animation: pulse 2.2s ease-in-out infinite 3.0s" />
<circle cx="139" cy="178" r="1.2" fill="#F8FAFC" opacity="0.44" style="animation: pulse 2.2s ease-in-out infinite 0.5s" />
<circle cx="60" cy="14" r="0.5" fill="#F8FAFC" opacity="0.63" style="animation: pulse 3.5s ease-in-out infinite 4.5s" />
<circle cx="61" cy="183" r="1.2" fill="#38BDF8" opacity="0.44" style="animation: pulse 4.5s ease-in-out infinite 4.9s" />
<circle cx="95" cy="69" r="1.1" fill="#38BDF8" opacity="0.60" style="animation: pulse 2.1s ease-in-out infinite 4.5s" />
<circle cx="200" cy="99" r="1.1" fill="#F8FAFC" opacity="0.35" style="animation: pulse 3.9s ease-in-out infinite 0.4s" />
<circle cx="209" cy="147" r="1.2" fill="#38BDF8" opacity="0.30" style="animation: pulse 2.8s ease-in-out infinite 4.4s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>