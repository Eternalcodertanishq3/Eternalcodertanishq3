<circle cx="7" cy="80" r="1.1" fill="#A5B4FC" opacity="0.38" style="animation: pulse 2.4s ease-in-out infinite 3.7s" />
<circle cx="137" cy="124" r="1.2" fill="#38BDF8" opacity="0.40" style="animation: pulse 4.7s ease-in-out infinite 3.1s" />
<circle cx="12" cy="94" r="0.6" fill="#38BDF8" opacity="0.69" style="animation: pulse 4.7s ease-in-out infinite 3.4s" />
<circle cx="68" cy="16" r="0.9" fill="#818CF8" opacity="0.15" style="animation: pulse 2.8s ease-in-out infinite 3.9s" />
<circle cx="85" cy="212" r="1.0" fill="#38BDF8" opacity="0.16" style="animation: pulse 4.4s ease-in-out infinite 4.9s" />
<circle cx="279" cy="132" r="0.9" fill="#A5B4FC" opacity="0.55" style="animation: pulse 4.5s ease-in-out infinite 1.7s" />
<circle cx="86" cy="117" r="1.1" fill="#F8FAFC" opacity="0.47" style="animation: pulse 4.5s ease-in-out infinite 4.7s" />
<circle cx="244" cy="100" r="0.4" fill="#38BDF8" opacity="0.72" style="animation: pulse 3.5s ease-in-out infinite 3.9s" />
<circle cx="277" cy="57" r="0.4" fill="#A5B4FC" opacity="0.34" style="animation: pulse 4.8s ease-in-out infinite 1.6s" />
<circle cx="170" cy="67" r="1.1" fill="#818CF8" opacity="0.61" style="animation: pulse 3.1s ease-in-out infinite 0.6s" />
<circle cx="167" cy="190" r="0.6" fill="#F8FAFC" opacity="0.16" style="animation: pulse 3.7s ease-in-out infinite 0.4s" />
<circle cx="25" cy="93" r="0.9" fill="#818CF8" opacity="0.50" style="animation: pulse 4.1s ease-in-out infinite 4.3s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
