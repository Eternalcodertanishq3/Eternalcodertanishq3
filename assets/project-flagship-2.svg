<circle cx="118" cy="68" r="0.9" fill="#F8FAFC" opacity="0.38" style="animation: pulse 2.9s ease-in-out infinite 1.3s" />
<circle cx="240" cy="31" r="1.0" fill="#A5B4FC" opacity="0.44" style="animation: pulse 3.1s ease-in-out infinite 1.2s" />
<circle cx="15" cy="45" r="0.4" fill="#A5B4FC" opacity="0.42" style="animation: pulse 3.8s ease-in-out infinite 2.0s" />
<circle cx="84" cy="192" r="1.1" fill="#F8FAFC" opacity="0.35" style="animation: pulse 3.1s ease-in-out infinite 1.8s" />
<circle cx="64" cy="89" r="0.6" fill="#818CF8" opacity="0.71" style="animation: pulse 3.8s ease-in-out infinite 0.0s" />
<circle cx="89" cy="150" r="0.5" fill="#F8FAFC" opacity="0.72" style="animation: pulse 2.7s ease-in-out infinite 3.2s" />
<circle cx="107" cy="126" r="0.8" fill="#F8FAFC" opacity="0.68" style="animation: pulse 4.3s ease-in-out infinite 4.9s" />
<circle cx="78" cy="76" r="1.2" fill="#F8FAFC" opacity="0.78" style="animation: pulse 4.0s ease-in-out infinite 3.7s" />
<circle cx="222" cy="3" r="0.9" fill="#F8FAFC" opacity="0.22" style="animation: pulse 2.6s ease-in-out infinite 1.5s" />
<circle cx="41" cy="201" r="0.9" fill="#38BDF8" opacity="0.39" style="animation: pulse 3.4s ease-in-out infinite 0.5s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

