<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="64" cy="129" r="0.7" fill="#F8FAFC" opacity="0.78" style="animation: pulse 4.0s ease-in-out infinite 3.7s" />
<circle cx="142" cy="131" r="0.5" fill="#F8FAFC" opacity="0.16" style="animation: pulse 2.3s ease-in-out infinite 4.6s" />
<circle cx="94" cy="6" r="0.5" fill="#A5B4FC" opacity="0.56" style="animation: pulse 3.1s ease-in-out infinite 3.4s" />
<circle cx="102" cy="13" r="0.8" fill="#38BDF8" opacity="0.83" style="animation: pulse 2.4s ease-in-out infinite 0.6s" />
<circle cx="128" cy="20" r="0.7" fill="#818CF8" opacity="0.25" style="animation: pulse 4.7s ease-in-out infinite 0.7s" />
<circle cx="79" cy="218" r="1.1" fill="#38BDF8" opacity="0.62" style="animation: pulse 4.3s ease-in-out infinite 1.6s" />
<circle cx="1" cy="106" r="1.0" fill="#F8FAFC" opacity="0.69" style="animation: pulse 4.0s ease-in-out infinite 4.3s" />
<circle cx="157" cy="7" r="1.1" fill="#818CF8" opacity="0.15" style="animation: pulse 3.7s ease-in-out infinite 3.2s" />
<circle cx="100" cy="55" r="0.6" fill="#A5B4FC" opacity="0.53" style="animation: pulse 4.2s ease-in-out infinite 4.1s" />
<circle cx="56" cy="178" r="0.7" fill="#F8FAFC" opacity="0.75" style="animation: pulse 4.8s ease-in-out infinite 4.4s" />
<circle cx="144" cy="136" r="0.7" fill="#F8FAFC" opacity="0.60" style="animation: pulse 3.7s ease-in-out infinite 0.5s" />
<circle cx="113" cy="3" r="0.6" fill="#F8FAFC" opacity="0.58" style="animation: pulse 2.9s ease-in-out infinite 3.3s" />
<circle cx="154" cy="74" r="0.8" fill="#38BDF8" opacity="0.16" style="animation: pulse 2.4s ease-in-out infinite 1.7s" />
<circle cx="257" cy="51" r="0.9" fill="#F8FAFC" opacity="0.26" style="animation: pulse 3.3s ease-in-out infinite 1.6s" />
<circle cx="213" cy="197" r="0.9" fill="#818CF8" opacity="0.52" style="animation: pulse 2.3s ease-in-out infinite 1.4s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>