<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="4" cy="192" r="0.8" fill="#818CF8" opacity="0.33" style="animation: pulse 3.9s ease-in-out infinite 4.0s" />
<circle cx="26" cy="191" r="0.5" fill="#38BDF8" opacity="0.22" style="animation: pulse 3.3s ease-in-out infinite 3.8s" />
<circle cx="224" cy="1" r="0.9" fill="#F8FAFC" opacity="0.23" style="animation: pulse 2.8s ease-in-out infinite 1.3s" />
<circle cx="115" cy="45" r="1.2" fill="#38BDF8" opacity="0.69" style="animation: pulse 4.0s ease-in-out infinite 2.2s" />
<circle cx="77" cy="72" r="0.8" fill="#F8FAFC" opacity="0.73" style="animation: pulse 3.8s ease-in-out infinite 2.0s" />
<circle cx="27" cy="161" r="1.2" fill="#A5B4FC" opacity="0.70" style="animation: pulse 3.5s ease-in-out infinite 2.9s" />
<circle cx="46" cy="201" r="0.5" fill="#818CF8" opacity="0.65" style="animation: pulse 3.6s ease-in-out infinite 4.5s" />
<circle cx="85" cy="128" r="0.9" fill="#38BDF8" opacity="0.21" style="animation: pulse 3.2s ease-in-out infinite 0.9s" />
<circle cx="79" cy="67" r="0.6" fill="#F8FAFC" opacity="0.22" style="animation: pulse 3.6s ease-in-out infinite 2.2s" />
<circle cx="250" cy="138" r="0.5" fill="#818CF8" opacity="0.27" style="animation: pulse 3.4s ease-in-out infinite 3.1s" />
<circle cx="121" cy="65" r="1.0" fill="#38BDF8" opacity="0.55" style="animation: pulse 4.9s ease-in-out infinite 4.4s" />
<circle cx="96" cy="116" r="1.1" fill="#A5B4FC" opacity="0.17" style="animation: pulse 4.1s ease-in-out infinite 3.0s" />
<circle cx="257" cy="146" r="0.6" fill="#818CF8" opacity="0.67" style="animation: pulse 2.4s ease-in-out infinite 1.9s" />
<circle cx="152" cy="123" r="0.9" fill="#A5B4FC" opacity="0.18" style="animation: pulse 2.3s ease-in-out infinite 1.9s" />
<circle cx="73" cy="187" r="0.6" fill="#818CF8" opacity="0.31" style="animation: pulse 3.3s ease-in-out infinite 0.3s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>