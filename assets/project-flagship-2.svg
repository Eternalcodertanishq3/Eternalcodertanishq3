<circle cx="211" cy="119" r="0.5" fill="#38BDF8" opacity="0.59" style="animation: pulse 3.7s ease-in-out infinite 0.8s" />
<circle cx="199" cy="191" r="1.0" fill="#A5B4FC" opacity="0.52" style="animation: pulse 2.5s ease-in-out infinite 4.3s" />
<circle cx="95" cy="112" r="0.4" fill="#A5B4FC" opacity="0.35" style="animation: pulse 4.1s ease-in-out infinite 4.2s" />
<circle cx="16" cy="126" r="0.9" fill="#818CF8" opacity="0.38" style="animation: pulse 4.2s ease-in-out infinite 0.4s" />
<circle cx="270" cy="49" r="0.8" fill="#38BDF8" opacity="0.22" style="animation: pulse 4.2s ease-in-out infinite 3.2s" />
<circle cx="46" cy="5" r="0.5" fill="#F8FAFC" opacity="0.33" style="animation: pulse 2.4s ease-in-out infinite 2.9s" />
<circle cx="116" cy="88" r="0.6" fill="#38BDF8" opacity="0.34" style="animation: pulse 2.6s ease-in-out infinite 2.6s" />
<circle cx="61" cy="68" r="1.0" fill="#38BDF8" opacity="0.75" style="animation: pulse 3.1s ease-in-out infinite 3.3s" />
<circle cx="232" cy="216" r="1.1" fill="#818CF8" opacity="0.40" style="animation: pulse 3.1s ease-in-out infinite 4.7s" />
<circle cx="85" cy="121" r="0.7" fill="#818CF8" opacity="0.62" style="animation: pulse 3.3s ease-in-out infinite 3.1s" />
<circle cx="212" cy="157" r="0.7" fill="#38BDF8" opacity="0.39" style="animation: pulse 3.4s ease-in-out infinite 2.6s" />
<circle cx="153" cy="72" r="0.6" fill="#818CF8" opacity="0.82" style="animation: pulse 3.9s ease-in-out infinite 4.7s" />
<circle cx="49" cy="136" r="0.4" fill="#818CF8" opacity="0.21" style="animation: pulse 2.7s ease-in-out infinite 2.1s" />
<circle cx="157" cy="76" r="0.6" fill="#38BDF8" opacity="0.31" style="animation: pulse 2.6s ease-in-out infinite 1.5s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
