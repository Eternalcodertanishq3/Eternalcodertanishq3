<circle cx="86" cy="9" r="0.8" fill="#A5B4FC" opacity="0.75" style="animation: pulse 2.8s ease-in-out infinite 3.6s" />
<circle cx="89" cy="105" r="0.7" fill="#818CF8" opacity="0.48" style="animation: pulse 4.6s ease-in-out infinite 0.7s" />
<circle cx="70" cy="46" r="0.5" fill="#A5B4FC" opacity="0.37" style="animation: pulse 4.5s ease-in-out infinite 1.8s" />
<circle cx="41" cy="84" r="0.5" fill="#38BDF8" opacity="0.43" style="animation: pulse 2.5s ease-in-out infinite 2.3s" />
<circle cx="77" cy="41" r="1.0" fill="#38BDF8" opacity="0.55" style="animation: pulse 3.3s ease-in-out infinite 2.1s" />
<circle cx="151" cy="175" r="0.6" fill="#F8FAFC" opacity="0.34" style="animation: pulse 3.0s ease-in-out infinite 3.8s" />
<circle cx="278" cy="26" r="0.8" fill="#F8FAFC" opacity="0.69" style="animation: pulse 4.2s ease-in-out infinite 4.3s" />
<circle cx="77" cy="200" r="1.0" fill="#A5B4FC" opacity="0.55" style="animation: pulse 2.5s ease-in-out infinite 3.9s" />
<circle cx="21" cy="196" r="1.0" fill="#A5B4FC" opacity="0.31" style="animation: pulse 4.2s ease-in-out infinite 2.1s" />
<circle cx="72" cy="83" r="0.5" fill="#F8FAFC" opacity="0.77" style="animation: pulse 3.7s ease-in-out infinite 2.9s" />
<circle cx="19" cy="64" r="0.7" fill="#F8FAFC" opacity="0.45" style="animation: pulse 3.7s ease-in-out infinite 1.6s" />
<circle cx="176" cy="21" r="0.6" fill="#A5B4FC" opacity="0.61" style="animation: pulse 3.8s ease-in-out infinite 4.0s" />
<circle cx="93" cy="218" r="0.6" fill="#38BDF8" opacity="0.68" style="animation: pulse 3.3s ease-in-out infinite 1.9s" />
<circle cx="173" cy="24" r="1.0" fill="#F8FAFC" opacity="0.70" style="animation: pulse 3.0s ease-in-out infinite 2.2s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>