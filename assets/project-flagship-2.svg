<circle cx="38" cy="23" r="0.8" fill="#F8FAFC" opacity="0.51" style="animation: pulse 3.2s ease-in-out infinite 0.7s" />
<circle cx="54" cy="27" r="0.8" fill="#A5B4FC" opacity="0.46" style="animation: pulse 4.8s ease-in-out infinite 2.3s" />
<circle cx="42" cy="67" r="0.4" fill="#F8FAFC" opacity="0.81" style="animation: pulse 4.6s ease-in-out infinite 2.4s" />
<circle cx="241" cy="35" r="0.5" fill="#F8FAFC" opacity="0.58" style="animation: pulse 2.8s ease-in-out infinite 0.3s" />
<circle cx="27" cy="191" r="0.5" fill="#F8FAFC" opacity="0.36" style="animation: pulse 3.6s ease-in-out infinite 1.3s" />
<circle cx="149" cy="83" r="0.7" fill="#818CF8" opacity="0.25" style="animation: pulse 2.2s ease-in-out infinite 3.1s" />
<circle cx="95" cy="167" r="0.7" fill="#38BDF8" opacity="0.61" style="animation: pulse 4.0s ease-in-out infinite 0.8s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


