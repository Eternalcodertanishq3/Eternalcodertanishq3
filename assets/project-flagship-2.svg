<circle cx="170" cy="50" r="0.5" fill="#38BDF8" opacity="0.46" style="animation: pulse 2.8s ease-in-out infinite 2.2s" />
<circle cx="193" cy="67" r="0.6" fill="#A5B4FC" opacity="0.67" style="animation: pulse 4.3s ease-in-out infinite 2.5s" />
<circle cx="222" cy="172" r="1.2" fill="#818CF8" opacity="0.63" style="animation: pulse 3.5s ease-in-out infinite 3.3s" />
<circle cx="173" cy="197" r="0.7" fill="#F8FAFC" opacity="0.76" style="animation: pulse 4.9s ease-in-out infinite 2.2s" />
<circle cx="6" cy="180" r="0.4" fill="#F8FAFC" opacity="0.67" style="animation: pulse 4.2s ease-in-out infinite 4.5s" />
<circle cx="1" cy="168" r="0.6" fill="#A5B4FC" opacity="0.40" style="animation: pulse 4.5s ease-in-out infinite 0.3s" />
