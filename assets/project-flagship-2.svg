<circle cx="90" cy="92" r="0.6" fill="#818CF8" opacity="0.67" style="animation: pulse 4.6s ease-in-out infinite 0.2s" />
<circle cx="7" cy="124" r="0.6" fill="#F8FAFC" opacity="0.52" style="animation: pulse 4.7s ease-in-out infinite 4.3s" />
<circle cx="276" cy="111" r="0.5" fill="#A5B4FC" opacity="0.49" style="animation: pulse 2.3s ease-in-out infinite 1.8s" />
<circle cx="189" cy="107" r="0.4" fill="#A5B4FC" opacity="0.23" style="animation: pulse 2.4s ease-in-out infinite 4.8s" />
<circle cx="98" cy="211" r="0.8" fill="#38BDF8" opacity="0.71" style="animation: pulse 3.0s ease-in-out infinite 2.2s" />
<circle cx="64" cy="97" r="0.6" fill="#A5B4FC" opacity="0.21" style="animation: pulse 2.1s ease-in-out infinite 1.8s" />
<circle cx="66" cy="31" r="0.8" fill="#818CF8" opacity="0.60" style="animation: pulse 3.5s ease-in-out infinite 3.4s" />
<circle cx="147" cy="128" r="0.6" fill="#818CF8" opacity="0.79" style="animation: pulse 3.5s ease-in-out infinite 0.7s" />
<circle cx="243" cy="11" r="0.8" fill="#A5B4FC" opacity="0.53" style="animation: pulse 2.3s ease-in-out infinite 3.7s" />
<circle cx="220" cy="202" r="0.8" fill="#F8FAFC" opacity="0.71" style="animation: pulse 2.1s ease-in-out infinite 4.5s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
