<circle cx="55" cy="125" r="1.0" fill="#F8FAFC" opacity="0.64" style="animation: pulse 3.4s ease-in-out infinite 1.4s" />
<circle cx="179" cy="115" r="0.7" fill="#818CF8" opacity="0.45" style="animation: pulse 2.4s ease-in-out infinite 1.2s" />
<circle cx="77" cy="47" r="0.8" fill="#38BDF8" opacity="0.50" style="animation: pulse 2.8s ease-in-out infinite 1.8s" />
