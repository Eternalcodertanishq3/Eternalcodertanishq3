<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="141" cy="180" r="0.8" fill="#F8FAFC" opacity="0.60" style="animation: pulse 2.1s ease-in-out infinite 2.1s" />
<circle cx="34" cy="193" r="1.0" fill="#38BDF8" opacity="0.22" style="animation: pulse 3.4s ease-in-out infinite 0.4s" />
<circle cx="178" cy="132" r="1.0" fill="#A5B4FC" opacity="0.85" style="animation: pulse 4.8s ease-in-out infinite 4.1s" />
<circle cx="257" cy="196" r="0.8" fill="#A5B4FC" opacity="0.20" style="animation: pulse 4.2s ease-in-out infinite 4.1s" />
<circle cx="226" cy="165" r="0.4" fill="#F8FAFC" opacity="0.43" style="animation: pulse 3.1s ease-in-out infinite 3.5s" />
<circle cx="105" cy="54" r="0.8" fill="#818CF8" opacity="0.42" style="animation: pulse 2.2s ease-in-out infinite 2.5s" />
<circle cx="196" cy="6" r="0.8" fill="#818CF8" opacity="0.18" style="animation: pulse 4.7s ease-in-out infinite 1.6s" />
<circle cx="32" cy="11" r="0.7" fill="#F8FAFC" opacity="0.62" style="animation: pulse 2.3s ease-in-out infinite 3.1s" />
<circle cx="149" cy="28" r="0.7" fill="#A5B4FC" opacity="0.72" style="animation: pulse 3.0s ease-in-out infinite 0.3s" />
<circle cx="92" cy="124" r="0.4" fill="#F8FAFC" opacity="0.21" style="animation: pulse 4.3s ease-in-out infinite 2.9s" />
<circle cx="58" cy="191" r="1.0" fill="#38BDF8" opacity="0.20" style="animation: pulse 3.5s ease-in-out infinite 4.3s" />
<circle cx="3" cy="192" r="0.6" fill="#F8FAFC" opacity="0.36" style="animation: pulse 4.7s ease-in-out infinite 4.0s" />
<circle cx="246" cy="168" r="0.8" fill="#38BDF8" opacity="0.21" style="animation: pulse 3.2s ease-in-out infinite 0.5s" />
<circle cx="268" cy="202" r="1.1" fill="#F8FAFC" opacity="0.40" style="animation: pulse 3.9s ease-in-out infinite 1.4s" />
<circle cx="44" cy="203" r="0.7" fill="#F8FAFC" opacity="0.61" style="animation: pulse 3.1s ease-in-out infinite 4.3s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>