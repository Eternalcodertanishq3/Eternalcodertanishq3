<circle cx="236" cy="98" r="1.2" fill="#A5B4FC" opacity="0.50" style="animation: pulse 4.2s ease-in-out infinite 0.6s" />
<circle cx="36" cy="142" r="0.7" fill="#F8FAFC" opacity="0.27" style="animation: pulse 4.8s ease-in-out infinite 1.1s" />
<circle cx="259" cy="73" r="0.8" fill="#818CF8" opacity="0.80" style="animation: pulse 3.9s ease-in-out infinite 3.1s" />
<circle cx="121" cy="168" r="0.6" fill="#F8FAFC" opacity="0.31" style="animation: pulse 4.4s ease-in-out infinite 1.2s" />
<circle cx="222" cy="66" r="0.8" fill="#A5B4FC" opacity="0.69" style="animation: pulse 4.9s ease-in-out infinite 3.4s" />
<circle cx="78" cy="82" r="0.6" fill="#818CF8" opacity="0.33" style="animation: pulse 4.1s ease-in-out infinite 2.4s" />
