<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="204" cy="28" r="0.7" fill="#38BDF8" opacity="0.71" style="animation: pulse 4.2s ease-in-out infinite 0.3s" />
<circle cx="188" cy="54" r="1.0" fill="#F8FAFC" opacity="0.76" style="animation: pulse 3.3s ease-in-out infinite 1.1s" />
<circle cx="52" cy="134" r="0.8" fill="#818CF8" opacity="0.45" style="animation: pulse 4.8s ease-in-out infinite 0.3s" />
<circle cx="213" cy="3" r="0.9" fill="#38BDF8" opacity="0.37" style="animation: pulse 4.0s ease-in-out infinite 2.2s" />
<circle cx="255" cy="156" r="0.6" fill="#818CF8" opacity="0.70" style="animation: pulse 4.9s ease-in-out infinite 3.3s" />
<circle cx="198" cy="91" r="1.1" fill="#818CF8" opacity="0.48" style="animation: pulse 4.5s ease-in-out infinite 1.5s" />
<circle cx="102" cy="174" r="1.1" fill="#F8FAFC" opacity="0.51" style="animation: pulse 2.6s ease-in-out infinite 0.0s" />
<circle cx="234" cy="165" r="0.4" fill="#F8FAFC" opacity="0.60" style="animation: pulse 2.0s ease-in-out infinite 2.4s" />
<circle cx="272" cy="159" r="0.6" fill="#A5B4FC" opacity="0.30" style="animation: pulse 3.1s ease-in-out infinite 2.3s" />
<circle cx="141" cy="185" r="1.1" fill="#A5B4FC" opacity="0.30" style="animation: pulse 4.8s ease-in-out infinite 4.2s" />
<circle cx="273" cy="13" r="0.4" fill="#A5B4FC" opacity="0.50" style="animation: pulse 3.0s ease-in-out infinite 0.1s" />
<circle cx="186" cy="165" r="1.1" fill="#F8FAFC" opacity="0.24" style="animation: pulse 4.4s ease-in-out infinite 0.9s" />
<circle cx="55" cy="191" r="0.7" fill="#A5B4FC" opacity="0.75" style="animation: pulse 4.2s ease-in-out infinite 2.1s" />
<circle cx="173" cy="191" r="1.0" fill="#A5B4FC" opacity="0.82" style="animation: pulse 4.7s ease-in-out infinite 4.5s" />
<circle cx="196" cy="21" r="0.5" fill="#A5B4FC" opacity="0.41" style="animation: pulse 4.7s ease-in-out infinite 3.6s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>