<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <style>
      .font-sans { font-family: system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: ui-monospace, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card body -->
  <rect width="280" height="220" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Stars -->
  <circle cx="130" cy="213" r="0.8" fill="#A5B4FC" opacity="0.42" style="animation: pulse 4.7s ease-in-out infinite 2.8s" />
<circle cx="41" cy="53" r="0.9" fill="#F8FAFC" opacity="0.25" style="animation: pulse 4.8s ease-in-out infinite 1.6s" />
<circle cx="239" cy="170" r="0.6" fill="#F8FAFC" opacity="0.54" style="animation: pulse 4.2s ease-in-out infinite 1.4s" />
<circle cx="77" cy="85" r="0.6" fill="#A5B4FC" opacity="0.18" style="animation: pulse 3.6s ease-in-out infinite 1.3s" />
<circle cx="211" cy="156" r="0.8" fill="#38BDF8" opacity="0.41" style="animation: pulse 3.8s ease-in-out infinite 2.4s" />
<circle cx="89" cy="5" r="0.5" fill="#38BDF8" opacity="0.82" style="animation: pulse 2.1s ease-in-out infinite 0.6s" />
<circle cx="234" cy="195" r="0.4" fill="#38BDF8" opacity="0.30" style="animation: pulse 3.0s ease-in-out infinite 0.0s" />
<circle cx="44" cy="205" r="0.4" fill="#F8FAFC" opacity="0.85" style="animation: pulse 4.9s ease-in-out infinite 0.5s" />
<circle cx="279" cy="61" r="0.9" fill="#38BDF8" opacity="0.39" style="animation: pulse 3.2s ease-in-out infinite 2.5s" />
<circle cx="120" cy="195" r="0.5" fill="#818CF8" opacity="0.27" style="animation: pulse 3.8s ease-in-out infinite 2.0s" />
<circle cx="97" cy="136" r="1.1" fill="#A5B4FC" opacity="0.29" style="animation: pulse 3.9s ease-in-out infinite 0.8s" />
<circle cx="82" cy="110" r="0.6" fill="#38BDF8" opacity="0.79" style="animation: pulse 4.2s ease-in-out infinite 4.9s" />
<circle cx="60" cy="121" r="1.1" fill="#F8FAFC" opacity="0.42" style="animation: pulse 2.9s ease-in-out infinite 0.5s" />
<circle cx="170" cy="150" r="1.0" fill="#A5B4FC" opacity="0.82" style="animation: pulse 3.8s ease-in-out infinite 4.3s" />
<circle cx="223" cy="101" r="1.0" fill="#38BDF8" opacity="0.20" style="animation: pulse 2.6s ease-in-out infinite 1.9s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
    <circle cx="28" cy="186" r="4.5" fill="#3572A5" />
    <text x="38" y="190" fill="#94A3B8" font-size="13.5" class="font-sans">Python</text>
    <text x="256" y="190" fill="#C084FC" font-size="13.5" font-weight="700" class="font-mono" text-anchor="end">Autodiff</text>
    
</svg>