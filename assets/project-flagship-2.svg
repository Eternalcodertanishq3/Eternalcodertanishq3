<circle cx="254" cy="214" r="0.6" fill="#F8FAFC" opacity="0.42" style="animation: pulse 4.1s ease-in-out infinite 3.4s" />
<circle cx="212" cy="32" r="0.5" fill="#A5B4FC" opacity="0.77" style="animation: pulse 2.5s ease-in-out infinite 3.2s" />
<circle cx="207" cy="217" r="0.6" fill="#F8FAFC" opacity="0.29" style="animation: pulse 3.3s ease-in-out infinite 2.9s" />
<circle cx="209" cy="172" r="1.2" fill="#818CF8" opacity="0.65" style="animation: pulse 3.5s ease-in-out infinite 3.9s" />
<circle cx="219" cy="186" r="0.6" fill="#F8FAFC" opacity="0.82" style="animation: pulse 2.3s ease-in-out infinite 1.1s" />
<circle cx="240" cy="37" r="1.2" fill="#818CF8" opacity="0.25" style="animation: pulse 2.1s ease-in-out infinite 2.4s" />
<circle cx="87" cy="40" r="0.7" fill="#A5B4FC" opacity="0.20" style="animation: pulse 3.5s ease-in-out infinite 3.8s" />
<circle cx="246" cy="18" r="0.5" fill="#38BDF8" opacity="0.18" style="animation: pulse 2.3s ease-in-out infinite 2.9s" />
<circle cx="263" cy="164" r="0.6" fill="#818CF8" opacity="0.36" style="animation: pulse 4.3s ease-in-out infinite 3.9s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

