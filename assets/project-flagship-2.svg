<circle cx="169" cy="28" r="1.1" fill="#38BDF8" opacity="0.65" style="animation: pulse 2.6s ease-in-out infinite 4.3s" />
<circle cx="266" cy="38" r="0.8" fill="#38BDF8" opacity="0.49" style="animation: pulse 4.5s ease-in-out infinite 3.7s" />
<circle cx="105" cy="7" r="1.1" fill="#F8FAFC" opacity="0.55" style="animation: pulse 2.4s ease-in-out infinite 3.1s" />
<circle cx="235" cy="85" r="1.1" fill="#A5B4FC" opacity="0.23" style="animation: pulse 4.8s ease-in-out infinite 1.4s" />
<circle cx="148" cy="165" r="0.5" fill="#F8FAFC" opacity="0.56" style="animation: pulse 4.1s ease-in-out infinite 0.0s" />
