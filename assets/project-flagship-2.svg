<circle cx="156" cy="112" r="0.8" fill="#38BDF8" opacity="0.34" style="animation: pulse 3.6s ease-in-out infinite 4.4s" />
<circle cx="279" cy="216" r="1.1" fill="#A5B4FC" opacity="0.25" style="animation: pulse 4.1s ease-in-out infinite 4.3s" />
<circle cx="72" cy="217" r="0.7" fill="#A5B4FC" opacity="0.52" style="animation: pulse 2.5s ease-in-out infinite 3.2s" />
<circle cx="75" cy="83" r="0.4" fill="#A5B4FC" opacity="0.51" style="animation: pulse 3.7s ease-in-out infinite 4.8s" />
<circle cx="236" cy="173" r="0.5" fill="#A5B4FC" opacity="0.58" style="animation: pulse 3.4s ease-in-out infinite 2.9s" />
<circle cx="223" cy="14" r="1.2" fill="#38BDF8" opacity="0.42" style="animation: pulse 2.2s ease-in-out infinite 1.1s" />
<circle cx="125" cy="140" r="0.4" fill="#F8FAFC" opacity="0.64" style="animation: pulse 4.7s ease-in-out infinite 0.9s" />
<circle cx="142" cy="17" r="0.8" fill="#38BDF8" opacity="0.44" style="animation: pulse 4.0s ease-in-out infinite 3.8s" />
<circle cx="8" cy="179" r="0.6" fill="#38BDF8" opacity="0.72" style="animation: pulse 4.7s ease-in-out infinite 0.7s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
