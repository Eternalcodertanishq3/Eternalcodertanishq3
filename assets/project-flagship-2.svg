<circle cx="76" cy="153" r="1.0" fill="#F8FAFC" opacity="0.76" style="animation: pulse 3.4s ease-in-out infinite 0.5s" />
<circle cx="263" cy="193" r="0.7" fill="#38BDF8" opacity="0.54" style="animation: pulse 3.6s ease-in-out infinite 2.0s" />
<circle cx="142" cy="182" r="1.0" fill="#818CF8" opacity="0.75" style="animation: pulse 4.8s ease-in-out infinite 2.7s" />
<circle cx="104" cy="14" r="0.5" fill="#818CF8" opacity="0.67" style="animation: pulse 4.8s ease-in-out infinite 2.2s" />
<circle cx="209" cy="36" r="0.9" fill="#818CF8" opacity="0.70" style="animation: pulse 2.5s ease-in-out infinite 4.0s" />
<circle cx="153" cy="43" r="0.7" fill="#818CF8" opacity="0.24" style="animation: pulse 3.0s ease-in-out infinite 0.8s" />
<circle cx="260" cy="72" r="0.9" fill="#818CF8" opacity="0.47" style="animation: pulse 3.7s ease-in-out infinite 1.3s" />
<circle cx="35" cy="198" r="0.9" fill="#F8FAFC" opacity="0.36" style="animation: pulse 4.7s ease-in-out infinite 0.9s" />
<circle cx="276" cy="0" r="0.6" fill="#38BDF8" opacity="0.81" style="animation: pulse 4.1s ease-in-out infinite 4.5s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
