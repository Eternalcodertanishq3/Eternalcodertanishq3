<circle cx="125" cy="173" r="0.8" fill="#38BDF8" opacity="0.59" style="animation: pulse 2.2s ease-in-out infinite 4.5s" />
<circle cx="43" cy="42" r="0.8" fill="#F8FAFC" opacity="0.22" style="animation: pulse 3.6s ease-in-out infinite 3.2s" />
<circle cx="205" cy="57" r="0.4" fill="#F8FAFC" opacity="0.83" style="animation: pulse 3.1s ease-in-out infinite 3.0s" />
<circle cx="38" cy="124" r="0.5" fill="#38BDF8" opacity="0.71" style="animation: pulse 2.9s ease-in-out infinite 1.0s" />
<circle cx="222" cy="86" r="0.8" fill="#F8FAFC" opacity="0.70" style="animation: pulse 5.0s ease-in-out infinite 4.6s" />
<circle cx="156" cy="63" r="0.5" fill="#F8FAFC" opacity="0.70" style="animation: pulse 3.0s ease-in-out infinite 1.8s" />
<circle cx="217" cy="119" r="1.1" fill="#F8FAFC" opacity="0.38" style="animation: pulse 3.4s ease-in-out infinite 1.4s" />
<circle cx="9" cy="146" r="0.5" fill="#818CF8" opacity="0.83" style="animation: pulse 3.9s ease-in-out infinite 3.6s" />
<circle cx="148" cy="41" r="1.1" fill="#818CF8" opacity="0.60" style="animation: pulse 4.1s ease-in-out infinite 2.6s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

