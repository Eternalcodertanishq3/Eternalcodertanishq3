<circle cx="31" cy="216" r="1.1" fill="#38BDF8" opacity="0.83" style="animation: pulse 2.3s ease-in-out infinite 4.8s" />
<circle cx="114" cy="199" r="0.9" fill="#38BDF8" opacity="0.27" style="animation: pulse 4.9s ease-in-out infinite 2.2s" />
<circle cx="74" cy="70" r="0.9" fill="#F8FAFC" opacity="0.47" style="animation: pulse 2.2s ease-in-out infinite 2.3s" />
<circle cx="276" cy="37" r="0.4" fill="#818CF8" opacity="0.44" style="animation: pulse 3.9s ease-in-out infinite 4.6s" />
<circle cx="201" cy="24" r="0.5" fill="#F8FAFC" opacity="0.22" style="animation: pulse 3.3s ease-in-out infinite 2.5s" />
<circle cx="181" cy="30" r="0.6" fill="#F8FAFC" opacity="0.79" style="animation: pulse 4.1s ease-in-out infinite 2.0s" />
<circle cx="236" cy="39" r="0.8" fill="#F8FAFC" opacity="0.23" style="animation: pulse 4.7s ease-in-out infinite 0.2s" />
<circle cx="60" cy="35" r="0.7" fill="#818CF8" opacity="0.57" style="animation: pulse 2.0s ease-in-out infinite 2.1s" />
<circle cx="265" cy="75" r="0.8" fill="#818CF8" opacity="0.62" style="animation: pulse 4.7s ease-in-out infinite 3.9s" />
<circle cx="191" cy="144" r="1.0" fill="#38BDF8" opacity="0.20" style="animation: pulse 3.0s ease-in-out infinite 3.7s" />


  <!-- Header -->
  <text x="24" y="40" fill="#38BDF8" font-size="18" font-weight="700" class="font-sans">🔬 miniGrad</text>
  <line x1="24" y1="54" x2="256" y2="54" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Description -->
  <text x="24" y="82" fill="#94A3B8" font-size="14.5" class="font-sans">Deep learning framework built</text>
<text x="24" y="104" fill="#94A3B8" font-size="14.5" class="font-sans">from scratch in NumPy —</text>


  <!-- Commit message -->
  

  <!-- Footer Divider -->
  <line x1="24" y1="170" x2="256" y2="170" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />

  <!-- Footer -->
  
